name: FAULTLINESMPJAR
version: 2.0.0
main: net.faultlinesmp.bundle.Bundle
api-version: '1.21'
load: STARTUP
author: Faultline SMP
description: Every Faultline SMP plugin in one jar. Loads the 12 plugins inside it (their data stays in plugins/<Name>/).
softdepend: [floodgate, Geyser-Spigot, DonutCombat]
commands:
  faultlinesmpjar:
    description: Shows which bundled Faultline plugins are running.
    permission: faultlinesmpjar.admin
    aliases: [fsmp]
  faultline:
    description: "/faultline reload: swap in the new Faultline plugins from the FAULTLINESMPJAR.jar in plugins/ without a restart."
    usage: /faultline reload [force]
    permission: faultlinesmpjar.admin
permissions:
  faultlinesmpjar.admin:
    default: op

# Faultline SMP - Bosses

# The boss resource pack (3D model, textures, sounds). Upload FaultlineBossesPack.zip
# to your GitHub repo and paste its RAW link here. The hash is already correct.
resource-pack:
  # Leave blank: the boss models, sounds, and music are in the ONE combined pack (FaultlineSMP.zip),
  # which FaultlineItems sends. Only fill these in to send a separate boss pack.
  url: ""
  hash: ""

bosses:
  damage-multiplier: 1.3     # every boss's attacks (2.0.0: was demon-eye.damage-multiplier, still read)
  model-flip: true

kraken:
  health: 2200
  defense: 0.3
  damage-multiplier: 1.2      # all his damage (+20%)
  scale: 4.0                  # model size (4 = a head about 9 blocks tall)
  min-depth: 15               # blocks of water needed to summon him
  sink-ticks: 160             # the worm sinks for 8 seconds before he comes
  abyssal:                    # the ABYSSAL KRAKEN: a Bait Worm dropped in the Dark Ocean (any open water this deep)
    enabled: true
    world: faultline_deep
    min-depth: 60             # blocks of water under the worm (max 63)
    scale: 14.0               # 3.5x the normal Kraken (head ~25 wide). Was 40 (10x): players lagged; an old 40 reads as 14
    health: 9000
    damage-multiplier: 1.5    # on top of his normal damage
    hit-scale: 1.5            # how much bigger his hit areas get (rings, ink, surge...): smaller than his size, so you can dodge
    move-scale: 1.4           # how much faster he swims
    reach-scale: 1.6          # how far he notices fighters, plays music, shows his bar
    station: 20               # how far from his prey his head hangs
    station-height: 8         # ...and how high above them (his beak and arms hang low)
    arena-radius: 70
    rest-multiplier: 0.75     # shorter rests between moves
    pink-multiplier: 3.0      # pink bubbles hurt him 3x as much
    reward-multiplier: 2.0    # bags, diamonds, XP
    dark-loot-bags: 4
    dark-loot-rare-chance: 0.5
    netherite: 2
    cross-chance: 0.5         # the Cross (a piece of the Ankh Shield; was the Dune worm's)
    damage:
      clap: 26                # Abyssal Clap
      ink-per-second: 3       # Ink Storm
      arm-touch: 6            # swimming into one of his arms
  cooldown-minutes: 10
  arena-radius: 24            # how far he swims from where he rose
  phase2-at: 0.66
  phase3-at: 0.33
  phase1-speed: 0.6           # slow: you can read and dodge everything
  phase2-speed: 0.85
  phase3-speed: 1.05
  pink-bubble-seconds: 15
  pink-damage-min: 150        # exact damage (his defense doesn't reduce it)
  pink-damage-max: 200
  tentacle-hit-multiplier: 0.5
  air-bubble-scale: 3.0
  eel-health: 8
  eel-every-ticks: 200
  max-eels: 6
  out-of-water:               # leave the water and he smashes you
    warn-ticks: 30
    smash-ticks: 50
    smash-fraction: 0.55      # of your max health, ignoring armor: two smashes kill
  damage:
    slam: 22
    bite: 20
    grip-per-second: 4
    whirlpool-bite: 8
    barnacle: 8
    surge: 15
    barrage: 17
    eel-zap: 5
    crush-per-second: 4
  rewards:
    mythic-bags: 18
    diamonds-min: 16
    diamonds-extra: 9
    xp: 2000
    suit-chance: 0.4          # the Abyssal Diving Suit
  bedrock:
    squid-scale: 10           # Bedrock players see a giant glow squid
  music:
    enabled: true             # "Outcast of the Sulphurous Seas" (the Aquatic Scourge theme)
    volume: 1.0
    length-seconds: 397.22

# ---------------- DIAMOND JACOB (blow a Diamond War Horn on a mountain peak) ----------------
jacob:
  health: 6000                # 4 phases of 1,500 (2.0.0: was 4000; an old 4000 reads as 6000)
  defense: 0.15
  damage-multiplier: 1.3
  scale: 1.15
  walk-speed: 0.34
  phase4-speed: 0.5
  rest-multiplier: 0.75       # shorter breathers between moves
  cooldown-minutes: 15
  orb-damage: 80              # pink orbs (phases 1-3): exact damage
  orb-every-seconds: 26
  max-phase: 4               # built one phase at a time: after this phase he withdraws (no loot) until the next is unlocked
  hitbox-scale: 2.3            # his invisible hitbox (1.0 = about 1 block; 2.3 covers his whole ~2.4-block body)
  bird-hitbox-scale: 1.4       # the hawk's hitbox in phase 1
  bird-scale: 5.0
  bird-clearance: 8           # the hawk always stays at least this far above the ground under it
  bird-height: 14
  bird-radius: 12
  bird-circle-speed: 0.018
  spider-every-ticks: 180
  max-spiders: 9
  army-size: 20
  reinforce-below: 6          # phase 3: if fewer soldiers than this are left, his Cavalry Charge horn calls more
  reinforcements: 7
  damage:
    piercing-arrow: 15
    volley-arrow: 7
    talon-dive: 16
    arrow-rain: 9
    hammer-slam: 16
    pearl-strike: 14
    whirlwind: 8
    hammer-throw: 12
    cavalry: 9
    spear-wall: 12
    ember-flurry: 9
    phoenix-leap: 18
    inferno-pillar: 12
    burning-brand: 14
    diamond-shard: 7
  rewards:
    mythic-bags: 20
    diamonds-min: 20
    diamonds-extra: 11
    xp: 2500
    mirror: true              # the Mirror..?? (the way to the Dark Ocean)
    ankh-piece-chance: 0.5    # the Ankh (a piece of the Ankh Shield; was the Demon Eye's)
  music:
    enabled: true             # both tracks are in FaultlineSMP.zip (sounds/jacob/music1.ogg, music2.ogg)
    volume: 1.0
    length1-seconds: 315      # track 1 (phases 1-3): music1.ogg is 5:15
    length2-seconds: 287      # track 2 (the third cutscene + phase 4): music2.ogg is 4:46

wild:
  # With nobody in survival nearby, a wild boss fights creative players for show (no damage either way, no loot).
  fight-creative: true
  # The Dark Ocean (FaultlineDeep's world). Its bosses/mini bosses only fight there: every 5 minutes
  # each survival player in it rolls this chance, and one that fits where they are (Sunlit Sea or deeper) comes.
  deep-world: faultline_deep
  deep-spawns: {enabled: true, chance: 0.001}
  # ---- the Dark Ocean (1.6.0). Minis roll a Dark Loot rare 10%, bosses 50% (rewards.dark-loot-rare-chance).
  scourge:
    health: 2400
    health-per-extra-fighter: 0.2
    air-bubble: {every-seconds: 20, size: 3.4, poison-per-second: 0.25}   # giant air bubbles: breathe + wash out the poison
    pink-bubble: {every-seconds: 30, size: 2.6, damage: 150}            # hit one = 150 damage to the Scourge
    cooldown-minutes: 15
    music: {sound: "faultline:kraken.music", length-seconds: 397.22}
  umbral:
    health: 2600
    health-per-extra-fighter: 0.2
    cooldown-minutes: 15
    music: {sound: "minecraft:music_disc.5", length-seconds: 178}
  coralia:   # 1.7.0: the Mermaid Den's boss (FaultlineDeep calls her). Only SWORD hits hurt her (and her pink bubbles)
    health: 2400
    health-per-extra-fighter: 0.25
    cooldown-minutes: 10
    speed: 0.6
    music: {length-seconds: 285.86}                                     # faultline:coralia.music (FaultlineDeepMusic.zip)
    air-bubble: {every-seconds: 15, size: 3.4}                          # giant air bubbles rise: swim inside one to breathe
    pink-bubble: {every-seconds: 20, size: 2.6, damage: 120}            # hit one = 120 damage to her
  inkjaw:
    health: 500
    health-per-extra-fighter: 0.2
    cooldown-minutes: 10
  grandmaw:
    health: 900
    health-per-extra-fighter: 0.25
    cooldown-minutes: 10
    rewards: {shield-of-the-ocean-chance: 0.5}
  lament:
    health: 900
    health-per-extra-fighter: 0.25
    cooldown-minutes: 10
  # THE ABYSSAL TITAN (1.7.0): the Trench's final boss, asleep in the Maw (FaultlineDeep wakes it for anyone who has
  # beaten all six sea bosses). /titan summon. Its lures break in phase 2 (lure-break-share of its health each): all
  # three = stunned for stun-ticks, taking stun-damage-taken.
  titan:
    health: 5000
    health-per-extra-fighter: 0.25
    cooldown-minutes: 30
    scale: 3.6
    maw-x: -1460
    maw-z: -1640
    maw-radius: 70
    fight-radius: 70
    hide-light: 3           # how lit its hide is drawn (0-15): a dark shape in the dark; the eyes and lures always burn
    lure-break-share: 0.03
    stun-ticks: 160
    stun-damage-taken: 1.5
    rewards:
      mythic-bags: 8
      goodie-bags: 4
      xp: 5000

# Boss death messages (1.5.8): "<player> was frozen solid by Frostbeard" instead of "was slain by Slime", when a boss
# hit you within this many seconds of dying (the fall or the lava it knocked you into counts too).
death-messages:
  enabled: true
  seconds: 5

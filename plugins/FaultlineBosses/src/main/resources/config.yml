# 1 netherite scrap) inside a Bastion Remnant. Phase 1 he rides Ironhide (his war hoglin) and takes 60% less damage;
# phase 2 on foot; phase 3 (below 35%) enraged. Music: Pigstep. /grimtusk summon | kill | phase | item
# ============================================================================
warlord:
  require-bastion: true
  health: 3000
  health-per-extra-fighter: 0.2
  scale: 1.8
  melee-damage: 11
  walk-speed: 0.3
  enraged-speed: 0.38
  mounted-damage-reduction: 0.6
  damage-multiplier: 1.0
  arena-radius: 36
  fight-radius: 48
  max-guards: 6
  cooldown-minutes: 15
  charge-speed: 1.1
  move-gap-ticks:
    phase1: 70
    phase2: 55
    phase3: 40
  ironhide:
    health: 600
    scale: 1.7
    damage: 9
    speed: 0.32
  guards:
    guard-health: 40
    crossbow-health: 24
  moves:
    tusk-charge: 12
    cleave: 14
    cleave-radius: 6.5
    rally-count: 4
    magma-slam: 11
    slam-radius: 10
    soul-fire: 9
    soul-fire-length: 22
    gold-rain: 14
    warcry: 6
  cleaver:
    damage: 10
    cooldown-seconds: 12
  music:
    enabled: true
    sound: "minecraft:music_disc.pigstep"
    length-seconds: 149
    volume: 1.0
  rewards:
    mythic-bags-min: 6
    mythic-bags-extra: 5
    goodie-bags: 4
    netherite-chance: 0.5
    cleaver-chance: 0.25
    xp: 2000

# ============================================================================
# THE BOSS RUSH (/bossrush start): every boss back to back, the team teleported to each boss's home biome first. Arenas
# are found once (the nearest fitting biome to the world spawn, a bastion for Grimtusk) and saved in bossrush.yml;
# /bossrush setarena <boss> sets one by hand. No loot from the bosses during a rush; dying puts you out (keep-inventory).
# ============================================================================
boss-rush:
  # the raid bosses need FaultlineRaids and the Queen Spider FaultlineItems (skipped without them); the Lost Explorer is fought by the leader alone
  bosses: [rotbeard, bulwark, great_hog, queen_spider, golem, demoneye, frostbeard, dune, sandworm, frostmaw, don, kraken, leviathan, lich, frostwyrm, jacob, rocco, grimtusk, explorer]
  world: ""
  nether-world: ""
  search-radius: 6400
  search-chunks: 150
  break-seconds: 15
  cooldown-minutes: 60
  keep-inventory: true
  rewards:
    mythic-bags: 32
    xp: 5000
    items: ["NETHERITE_INGOT:4", "DIAMOND_BLOCK:4", "TOTEM_OF_UNDYING:1"]

# ---------------- THE WILD BOSSES (Wild.java + one file each) ----------------
# The Leviathan (Abyssal Lure over open ocean, or 0.4% every 2 min sailing the deep ocean at night: fights ships too),
# the Sandworm King (Sandworm Drum in a desert/badlands), the Lich (Cursed Phylactery in the Deep Dark), the Frost Wyrm
# (Frozen Horn on frozen peaks / snowy slopes), and the Stone Golem (a lush-cave mini boss that wakes by itself).
# Each: health (+health-per-extra-fighter), phase2-at / phase3-at, damage-multiplier, music (a vanilla track each),
# rewards (mythic bags, goodie bags, xp, items "MATERIAL:min-max[:chance%]", and its signature drop chance).
# Admin: /leviathan, /sandworm, /lich, /frostwyrm, /stonegolem <summon [world x y z]|kill|phase <2|3>|item <name>>
wild:
  require-biome: true
  # With nobody in survival nearby, a wild boss fights creative players for show (no damage either way, no loot).
  fight-creative: true
  # Natural spawns (checked every minute for each survival player in the right place; 0 = off):
  #   Lich: in the Deep Dark. Sandworm King: on the surface of a desert/badlands by day. Frost Wyrm: out on frozen
  #   peaks / snowy slopes / groves / ice spikes. Leviathan: in a deep ocean, swimming, in a boat or on a ship.
  natural-spawns: true
  natural-gap-minutes: 20      # at least this long between two natural wild-boss spawns (any of them)
  weapons:
    sandworm-fang: {cooldown-seconds: 10, dash-damage: 8}
    lich-staff: {cooldown-seconds: 3, damage: 8}
    tidebreaker: {burst-damage: 4}
  leviathan:
    natural-chance-per-minute: 0.02
    health: 900                     # a mini boss (like the Stone Golem)
    health-per-extra-fighter: 0.25
    scale: 1.0
    segments: 10
    natural-chance: 0.004
    cooldown-minutes: 15
    ship-damage: {ram: 0.10, spout: 0.03, coil-per-second: 0.02, tail: 0.06}
    music: {sound: "minecraft:music_disc.creator", length-seconds: 176}
    rewards:
      mythic-bags: 5
      goodie-bags: 3
      xp: 2000
      tidebreaker-chance: 0.25
      items: ["DIAMOND:6-12", "HEART_OF_THE_SEA:1", "NAUTILUS_SHELL:2-4", "PRISMARINE_CRYSTALS:8-16"]
  sandworm:
    natural-chance-per-minute: 0.015
    health: 900                     # a mini boss (like the Stone Golem)
    health-per-extra-fighter: 0.25
    scale: 1.5
    segments: 12
    cooldown-minutes: 15
    music: {sound: "minecraft:music_disc.5", length-seconds: 178}
    rewards:
      mythic-bags: 5
      goodie-bags: 3
      xp: 2000
      fang-chance: 0.25
      items: ["DIAMOND:6-12", "GOLD_BLOCK:4-8", "EMERALD:8-16"]
  lich:
    natural-chance-per-minute: 0.04
    health: 900                     # a mini boss (like the Stone Golem)
    health-per-extra-fighter: 0.25
    scale: 1.3
    cooldown-minutes: 15
    music: {sound: "minecraft:music_disc.13", length-seconds: 178}
    rewards:
      mythic-bags: 5
      goodie-bags: 3
      xp: 2500
      staff-chance: 0.25
      items: ["ECHO_SHARD:2-4", "TOTEM_OF_UNDYING:1:50", "DIAMOND:6-10"]
  frostwyrm:
    natural-chance-per-minute: 0.015
    health: 900                     # a mini boss (like the Stone Golem)
    health-per-extra-fighter: 0.25
    scale: 1.4
    cooldown-minutes: 15
    music: {sound: "minecraft:music_disc.relic", length-seconds: 218}
    rewards:
      mythic-bags: 5
      goodie-bags: 3
      xp: 2500
      fang-chance: 0.25
      items: ["DIAMOND:8-16", "BLUE_ICE:16-32", "ELYTRA:1:10"]
  golem:
    health: 900
    health-per-extra-fighter: 0.25
    natural-chance-per-minute: 0.03
    cooldown-minutes: 20
    music: {sound: "minecraft:music_disc.precipice", length-seconds: 299}
    rewards:
      mythic-bags: 1
      goodie-bags: 2
      xp: 600
      gear-parts-min: 2
      gear-parts-extra: 3
      items: ["AMETHYST_SHARD:8-16", "EMERALD:4-8", "IRON_BLOCK:1-3"]

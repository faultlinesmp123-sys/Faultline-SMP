# Seasons come back every year (dates are MM-DD). While one runs, hostile mobs killed by players drop its currency
# and the Seasonal Shop in /cosmetics sells its cosmetics. "/cosmetic season <id|off|auto>" forces one for testing.
seasons:
  halloween:
    name: "Halloween"
    color: "&6"
    start: "10-01"
    end: "11-02"
    token: candy
    token-name: "Candy"
    token-model: season_candy
    drop-chance: 0.08
    drop-min: 1
    drop-max: 2
  winter:
    name: "Winter"
    color: "&b"
    start: "12-01"
    end: "01-06"
    token: present
    token-name: "Present"
    token-model: season_present
    drop-chance: 0.08
    drop-min: 1
    drop-max: 2
force-season: ""

# Show your own NECK/BACK cosmetics to yourself (seen in third person; a little of it shows when you look down).
show-own: true

# How often (ticks) cosmetics are re-sent to everyone as a safety net. 40 = every 2 seconds.
resend-ticks: 40

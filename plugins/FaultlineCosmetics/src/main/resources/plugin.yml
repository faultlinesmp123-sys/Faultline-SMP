name: FaultlineCosmetics
version: '1.1.1'
main: net.faultlinesmp.cosmetics.FaultlineCosmetics
api-version: '1.21'
author: FaultlineSMP
description: Unlockable cosmetics (hat, neck, back, body) for Java and Bedrock players
softdepend: [floodgate, Geyser-Spigot]

commands:
  cosmetics:
    description: Open your cosmetics menu
    usage: /cosmetics
    aliases: [cosmetic-menu, wardrobe]
  cosmetic:
    description: Admin cosmetic tools (for everyone else it opens the cosmetics menu)
    usage: /cosmetic <unlock|lock|list|reload|season|tokens|shop> [player] [id|all]

permissions:
  faultlinecosmetics.admin:
    description: Unlock and lock cosmetics for players, reload the config
    default: op

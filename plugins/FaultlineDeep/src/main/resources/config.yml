# FaultlineDeep: the Dark Ocean. Changing this file in the jar does NOT update the copy on the server.
world: faultline_deep
border-radius: 3000          # the world border: -3000..3000 (1.7.0: 2000; 1.9.0: 3000 for the outer ring: the Frozen Shelf, the Drowned City, the Glass Reef, the Bone Fields)

# The Black Market (the Bubble's plot) and the Pit: players without faultlinedeep.market can't break / build / empty
# buckets there or open its shulker boxes, barrels..., and nobody can break the Bubble's glass (the sea would pour in).
market:
  protect: true

# The Abyss (and the crust's caves) are PITCH BLACK (1.6.0): hidden Darkness (it also beats the brightness slider) and no
# Night Vision of any kind (potions, Abyssal Diving Gear, Mining Helmet). Light down there: a Lantern of Souls held, a
# Glowgrub close by, glowing creatures, light blocks. zones: any of ABYSS, CAVES, SUNLIT, SULPHUR.
darkness:
  enabled: true
  zones: [ABYSS, CAVES]
  creative: true
  message: "The Abyss swallows every light."

# The Sulphur Sea (1.4.0): the acid region round -520, 480 (Sulphur.java). /deep sulphur goes there.
sulphur:
  acid-water: true          # swimming in its water poisons you...
  safe-diving-tier: 3       # ...unless you wear Abyssal Diving Gear (3) or the Abyssal Diving Suit (4)
  always-raining: true      # it rains there all the time (for the players in it), with green acid drops falling too
  green-rain-particles: 40  # green drops round each player every 4 ticks

# THE TRENCH (1.8.0): a rift from the sea floor to the bedrock in the far west (x -1250..-1650, z -100..-1650), ending in
# the Maw (-1460, -1640) where the Abyssal Titan sleeps. Always pitch dark. /deep trench [maw] [player] goes there.
trench:
  pressure:
    enabled: true
    below-y: -10            # hadal pressure, all the time, below this height in the Trench (Conduit Power doesn't help)
    damage: 3               # every 2 s; the Abyssal Diving Suit halves it...
    helmet-tier: 3          # ...and the suit + a Hadal Dive Helmet (tier 3) keeps it out
  titan:
    enabled: true           # someone who has beaten all six sea bosses swimming into the Maw wakes the Abyssal Titan (FaultlineBosses)
    wake-radius: 30
    needs: [brine_scourge, umbral_leviathan, coralia, old_inkjaw, grandmaw_clam, the_lament]

# THE SUBMERSIBLE (1.8.0): a research sub for any water. Inside you breathe, bites hit the hull, the deep's pressure can't
# reach you. Below safe-y the hull cracks unless it has Hadal Plating (4 Netherite Ingots on it); Iron Ingots patch it.
submersible:
  speed: 0.32
  sprint-speed: 0.55
  safe-y: -40
  crack-per-second: 3
  repair-per-ingot: 10
  plating-ingots: 4
  hull-per-damage: 1.0
  implode-damage: 10
  model-scale: 2.0
  model-lift: 0.9

# THE LEVIATHAN MIGRATION (1.8.0): a pod of great whales crossing the Sunlit Sea; at the end the eldest sinks into a whale
# fall (bones + a chest). Killing a whale can bring the Umbral Leviathan up. /deep migration [start|stop]
migration:
  enabled: true
  every-minutes-min: 60
  every-minutes-max: 120
  distance: 600
  speed: 0.22
  umbral-chance: 0.35
  heart-chance: 0.35

# THE BIOLUMINESCENT BLOOM (1.8.0): a rare event with someone deep down: 5 minutes with no darkness, glowing water and
# the glowing creatures out. /deep bloom [start|stop]
bloom:
  enabled: true
  check-minutes: 10
  chance: 0.03
  minutes: 5

# 1.9.0 sea events (Tides.java): the Abyssal Eclipse (the whole sea goes pitch black, Abyss creatures rise), the Red Tide
# (the Sunlit Sea's water poisons, creatures go mad) and Feeding Frenzies (sharks swarm when something big dies).
# /deep eclipse|redtide [stop], /deep frenzy
tides:
  enabled: true
  check-minutes: 15
  eclipse:
    chance: 0.03
    minutes: 5
  red-tide:
    chance: 0.05
    minutes: 10
  frenzy:
    chance: 0.5
    min-health: 150
    seconds: 60
    cooldown-seconds: 120

# 1.9.0 the Undersea Volcano (Volcano.java): rises out of the open sea floor near someone in the Sunlit Sea, erupts, cools
# into obsidian full of Ancient Debris with 3 chests, and the sea takes it back after linger-hours. /deep volcano
volcano:
  enabled: true
  check-minutes: 30
  chance: 0.10
  min-distance: 180
  max-distance: 350
  minutes: 60
  height: 46
  base-radius: 22
  boil-radius: 14
  boil-damage: 2
  bomb-damage: 6
  cap: 8
  debris-min: 6
  debris-max: 10
  linger-hours: 6

# 1.9.0 the outer ring (Outer.java): the Drowned King, the Rimeback, vault keys, Ancient Fossils
outer:
  king:
    wake-radius: 30
    cooldown-minutes: 30
  rimeback:
    wake-radius: 50
    cooldown-minutes: 30
  vault:
    rare-chance: 0.05
    book-chance: 0.25
  fossil:
    mine-chance: 0.04

# The Acid Rain (1.5.0): an event over the Sulphur Sea. /deep acidrain [start|stop|goblin]
# THE MERMAID DEN (1.7.0, round 1200, 700): ten mermaids + six guards (Den.java). Kill all ten, or drink an Omen IV
# (Bad Omen IV exactly) inside it for a raid, and Coralia rises over her throne. The dead come home after restock-minutes.
den:
  enabled: true
  restock-minutes: 30
  guard-respawn-seconds: 120
  # 1.8.0: the Den's trust (den_rep.yml). Earn it defending the Den (kills near it) and with gifts to the mermaids;
  # FRIEND = mermaid trades, ALLY = guard trades + the guards fight beside you, HONORED = a house (/den home, respawn there).
  rep:
    friend: 40
    ally: 120
    honored: 250
    hated: -40              # at or below this, the guards attack on sight
    kills-per-day: 60
    gifts-per-day: 40
    defend-radius: 120      # kills this far out from the Den's wall count
    hurt: 10
    kill-mermaid: 50
    kill-guard: 20
    omen: 200
    war: 100
    home-cooldown-seconds: 300
  raid:
    wave-1: 6
    wave-2: 8
    next-wave-at: 2
    give-up-seconds: 60

acid-rain:
  enabled: true
  check-minutes: 5          # every 5 minutes, if anyone is in or near the Sulphur Sea...
  chance: 0.005             # ...a 0.5% chance it starts
  minutes: 6                # how long it lasts
  helmet-wear: 2            # out in the open: a helmet loses this much durability every 3 s, no helmet = poisoned
  spawn-seconds: 5          # its creatures (Sludge Shambler, Rustbones, Acid Mite, Storm Wraith, Bile Mauler) come this often...
  cap-per-player: 6         # ...up to this many round each player
  goblin-after-seconds: 90  # then Grubnash the Acid Goblin (mini boss, 500 health) rides in

# Lucki's whirlpool (1.5.0): a real funnel the sea drains into
journey:
  whirlpool-radius: 9
  whirlpool-depth: 16       # down to the eye (or to the sea floor if it's shallower)
  whirlpool-seconds: 40

mobs:
  cap: 10                   # creatures round each player (each is up to 10 entities with its moving bones: keep it low)
  sulphur:
    land-share: 0.4         # how often the spawner tries an island / the air over it instead of the water there

# 1.9.0 living down there (Habitat.java): Air Coral (breathe near it) and Dome Kits (glass dome bases, saved in domes.yml).
# 1.11.0: domes go under water in ANY world, have two doors, owners can break their own walls (the sea stays out), and
# two close domes can be combined with a hallway (/dome [list|combine|yes|no]).
# /deep give <coral|dome_small|dome_large|vault_key|fossil>, /deep domes
habitat:
  coral:
    radius: 3.5
    refill: 60
  domes:
    max-per-player: 3
    combine-gap: 12          # 1.11.0: two of your domes this close (glass to glass, floors within 6) can be joined by a hallway

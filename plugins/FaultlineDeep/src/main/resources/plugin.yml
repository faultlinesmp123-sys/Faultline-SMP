name: FaultlineDeep
version: '1.17.0'
main: net.faultlinesmp.deep.FaultlineDeep
api-version: '1.21'
author: FaultlineSMP
description: The Dark Ocean (a world of water only), the hourly whirlpool down to it, its creatures and events
softdepend: [floodgate, Geyser-Spigot, FaultlineItems, FaultlineBosses, FaultlineIndex]

commands:
  deep:
    description: "Admin: the Dark Ocean (the Mirror's way up, whirlpools, tp, spawn creatures, eggs, events)"
    usage: /deep [info|set kingdom|whirlpool [here|random|at|stop|next]|tp [player]|town [player]|sulphur [player]|trench [maw] [player]|spawn <mob>|egg <mob> [n] [player]|event <pressure|undertow|stop>|acidrain|den [info|where|tp|raid|stop|reset|rise]|bloom|migration]
    permission: faultlinedeep.admin
  whirlpool:
    description: "Where the Whirlpool to the Dark Ocean is (or when the next opens); admins: here, random, at <x> <z>, stop, next <minutes>"
    usage: /whirlpool [where|here|random|at <x> <z> [world]|stop|next <minutes>]
    aliases: [maelstrom]
  dome:
    description: "Your dome bases: list them, combine two with a hallway, answer the combine question"
    usage: /dome [list|combine|yes|no]
  glimmer:
    description: "The Glimmer Shop (during the Glimmertide, the Dark Ocean's season), /glimmer top"
    usage: /glimmer [top|sell]
    aliases: [gshop, glimmertide]
  chart:
    description: "How much of the Dark Ocean you've uncovered on the Abyssal Chart"
    usage: /chart
  den:
    description: "Your reputation with the Mermaid Den (trades, guards, a house), and /den home"
    usage: /den [home]

permissions:
  faultlinedeep.admin:
    description: The /deep admin command
    default: op
  faultlinedeep.city:
    description: Build in Halcyon, open its containers, and never be wanted there
    default: op
  faultlinedeep.market:
    description: Build in the Black Market and the Pit, open its shulker boxes, break the Bubble's glass
    default: op
  faultlinedeep.whirlpool:
    description: Open / close whirlpools for free (/whirlpool here|random|at|stop|next)
    default: op
  faultlinedeep.bypass:
    description: Go down a whirlpool without having beaten Diamond Jacob (only matters with whirlpool.needs-jacob)
    default: false

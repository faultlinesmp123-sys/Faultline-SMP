name: FaultlineDeep
version: '1.5.0'
main: net.faultlinesmp.deep.FaultlineDeep
api-version: '1.21'
author: FaultlineSMP
description: The Dark Ocean (a world of water only), Lucki and the whirlpool, its creatures and events
softdepend: [floodgate, Geyser-Spigot, FaultlineItems, FaultlineBosses, FaultlineIndex]

commands:
  deep:
    description: "Admin: the Dark Ocean (set kingdom/lucki/whirlpool spots, tp, spawn creatures, eggs, events)"
    usage: /deep [info|set <kingdom|lucki|whirlpool>|tp [player]|town [player]|spawn <mob>|egg <mob> [n] [player]|event <pressure|undertow|stop>|lucki]
    permission: faultlinedeep.admin

permissions:
  faultlinedeep.admin:
    description: The /deep admin command
    default: op
  faultlinedeep.market:
    description: Build in the Black Market and the Pit, open its shulker boxes, break the Bubble's glass
    default: op
  faultlinedeep.bypass:
    description: Use the Mirror and Lucki without having beaten Rocco and Jacob
    default: false

# FaultlineIndex settings (the Index's content lives in the jar's index.yml).

# Bedrock players (Geyser) get the Index as menus (Floodgate/Geyser forms): Bedrock can't follow the book's links.
bedrock-forms: true

# The museum: boss trophies (first defeat), boss music discs (a chance on every defeat), and /museum (the Hall of Firsts).
museum:
  disc-chance: 0.2
  announce-firsts: true          # "X is the first to defeat Y!" (bosses and creatures)
  announce-item-firsts: false    # also for every first item found (chatty)

# The Discord bridge, two webhooks (Discord: channel settings > Integrations > Webhooks > New Webhook > Copy URL).
# KEEP THE URLS ONLY IN THE SERVER'S COPY OF THIS FILE: the GitHub repo is public and anyone with a URL can post.
#  webhook-url       PUBLIC channel: chat, joins/leaves, deaths + player kills, boss defeats, achievements, events...
#  logs-webhook-url  STAFF LOGS: all of the above + TNT / end crystal / anchor placers and TNT lighters (name, place,
#                    date and time), whispers, admin and console commands, PvP kills with coordinates.
# Then /discord test in game (/discord status shows both).
discord:
  enabled: true
  webhook-url: ""
  logs-webhook-url: ""
  suggestions-webhook-url: ""    # /suggest posts here (make a #suggestions channel + webhook); "" = the public channel
  username: "Faultline SMP"
  public:
    chat: true
    joins: true
    deaths: true
  logs:
    mirror-public: true          # the logs channel also gets everything the public one does
    tnt: true
    blocks: [TNT, TNT_MINECART, END_CRYSTAL, RESPAWN_ANCHOR]
    whispers: true
    whisper-commands: [msg, tell, w, whisper, r, reply, m, t, pm, dm, emsg, etell, ewhisper, er, ereply, message, teammsg, tm]
    admin-commands: true         # commands run by ops / faultlineindex.logged
    all-commands: false          # every player's commands
    console-commands: true
    grief:                       # 1.6.14, all in the logs channel only
      lava: true                 # lava poured
      fire: true                 # fires lit (not portals, campfires, candles)
      wither: true               # a Wither built
      containers: true           # someone else's chest/barrel/shulker/... broken, or items taken from it (new containers only)
      ignore-same-kingdom: false # true = taking from a kingdom-mate's chest isn't logged
      throttle-seconds: 10       # lava/fire: one line per player per this many seconds, with a count
    alert-role: ""               # 1.6.15: a Discord role ID to ping on Watch ALERTS (x-ray, cheats, illegal items, griefing, ban evasion); at most one ping a minute
    report-role: ""              # a Discord role ID to ping on every /report (Server Settings > Roles > right-click > Copy ID); "" = no ping
    ignore-commands: [login, l, log, register, reg, changepassword, changepass, cp]   # never logged (passwords)
  # announcements matching any of these (Java regexes) are posted
  forward: ["(?i)has been defeated", "(?i)has fallen", "(?i)has been laid to rest", "(?i)meteor", "(?i)caravan", "(?i)achievement",
            "(?i)is the first to", "(?i)aurora", "(?i)sandstorm", "(?i)blizzard", "(?i)eclipse", "(?i)locust", "(?i)ghost ship|wailing mary",
            "(?i)invasion", "(?i)boss rush"]

# Watch (1.6.15): catches x-rayers, cheaters, dupers and griefers. Daily log files in plugins/FaultlineIndex/logs/,
# /watch in game. LOG lines go to the Discord logs channel, ALERTS also to staff in game (faultlineindex.alerts) and ping
# discord.logs.alert-role. Every check can be turned off with <check>.enabled: false.
watch:
  enabled: true
  log-file: true
  ingame-logs: false           # true = staff also see the LOG lines in game, not just alerts
  alert-cooldown-minutes: 5    # one alert per player per kind in this time (the rest are LOG lines)
  skip-bedrock: true           # Bedrock players' touch controls aren't judged by the cheat checks
  xray:
    window-minutes: 20
    buried-share: 0.6          # at least this share of their veins were fully buried
    discord-veins: true        # every diamond / debris vein found goes to the logs channel (buried or exposed, blocks dug since the last)
    diamond: {min-buried: 4, max-blocks-per-vein: 60}
    debris: {min-buried: 3, max-blocks-per-vein: 45}
    emerald: {min-buried: 4, max-blocks-per-vein: 60}
  reach: {tolerance: 0.75, count: 4, window-seconds: 60}
  killaura: {max-angle: 75, count: 6, window-seconds: 60}
  multiaura: {count: 3, window-seconds: 60}
  fly: {seconds: 3}
  speed: {blocks-per-second: 16, count: 2, window-seconds: 60}
  nuker: {blocks-per-second: 22}
  scaffold: {places-per-second: 12, max-pitch: 45, count: 6, window-seconds: 30}
  illegal:
    remove: false              # true = illegal items are taken away (always logged)
    attribute-modifiers: true  # vanilla items with custom attribute modifiers count as illegal
    items: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, COMMAND_BLOCK_MINECART, STRUCTURE_BLOCK, STRUCTURE_VOID,
            JIGSAW, DEBUG_STICK, LIGHT, KNOWLEDGE_BOOK, END_PORTAL_FRAME, SPAWNER, TRIAL_SPAWNER, VAULT, REINFORCED_DEEPSLATE, BUDDING_AMETHYST,
            PETRIFIED_OAK_SLAB, FARMLAND, DIRT_PATH, FROGSPAWN, TEST_BLOCK, TEST_INSTANCE_BLOCK]
  value:
    spike: 300                 # log a player whose valuables jump by this many diamonds' worth in 30 s
  handoffs:
    min-worth: 9               # log valuables picked up that someone else dropped, worth at least this many diamonds
  grief:
    min-built: 20              # a chunk's main builder needs this many placed blocks there
    log-blocks: 8              # breaking this many in someone else's build = a LOG line
    alert-blocks: 64           # ...this many = an ALERT
    summary-seconds: 20
    ignore-same-kingdom: false
    explosion-min-blocks: 6
    explosion-alert-blocks: 30
  creative:
    min-items: 64              # creative inventory takes are summed up every 30 s

# /report <player> <reason>: to the Discord logs channel, online staff (faultlineindex.reports) and reports.yml.
reports:
  cooldown-seconds: 60

# /suggest <idea>: a numbered embed in the Discord (discord.suggestions-webhook-url), online staff, suggestions.yml.
suggestions:
  cooldown-seconds: 300
  min-length: 10

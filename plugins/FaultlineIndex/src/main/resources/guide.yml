# The /guide tutorial (Index 1.6.14). Each chapter: id, title, icon (an Index glyph), text.
# In text: "# Heading" lines are headings, "- " lines are bullets, a blank line starts a new paragraph.
# "bosses" is filled in by itself from the Index's boss entries (how to find or summon each one), after its text.
chapters:
  - id: start
    title: "Getting Started"
    icon: faultline_index
    text: |
      # Welcome to Faultline SMP!
      A survival server with custom bosses, items, raids, ships and factions.

      # Factions
      There are five factions: The Mountain, The Jungle, The Ice, The Fibers and The Sky. Staff put you in yours. /faction (/f) shows it, /fc is your faction's chat.

      # Heads are money
      Kill a player and they drop their head. Heads are the currency: trade them at the Black Market.

      # Handy commands
      - /index: your codex
      - /guide: this guide
      - /coords, /ping
      - /lastdeath: where you died
      - /crops: what's in season
      - /cosmetics, /accessories
      - /report, /suggest
  - id: index
    title: "The Faultline Index"
    icon: faultline_index
    text: |
      # Your codex
      Everyone gets a Faultline Index on their first join (lost it? craft one: Leather + Book). Right-click it, or type /index.

      # What it does
      Every custom item and creature on the server has a page. Find an item or defeat a creature and its page fills in: what it does, how to get it, what it drops. Creatures you haven't beaten show as ???.

      # Achievements
      The cover's Achievements line opens your goals: beat bosses, collect items, finish chapters. Each one gives rewards, some give cosmetics.

      # Museum
      /museum shows the Hall of Firsts: who beat every boss first.
  - id: quests
    title: "The Quest Book"
    icon: quest_book
    text: |
      # Quests
      Craft a Quest Book (Book + Iron Ingot, works in your inventory grid) and right-click it.

      # How it works
      - Pick a quest and ACCEPT it: nothing counts before that
      - One quest at a time
      - Its steps go in order: only the current step counts
      - Finish it for the reward
      - Abandon any time (progress is lost)
      - Most quests come back after a cooldown; some are one-time only
  - id: market
    title: "The Black Market"
    icon: goodie_bag
    text: |
      # Heads for loot
      The Black Market building trades player heads for shulker boxes of loot.

      # Tiers
      Every player has a tier from 1 to 8 (staff set it). A head's value depends on the tier of the player it came from: high-tier heads are worth a lot more.

      # Commands
      - /stats [player]: kills, deaths, K/D, tier
      - /leaderboard: top killers
      - /tierleaderboard
      - /markethelp

      # Fair play
      Killing the same player again within 10 minutes doesn't count.
  - id: bosses
    title: "Bosses"
    icon: diamond_jacob
    text: |
      # Bosses
      Bosses drop the best loot on the server: Mythic Goodie Bags, boss weapons, enchant books, music discs. Bring friends: most get harder (and give more) with more fighters.

      # The road to the Dark Ocean
      Whirlpools open out on the Great Sea now and then. Only the purple one (the Depths) pulls you down into the Dark Ocean; the others just spit you out. A Whirlpool Radar points to the nearest. Swim into its eye and it pulls you down into the Dark Ocean, where the sea bosses live. Diamond Jacob's Mirror..?? tells you where the next one is, and brings you back up from the Dark Ocean.
      The Kraken rises in the Overworld's deep oceans: drop a Bait Worm into 15+ blocks of water.

      # How to find each one
  - id: world
    title: "Raids, Events & Ships"
    icon: meteorite
    text: |
      # Raids
      Zombie, Skeleton and Piglin Raids hit villages. Piglin Brutes sometimes drop a War Horn: blow it near a village to start a Piglin Raid. Blood Moon raids are harder and give more.

      # Events
      - The Caravan Merchant camps near players every 8 hours
      - Weather: Sandstorm, Eclipse
      - Blood Moon (stronger monsters, double XP, the Crimson Champion at midnight), Lantern Night (a calm night, catch the Lantern Wisps), Fog (you can't see far, the undead walk by day), Windy days (Luck and loot x1.2, the wind pushes you). /fevent shows what's on.
      - The Nether and the End have day and night too. Night there brings more monsters and sometimes an Ember Storm or a Soul Tide (Nether), a Void Storm or a Starfall (End). A Spawn Pad lets you respawn there.
      - Fishing tournaments, elytra / boat / horse races

      # Ships
      Craft a ship Blueprint, right-click water, then place every glowing block. Sail with W A S D, Jump drops the anchor, double-tap W for cruise control. Every ship has its own ability (F at the helm): the Dinghy rows hard, the Sloop catches a tailwind, the Brigantine lays a smoke screen, the Galleon fires a broadside, the Pirate Ship grapples. Sail with the wind for more speed. /ship locate finds your ships. Watch out for skeleton ships and the Pirate Invasion.
      # Spider Nests
      Somewhere under the world are Spider Nests: web-choked caves where the Queen of the Nest sleeps. Webs, dead bodies and pots down there hide iron, copper, diamonds, potions and accessories. Hitting the Queen wakes her.

      # Elite mobs and mutants
      Some monsters spawn as a gold-named ELITE (tougher, double drops, bonus loot), a LOOTER ZOMBIE (steals a stack from your backpack: kill it to get it back), a BLAZING SKELETON (fire arrows) or a SPLITTING CREEPER (splits into minis). They turn up in raids too.

      # The Farlands and the Outer Rim
      Past 3280 blocks out the world breaks into the Farlands: Elites, Mutants and raid mobs only, and the best loot. The Rim Depth bar shows how deep you are: further out, tougher monsters. Watch for static storms, gravity anomalies and things that aren't there.
      Past 3800 (the Outer Rim) are the Rim Citadel (due south), lost villages (Lost Villagers trade cursed gear for Rim Shards) and Rim Lighthouses: light the campfire at the top and the Rim keeps away from it for an hour. A Rim Chart (a map + 4 Rim Shards) shows what's near. Sometimes the Rim lays siege: hold the ring for 4 waves.

      # Farming seasons
      Every crop has real-world months it's in season: it grows faster and gives bigger harvests then, and slower the rest of the year. /crops shows the calendar.

      # Horses
      Right-click a horse, donkey, mule, llama or camel with a stick to see its speed, jump and health.

      # Hot Air Balloons
      Craft one and fly anywhere: Jump to rise, sneak to sink, W to go where you look. It burns coal (or blaze rods).
  - id: gear
    title: "Items & Cosmetics"
    icon: golden_ring
    text: |
      # Accessories
      /accessories (or /wardrobe) opens the Wardrobe: your 3 accessory slots (one of each), your cosmetics by slot, your armour, and a preview of your outfit.

      # Boss enchant books
      Bosses drop books with enchantments vanilla doesn't have (Lifesteal, Venom, Vein Miner...). Item on the left of an anvil, book on the right.

      # Cosmetics
      /cosmetics: hats, capes and more, worn over your armor. Unlocked from achievements, bosses and the Seasonal Shop (Halloween Candy, Winter Presents).

      # Climbing and getting around
      Mountain Armor (all four pieces) and Mountaineer's Gloves let you climb walls: walk into one, sneak to hang. The Ice Axe hangs you on a wall, Rope Ladders run up it.
      Tame a goat with Wheat, put a Saddle on it and ride it: Jump is a big goat leap. The Hang Glider is an early, slower elytra.
      Grappling Hook upgrades go on in an anvil: Long Line (further) and the Barbed Hook (reel in mobs and players).

      # Recording?
      /camera turns you into a free camera, /sit sits down.
      /emote: Griddy, Aura Farming, Get Sturdy, Birdbrain, and the duos Dap Up and Hug (someone right-clicks you to join).

# ============================================================================
# ACHIEVEMENTS (their own book, from the Index cover). A goal is one of:
#   defeat: [entry ids] + need: all | any | <total kills across them>
#   chapter: <chapter id> (everything in it)     found / found-items / found-creatures: <how many entries>
#   stat: <name> + count: <n>   (other plugins count things with "/index stat <player> <name> [amount]")
# reward: items ("MATERIAL:amount"), xp, cosmetic (unlocked through FaultlineCosmetics)
# ============================================================================

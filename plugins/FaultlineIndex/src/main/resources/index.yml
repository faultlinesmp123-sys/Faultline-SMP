    does: Breathe underwater, immune to Crush Depth, everything the Abyssal Diving Gear does, and 3 plates that each absorb 15% of a hit underwater (a broken plate regrows after 20 seconds). Doesn't work in combat (for 10 seconds after you hit or are hit by a player or a monster).
  # ---------------------------------------------------------------- DIAMOND JACOB
  - chapter: bosses
    name: Diamond Jacob
    icon: diamond_jacob
    detect-tag: faultline_jacob
    where: 'Blow a Diamond War Horn on a mountain peak (Jagged, Frozen, or Stony Peaks). 4,000 health over 4 phases of 1,000. A pink orb rises every 20 seconds: hit it into him for 100 damage.'
    does: 'Phase 1: he rides his Great Hawk overhead and only arrows reach him: Piercing Arrow, Arrow Volley, Talon Dive, and Arrow Rain (get out of the red rings). Phase 2: the hawk is shot down and he pulls a war hammer from the ground: Hammer Slam (jump the shockwave), Pearl Strike (he pearls behind you), Whirlwind, Hammer Throw, and spiders from his staff. Phase 3: he blows his horn and his army rides in: soldiers on armored horses, Cavalry Charge (more riders arrive if his army is thin), and Spear Wall. Phase 4: he falls, his army scatters... and he rises again ablaze, faster, with a burning sword: Ember Flurry, Phoenix Leap, Inferno Pillars (get out of the orange rings), Burning Brand (the branded player explodes: get away from everyone), and Diamond Shatter.'
    drops:
    - 20 Mythic Goodie Bags|100%
    - 20-30 Diamonds|100%
    - Jacob's War Hammer|100%
    - Ember Blade|100%
    - All five of his charms|100%
    - 2,500 XP|100%
  - chapter: enemies
    name: Jacob's Soldier
    icon: jacob_soldier
    detect-name: Jacob's Soldier
    where: Rides in on an armored horse when Diamond Jacob blows his horn (phase 3).
    does: 'Iron armor and a spear. Rides you down in Cavalry Charges. Kill the soldier and his horse leaves too.'
    drops:
    - Nothing|-
  - chapter: consumables
    name: Diamond War Horn
    icon: jacob_horn
    detect: faultlinebosses:jacob_item=horn
    how: 'Craft a Goat Horn with 4 Gold Ingots and 4 Diamond Blocks around it.'
    does: Blow it on a mountain peak to summon Diamond Jacob (15 minute cooldown after he falls).

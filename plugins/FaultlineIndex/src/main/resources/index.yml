  - chapter: friends
    name: Skeleton Wanderer
    icon: skeleton_wanderer
    detect-tag: faultline_cave_trader
    where: 'Sets up shop in caves: every 2 minutes, anyone underground (no sky above, below y=50) has a 5% chance of him appearing nearby. He stays for 8 minutes.'
    does: 'Trades accessories for emeralds (rarer ones cost diamonds too): immunity charms, rings, the Spelunker Amulet, diving gear, and more. Five wares at a time, changing with every visit. He can''t be
      hurt.'
  - chapter: friends
    name: Swarm
    icon: swarm
    detect-tag: faultline_swarm
    where: 'A citizen of the city Below the Bedrock. Explore between y=-1 and y=-50 (in the caves, no sky above): every minute there''s a 2% chance he turns up somewhere behind you. He waits around for 5 minutes.'
    does: 'Knows the way down to the Lost Explorer, but only shows it to people who have killed Diamond Jacob, and only for the Vendetta Fist (hold it out to him; he keeps it). Then he digs you a staircase to the bedrock, breaks through it with a pickaxe nobody up here has seen, and opens a hole into the void. Jump in. The hole stays open 10 minutes, then he seals it and fills the stairs back in. He can''t be hurt.'
  - chapter: bosses
    name: The Kraken
    icon: kraken
    detect-tag: faultline_kraken
    where: Drop a Bait Worm into a Deep Ocean with at least 15 blocks of water. It sinks for 8 seconds, vanishes... then he rises.
    does: '2,200 health, 30% defense, the hardest boss so far. Stay near his air bubbles to breathe, and pop the pink bubble (every 15 seconds) for 150-200 damage. Leave the water and he smashes you for over
      half your health: twice and you''re dead. Phase 1 is slow: Tentacle Slam, Crushing Grip (hit the tentacle to break free), Ink Cloud, Whirlpool, Beak Bite, Barnacle Barrage, Tidal Surge (pops air bubbles),
      and Spawn of the Deep. Phase 2 (66%) is faster. Phase 3 (33%) brings eels and three more moves: Abyssal Vortex, Eight-Arm Barrage, and Crushing Depths (only the air bubbles are safe).'
    drops:
    - 18 Mythic Goodie Bags|100%
    - 16-24 Diamonds|100%
    - Abyssal Diving Suit|40%
    - 2,000 XP|100%
  - chapter: bosses
    name: The Kraken at Sea
    icon: kraken
    detect-tag: faultline_kraken_sea
    where: 'Drop a Bait Worm over the side of a ship or a boat (8+ blocks of water around it), or just sail: every 2 minutes, anyone on a ship or in a boat has a 1% chance of him rising beside it.'
    does: '1,600 health, 30% defense, the same three phases and music as the Kraken, but he comes up beside your ship with his head out of the water and keeps pace with it. Keep yourself AND your ship alive: if the ship is wrecked (or the boat smashed) he drags it under and leaves with nothing for you. Shoot him (arrows, tridents, ship cannons all hit him) and the pink bubble bobbing on the waves (150-200 damage). Seven moves: Tentacle Slam and Hull Bite (they break the part of the ship they hit), Crushing Grip (drags you off the deck into the sea: hit the tentacle), Ink Cloud, Barnacle Barrage (chips the hull), Tidal Surge (a wave that slams the ship and knocks you across the deck), and in phase 3 the Eight-Arm Barrage across the deck. Keep a Shipwright''s Hammer handy.'
    drops:
    - 18 Mythic Goodie Bags|100%
    - 16-24 Diamonds|100%
    - Abyssal Diving Suit|40%
    - 2,000 XP|100%
  - chapter: enemies
    name: Kraken Eel
    icon: kraken_eel
    detect-tag: faultline_kraken_eel
    where: Summoned by the Kraken in his third phase.
    does: Swims straight at you and zaps you (with a short slow). Dies in a hit or two.
    drops:
    - Nothing|-

  - chapter: accessories
    name: Diving Helmet
    icon: diving_helmet
    detect: faultlineitems:diving_helmet
    how: 1.5% from Drowned. The Skeleton Wanderer sometimes sells one.
    does: 3x longer breath underwater. Combine with a Flipper to make Diving Gear.
  - chapter: accessories
    name: Flipper
    icon: flipper
    detect: faultlineitems:flipper
    how: 2% from Guardians. The Skeleton Wanderer sometimes sells one.
    does: Swim much faster (Dolphin's Grace in water). Combine with a Diving Helmet to make Diving Gear.
  - chapter: accessories
    name: Diving Gear
    icon: diving_gear
    detect: faultlineitems:diving_gear
    how: Craft a Diving Helmet and a Flipper together.
    does: 3x longer breath underwater and much faster swimming, in one accessory slot.
  - chapter: accessories

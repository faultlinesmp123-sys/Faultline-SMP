# ============================================================================
# THE FAULTLINE INDEX — every item, boss, and enemy on the server.
# When a plugin update adds something new, add its entry here.
#
# Items:     detect: "<plugin>:<key>" (the item's hidden tag), or "<plugin>:<key>=<number>"
#            They're always readable; the check turns green once the player has held one.
# Creatures: detect-tag (scoreboard tag), detect-name (its name), detect-type (mob type).
#            Every listed condition must match. Shown as ??? until the player defeats one.
# icon:      a picture from the resource pack's Index font (assets/faultline/textures/index/)
# ============================================================================

chapters:
  - {id: accessories, title: "Accessories", kind: item, icon: golden_ring}
  - {id: weapons, title: "Weapons & Tools", kind: item, icon: necromancer_staff}
  - {id: consumables, title: "Potions & Bags", kind: item, icon: mythic_goodie_bag}
  - {id: armor, title: "Armor", kind: item, icon: spectre_boots}
  - {id: bosses, title: "Bosses", kind: creature, icon: demon_eye}
  - {id: enemies, title: "Enemies", kind: creature, icon: vampire}
  - {id: friends, title: "Friendly Faces", kind: creature, icon: skeleton_wanderer}

entries:
  # ---------------------------------------------------------------- ACCESSORIES
  - {chapter: accessories, name: "Golden Ring", icon: golden_ring, detect: "faultlineitems:golden_ring",
     how: "Craft it: a Diamond on top, Gold Ingots on the other three sides.",
     does: "Double XP from kills, but hostile mobs spawn 1.5x more around you."}
  - {chapter: accessories, name: "Climbing Claws", icon: climbing_claws, detect: "faultlineitems:climbing_claws",
     how: "Can't be found yet. Only given out by staff.",
     does: "Hold jump against a wall to climb straight up it."}
  - {chapter: accessories, name: "Bezoar", icon: bezoar, detect: "faultlineitems:bezoar",
     how: "2% from Bees and Cave Spiders.",
     does: "You're immune to Poison."}
  - {chapter: accessories, name: "Discount Card", icon: discount_card, detect: "faultlineitems:discount_card",
     how: "10% from Villagers.",
     does: "Villager trades cost 17.5% less. Stacks with Lantern Night."}
  - {chapter: accessories, name: "Life Jelly", icon: life_jelly, detect: "faultlineitems:life_jelly",
     how: "5% from Glow Squids.",
     does: "Heals 2% of your max health every 2 seconds."}
  - {chapter: accessories, name: "Shield of the Ocean", icon: shield_of_the_ocean, detect: "faultlineitems:shield_of_the_ocean",
     how: "Always dropped by Elder Guardians.",
     does: "+10% movement speed and faster swimming."}
  - {chapter: accessories, name: "Lava Charm", icon: lava_charm, detect: "faultlineitems:lava_charm",
     how: "5% from Bats, 10% from Blazes.",
     does: "Touching lava or fire makes you immune to it for 7 seconds. 60 second cooldown."}
  - {chapter: accessories, name: "Black Belt", icon: black_belt, detect: "faultlineitems:black_belt",
     how: "1% from Zombies and Skeletons.",
     does: "Take 5% less damage, but move 2.5% slower."}
  - {chapter: accessories, name: "Moon Stone", icon: moon_stone, detect: "faultlineitems:moon_stone",
     how: "1% from Bats, 5% from Phantoms, 2.5% from Vampires.",
     does: "You become a vampire. Always: hits heal you. Night: Strength and Regeneration. Day: Weakness, and sunlight burns you (rain stops it). Shift + F: turn into a bat and fly for 20 seconds (2 hearts, 2 minute cooldown)."}
  - {chapter: accessories, name: "Ranger Emblem", icon: ranger_emblem, detect: "faultlineitems:ranger_emblem",
     how: "2% from Pillagers.",
     does: "+10% bow and crossbow damage."}
  - {chapter: accessories, name: "Bloody Wolf Scarf", icon: bloody_wolf_scarf, detect: "faultlineitems:bloody_wolf_scarf",
     how: "5% from Piglin Brutes.",
     does: "Take 5% less damage and deal 2.5% more melee damage."}
  - {chapter: accessories, name: "Frost Flare", icon: frost_flare, detect: "faultlineitems:frost_flare",
     how: "0.75% from Snow Golems, 2.5% from Frost Wraiths.",
     does: "Your hits slow enemies, you're immune to Slowness, and you move 5% faster. But hostile mobs spawn twice as much and you get hungry faster."}
  - {chapter: accessories, name: "Spelunker's Amulet", icon: spelunker_amulet, detect: "faultlineitems:spelunker_amulet",
     how: "0.5% when mining natural ores. Sometimes dropped by Vampires.",
     does: "+2% mining speed, and falling sand and gravel can't hurt you."}
  - {chapter: accessories, name: "Harpy Ring", icon: harpy_ring, detect: "faultlineitems:harpy_ring",
     how: "Craft it: Gold Ingots in the corners, Diamonds on the edges, a Netherite Block in the middle.",
     does: "+7.5% movement speed, and your Elytra lasts 50% longer."}
  - {chapter: accessories, name: "Ankh Shield", icon: ankh_shield, detect: "faultlineitems:ankh_shield",
     how: "Craft it: Netherite Blocks in the corners, the Cross in the middle, the Ankh below it, and the three combination charms (Nightwatch, Wayfarer's, Fortune's) on the left, right, and top. Also 0.1% while fishing, and a rare Zombie Raid reward.",
     does: "Does nothing on its own: put a Shield (a regular one or the Shield of the Demon Eye) and the Ankh Shield in an anvil (15 levels). While you hold that shield, you are immune to every debuff (Poison, Wither, Slowness, Blindness...). You still take knockback."}
  - {chapter: accessories, name: "Cleft Horn", icon: cleft_horn, detect: "faultlineitems:cleft_horn",
     how: "2% from Goats.",
     does: "Your hits ignore 1.5% of your target's armor."}

  - {chapter: accessories, name: "A Weird Clock...", icon: weird_clock, detect: "faultlineitems:weird_clock",
     how: "1% from hostile mobs killed deep in caves (underground, below Y=50).",
     does: "You're immune to Slowness."}
  - {chapter: accessories, name: "Guardian Scale", icon: guardian_scale, detect: "faultlineitems:guardian_scale",
     how: "3% from Guardians, 100% from Elder Guardians.",
     does: "Immune to Mining Fatigue. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Ginger Root", icon: ginger_root, detect: "faultlineitems:ginger_root",
     how: "8% from Pufferfish, 1% from Drowned.",
     does: "Immune to Nausea. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Blindfold", icon: blindfold, detect: "faultlineitems:blindfold",
     how: "1.5% from Endermen.",
     does: "Immune to Blindness. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Salt Ration", icon: salt_ration, detect: "faultlineitems:salt_ration",
     how: "2% from Husks.",
     does: "Immune to Hunger. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Vitamins", icon: vitamins, detect: "faultlineitems:vitamins",
     how: "3% from Witches.",
     does: "Immune to Weakness. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Soul Ward", icon: soul_ward, detect: "faultlineitems:soul_ward",
     how: "2.5% from Wither Skeletons, 100% from the Wither.",
     does: "Immune to Wither. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Gravity Stone", icon: gravity_stone, detect: "faultlineitems:gravity_stone",
     how: "4% from Shulkers.",
     does: "Immune to Levitation. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Four-Leaf Clover", icon: four_leaf_clover, detect: "faultlineitems:four_leaf_clover",
     how: "3% from Rabbits.",
     does: "Immune to Bad Luck. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Night Lens", icon: night_lens, detect: "faultlineitems:night_lens",
     how: "50% from the Warden.",
     does: "Immune to Darkness. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Wind Ward", icon: wind_ward, detect: "faultlineitems:wind_ward",
     how: "5% from Breezes.",
     does: "Immune to Wind Charged. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Silk Ward", icon: silk_ward, detect: "faultlineitems:silk_ward",
     how: "1.5% from Spiders, 1% from Cave Spiders.",
     does: "Immune to Weaving. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Slime Ward", icon: slime_ward, detect: "faultlineitems:slime_ward",
     how: "2% from Slimes and Magma Cubes.",
     does: "Immune to Oozing. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Pest Charm", icon: pest_charm, detect: "faultlineitems:pest_charm",
     how: "4% from Silverfish and Endermites.",
     does: "Immune to Infested. Also clears it if you already have it when you put this on."}
  - {chapter: accessories, name: "Nightwatch Charm", icon: nightwatch_charm, detect: "faultlineitems:nightwatch_charm",
     how: "Craft it: a Blindfold, Salt Ration, Vitamins, Soul Ward, and Night Lens in an X (four corners + middle).",
     does: "Immune to Blindness, Hunger, Weakness, Wither, and Darkness. One of the three charms in the Ankh Shield recipe."}
  - {chapter: accessories, name: "Wayfarer's Charm", icon: wayfarer_charm, detect: "faultlineitems:wayfarer_charm",
     how: "Craft it: A Weird Clock, Bezoar, Guardian Scale, Ginger Root, and Gravity Stone in an X (four corners + middle).",
     does: "Immune to Slowness, Poison, Mining Fatigue, Nausea, and Levitation. One of the three charms in the Ankh Shield recipe."}
  - {chapter: accessories, name: "Fortune's Charm", icon: fortune_charm, detect: "faultlineitems:fortune_charm",
     how: "Craft it: a Four-Leaf Clover, Wind Ward, Silk Ward, Slime Ward, and Pest Charm in an X (four corners + middle).",
     does: "Immune to Bad Luck, Wind Charged, Weaving, Oozing, and Infested. One of the three charms in the Ankh Shield recipe."}

  # ---------------------------------------------------------------- WEAPONS & TOOLS
  - {chapter: weapons, name: "Magic Mirror", icon: magic_mirror, detect: "faultlineitems:magic_mirror",
     how: "Craft it: Glass in the corners, Gold Ingots on the edges, an Eye of Ender in the middle.",
     does: "Teleports you home, to the Black Market, or to the Nether. 10 uses; repair it with a Gold Ingot in an anvil."}
  - {chapter: weapons, name: "Necromancer Staff", icon: necromancer_staff, detect: "faultlineitems:necromancer_staff",
     how: "Craft it from a Nether Star, a Wither Skeleton Skull, and Iron Sticks. Rarely dropped by Wither Skeletons (0.5%) and Skeletons (0.1%). You must finish the Necromancer's Trial quest to use it.",
     does: "Summons 6-9 zombie minions that fight for you for 30 seconds. 90 second cooldown."}
  - {chapter: weapons, name: "Iron Stick", icon: iron_stick, detect: "faultlineitems:iron_stick",
     how: "Craft it: an Iron Ingot above a Stick.",
     does: "An ingredient for the Necromancer Staff."}
  - {chapter: weapons, name: "Spider Staff", icon: spider_staff, detect: "faultlineitems:spider_staff",
     how: "10% from the Queen Spider. Very rarely from Spiders (0.01%).",
     does: "Summons 3-5 spiders that fight for you for 30 seconds. 60 second cooldown."}
  - {chapter: weapons, name: "Rotbeard's Grappling Hook", icon: grappling_hook, detect: "faultlineitems:grappling_hook",
     how: "10% from Captain Rotbeard.",
     does: "Cast it at a wall, ceiling, or ledge, then reel in to launch yourself there. No fall damage from the landing. Never breaks."}
  - {chapter: weapons, name: "Queen's Silk", icon: queen_silk, detect: "faultlineitems:queen_silk",
     how: "5% from the Queen Spider.",
     does: "Shoots a glob of silk. Whatever it hits is webbed and slowed for 3 seconds. 8 second cooldown."}
  - {chapter: weapons, name: "Twin Eye Staff", icon: twin_eye_staff, detect: "faultlinebosses:twin_eye_staff",
     how: "20% from the Demon Eye.",
     does: "Summons two small eyes that dive at hostile mobs near you for 30 seconds (PvE only: they never attack players). Other players can hit the eyes off (5 hearts each). 60 second cooldown."}
  - {chapter: weapons, name: "Shield of the Demon Eye", icon: demon_eye_shield, detect: "faultlinebosses:demon_eye_shield",
     how: "25% from the Demon Eye.",
     does: "A shield. Press F while holding it to dash forward; players you slam into get knocked back. 20 second cooldown."}
  - {chapter: weapons, name: "Unholy Arrow", icon: unholy_arrow, detect: "faultlinebosses:unholy_arrow",
     how: "32-64 every time you beat the Demon Eye.",
     does: "Deals twice the damage of a normal arrow, with a purple trail."}
  - {chapter: weapons, name: "Quest Book", icon: quest_book, detect: "limboblackmarket:quest_book",
     how: "Craft it: a Book and an Iron Ingot.",
     does: "Opens the quest list. Take one quest at a time for rewards."}
  - {chapter: weapons, name: "Faultline Index", icon: faultline_index, detect: "faultlineindex:index_book",
     how: "Everyone gets one when they first join. Craft another with Leather and a Book.",
     does: "This book! It records every item you find and every creature you defeat."}
  - {chapter: weapons, name: "Lorenzo's Ball", icon: lorenzos_ball, detect: "faultlinebosses:lorenzos_ball",
     how: "50% from Don Lorenzo (each fighter rolls).",
     does: "Right-click to kick it: about 18 damage (3x an arrow) plus Frostbite (frozen, Slowness II, 1 damage a second for 4 seconds). It always comes back to you. 2-second cooldown."}

  # ---------------------------------------------------------------- POTIONS & BAGS
  - {chapter: consumables, name: "Cloud Potion", icon: cloud_potion, detect: "faultlineitems:cloud_potion",
     how: "Brew an Awkward Potion with a Rabbit's Foot.",
     does: "Lets you double jump for 35 seconds."}
  - {chapter: consumables, name: "Potion of Whispers", icon: potion_of_whispers, detect: "faultlineitems:darkness_stage=1",
     how: "Brew an Awkward Potion with a Ghast Tear.",
     does: "Step 1 of the Darkness Potion. Brew it with a Fermented Spider Eye next."}
  - {chapter: consumables, name: "Potion of the Abyss", icon: potion_of_the_abyss, detect: "faultlineitems:darkness_stage=2",
     how: "Brew a Potion of Whispers with a Fermented Spider Eye.",
     does: "Step 2 of the Darkness Potion. Brew it with a Wither Rose next."}
  - {chapter: consumables, name: "Darkness Potion", icon: darkness_potion, detect: "faultlineitems:darkness_stage=3",
     how: "Brew a Potion of the Abyss with a Wither Rose.",
     does: "A splash potion. Everyone it hits gets Darkness and Blindness for 25 seconds."}
  - {chapter: consumables, name: "Goodie Bag", icon: goodie_bag, detect: "faultlineitems:goodie_bag",
     how: "5% from any mob you kill, 7.5% while fishing. Also from quests and raids.",
     does: "Open it for 3-5 Diamonds and a random bonus. Tiny chance of an Elytra!"}
  - {chapter: consumables, name: "Mythic Goodie Bag", icon: mythic_goodie_bag, detect: "faultlineitems:mythic_goodie_bag",
     how: "Wardens 10%, Withers 12.5%, fishing 2.5%. Also from bosses, raids, and hard quests.",
     does: "Open it for top-tier loot: Netherite, Totems, enchanted gear, and more."}
  - {chapter: consumables, name: "Zombie Omen", icon: zombie_omen, detect: "faultlineraids:zombie_omen",
     how: "Always dropped by Zombie Captains. 10% from Trial Chamber chests and vaults. The Demon Eye drops two.",
     does: "Drink it near a village to start a Zombie Raid (levels I-V). Win for big rewards."}
  - {chapter: consumables, name: "Suspicious Eye", icon: suspicious_eye, detect: "faultlinebosses:suspicious_eye",
     how: "0.05% from any mob.",
     does: "Use it at night in the Overworld to summon the Demon Eye."}

  - {chapter: consumables, name: "Talon", icon: talon, detect: "faultlinebosses:talon",
     how: "50% from wild Vultures, which circle over deserts and badlands (more during a Sandstorm).",
     does: "A crafting ingredient: Talon + Netherite Ingot + Diamond makes a Dune Idol."}
  - {chapter: consumables, name: "Dune Idol", icon: dune_idol, detect: "faultlinebosses:dune_idol",
     how: "Craft it: a Talon, a Netherite Ingot, and a Diamond.",
     does: "In a desert or badlands, it summons the Dune Devourer. In a snowy area, it summons the Frostmaw."}

  - {chapter: consumables, name: "Skeleton Omen", icon: skeleton_omen, detect: "faultlineraids:skeleton_omen",
     how: "Always dropped by Bone Commanders (the leaders of Skeleton Armies).",
     does: "Drink it near a village to start a Skeleton Raid (levels I-V): waves of archers behind a wall of shields. Win for big rewards."}

  - {chapter: consumables, name: "Piglin War Horn", icon: piglin_war_horn, detect: "faultlineraids:piglin_war_horn",
     how: "5% from Piglin Brutes (always level III, IV or V).",
     does: "Blow it, then go near a village in the Overworld to start a Piglin Raid: 15 piglins a wave (III: 6 waves, IV: 8, V: 10) from 13 kinds of units, The Bulwark in wave 5, and The Great Hog at the end. Win for big rewards."}

  - {chapter: consumables, name: "Ankh", icon: ankh_piece, detect: "faultlineitems:ankh_piece",
     how: "50% from the Demon Eye (each fighter rolls).",
     does: "A piece of the Ankh Shield: it goes right below the Cross in the recipe."}
  - {chapter: consumables, name: "Cross", icon: ankh_cross, detect: "faultlineitems:ankh_cross",
     how: "50% from the Dune Devourer or the Frostmaw (each fighter rolls).",
     does: "A piece of the Ankh Shield: it goes in the middle of the recipe."}

  - {chapter: consumables, name: "Captain's Armband", icon: captains_armband, detect: "faultlinebosses:captains_armband",
     how: "1% from wild animals (not bred, spawner, or spawn-egg animals).",
     does: "Summons Don Lorenzo. Only works in the daytime, on flat, open ground with no buildings or villagers nearby (it tells you why if a spot doesn't work, and isn't used up)."}

  # ---------------------------------------------------------------- ARMOR
  - {chapter: armor, name: "Hermes Boots", icon: hermes_boots, detect: "faultlineitems:hermes_boots",
     how: "0.5% from any mob, or buy from an Armorer for 45 Emeralds and a Green Dye.",
     does: "Boots: +3 armor and +15% movement speed. Never break."}
  - {chapter: armor, name: "Rocket Boots", icon: rocket_boots, detect: "faultlineitems:rocket_boots",
     how: "0.5% from any mob, or buy from an Armorer for 60 Emeralds and a Harpy Ring.",
     does: "Boots: +2 armor. Double-tap jump to fly (hold to keep going), in 7 short bursts that recharge when you land. Never break. While rocket-flying (until you land) you can only hit with swords or axes, and you can't swap armor."}
  - {chapter: armor, name: "Spectre Boots", icon: spectre_boots, detect: "faultlineitems:spectre_boots",
     how: "Combine Hermes Boots and Rocket Boots in an anvil.",
     does: "Boots: +3 armor, +15% speed, AND rocket flight. Never break. While rocket-flying (until you land) you can only hit with swords or axes, and you can't swap armor."}

  # ---------------------------------------------------------------- BOSSES
  - {chapter: bosses, name: "The Demon Eye", icon: demon_eye, detect-tag: faultline_demon_eye,
     where: "Summoned with a Suspicious Eye at night. 1,000 health.",
     does: "Four phases. Rams you, births Servants, drops Tooth Balls, then splits into a toothy mouth that spin-dashes, rains teeth, and rains blood from overhead. Later it fires homing blood and vanishes to reappear and charge from the side. Everyone fighting can be targeted, and it enrages if the fight reaches morning.",
     drops: ["10 Mythic Goodie Bags|100%", "12-16 Diamonds|100%", "2 Zombie Omens (IV-V)|100%", "Ankh|50%", "32-64 Unholy Arrows|100%",
             "1-3 Netherite Ingots|50%", "Shield of the Demon Eye|25%", "Twin Eye Staff|20%", "1,000 XP|100%"]}
  - {chapter: bosses, name: "Queen Spider", icon: queen_spider, detect-tag: faultline_queen_spider,
     where: "Deep in caves: 1% of spiders spawning underground. 500 health.",
     does: "Poison bites, Venom Spit, a pounce, a ground stomp, webs around every player, swarms of brood, and egg sacs (big eggs in a web: break the web before they hatch into Cave Spiders). Enrages at half health.",
     drops: ["10 Spider Eyes|100%", "5-10 Diamonds|50%", "Spider Staff|10%", "Queen's Silk|5%", "300 XP|100%"]}
  - {chapter: bosses, name: "The Bulwark", icon: the_bulwark, detect-tag: faultline_bulwark,
     where: "Wave 5 of every Piglin Raid. A giant Piglin Brute in netherite with a tower shield. 220 health (+60 per raid level above III).",
     does: "Shield Bash (a red line shows where it'll charge: get out of it), Ground Slam (jump before the red rings hit), and Unbreakable: it raises its shield and takes 80% less damage from the front for 4 seconds. Hit it from behind.",
     drops: ["1-3 Gold Blocks|100%", "150 XP|100%"]}
  - {chapter: bosses, name: "The Great Hog", icon: great_hog, detect-tag: faultline_great_hog,
     where: "Ends every Piglin Raid, after the last wave: the leader of the Horde. A giant crowned Hoglin. 600 health (+200 per raid level above III).",
     does: "Charge (it paws the ground and a red lane shows where it'll run: dodge, and if it slams into a wall it's stunned and takes 50% more damage), Earthshaker (it rears up and a shockwave rolls outward: jump it), Rally (calls more of the Horde), and Fire Breath (a cone of flame). Below half health it's enraged: faster, and it charges twice in a row.",
     drops: ["8-16 Gold Ingots|100%", "1-3 Netherite Scrap|100%", "400 XP|100%", "Winning the raid: Goodie & Mythic Bags|100%"]}
  - {chapter: bosses, name: "Captain Rotbeard", icon: captain_rotbeard, detect-tag: faultline_rotbeard,
     where: "Appears at the end of level IV and V Zombie Raids. 500 health.",
     does: "A pirate captain: Cutlass Sweep, Flintlock shots, a Cannon Barrage, a Grappling Hook that pulls you in, an Anchor Slam, and he calls his crew.",
     drops: ["Rotbeard's Grappling Hook|10%", "Winning the raid: Goodie & Mythic Bags|100%"]}

  - {chapter: bosses, id: mortimer_freeze, name: "Frostbeard", icon: mortimer_freeze, detect-tag: faultline_mortimer,
     where: "In snow biomes, or anywhere snowy on a Snowy Day. He snuffs out a torch near a player and appears from it. 700 health, and very tanky.",
     does: "A frost wizard with three forms. The Wizard summons Icicle Runners, drops his Winter Whale, throws ice orbs (hit the pink orb to send it back into him!), calls a Hailstorm, and sometimes lands to taunt you. The Snow Brute rolls as a giant snowball, ground-pounds ice spikes, sends out a Frost Nova (jump over it), and turns into a fridge that lobs ice cubes. The Blizzard fires rings of ice shards, rains icicles and hail, and sweeps a freezing beam. Maces are deflected, and fire does nothing to him.",
     drops: ["3 Mythic Goodie Bags|100%", "8-14 Diamonds|100%", "16 Blue Ice|100%", "Frost Flare|25%", "500 XP|100%"]}

  - {chapter: bosses, name: "The Dune Devourer", icon: dune_devourer, detect-tag: faultline_dune, detect-name: "The Dune Devourer",
     where: "Rises from below during a Sandstorm in deserts and badlands, or summon it with a Dune Idol in a desert. The ground rumbles first. 1,100 health, 35% defense.",
     does: "A giant burrowing worm that travels underground and surfaces to strike. Sand Spit (a fan of Sand Blasts), Sand Rush (charges under the surface spraying blasts up), Sandstorm (blasts sweep in from the sides), and Ambush (a bulge tracks under your feet, then it erupts: keep moving). Below 55%: Ground Slam (blasts and two Sandnadoes) and Tremor (a shockwave rolls along the ground: jump it). Below 25%: Vultures and Sand Breath (a cone of sand). Hit any part of its body to hurt it.",
     drops: ["3 Mythic Goodie Bags|100%", "8-14 Diamonds|100%", "600 XP|100%", "Cross|50%", "Ankh Shield|0.01%"]}

  - {chapter: bosses, name: "The Frostmaw", icon: frostmaw, detect-tag: faultline_dune, detect-name: "The Frostmaw",
     where: "Rises from below on a Snowy Day anywhere snowy, or summon it with a Dune Idol in a snowy area. The ground rumbles first. 1,100 health, 35% defense.",
     does: "The Dune Devourer's frozen cousin: its hits freeze and slow you. Frost Spit, Glacier Rush (icicles launch out of the ground), Blizzard (ice from the sides in a whiteout), and Ambush (a bulge tracks under your feet, then it erupts). Below 55%: Avalanche Slam (ice shards and two Frost Vortexes) and Tremor (a freezing shockwave: jump it). Below 25%: Snow Owls and Frost Breath (a freezing cone).",
     drops: ["3 Mythic Goodie Bags|100%", "8-14 Diamonds|100%", "600 XP|100%", "Cross|50%", "Ankh Shield|0.01%"]}

  - {chapter: bosses, name: "Don Lorenzo", icon: don_lorenzo, detect-tag: faultline_don,
     where: "Summoned with a Captain's Armband, only in the daytime, on flat, open ground with no buildings or villagers nearby. Right-click him to accept his challenge.",

  # ---------------------------------------------------------------- ROCCO VENDETTA
  - chapter: bosses
    name: Rocco Vendetta
    icon: rocco_vendetta
    detect-tag: faultline_rocco
    where: 'Sign a Vendetta Contract on open, flat ground. Bring a group: 7 players is the recommended size. 4,000 health, 8,000 with 7 players, over 3 phases. Every hit on him adds a Vengeance Tattoo (max 50, each +1% damage). At half health his little brother Werner joins in.'
    does: 'Phase 1: Kick and Punch (both stun you for 3 seconds), Payback (a counter stance: do NOT hit him), Assemble (Vendetta Enforcers show up) and Watch Your Back! (he blinks behind you twice). Phase 2 adds MY HAIR COUPONS!!! (a 14-block blast that takes half your health: run!), Swear Vengeance (he dodges everything for 5 seconds, then hits harder and faster) and No More Tests (three blinks, three hits). At 50 tattoos: COMPLETE AND TOTAL EXTERMINATION!!! He leaps into the sky and lands on someone. The red ring locks a second before he lands: get out or die, totem or not. Phase 3: all of it, faster.'
    drops:
    - Vendetta Fist|100%
    - 50-150 Mythic Goodie Bags|100%
    - 10 Goodie Bags|100%
    - 'A cosmetic: Golden Chains, Book, or Coat|100%'
    - 3,000 XP|100%
  - chapter: bosses
    name: Werner
    icon: werner
    detect-tag: faultline_werner
    where: 'Rocco Vendetta''s little brother. Joins the fight when Rocco drops to half health. 300 health plus 50% for every extra fighter (1,200 for 7).'
    does: 'Aim for the Solar Plexus (a body blow: stunned for a second), Right in the Dome (a headbutt: Weakness II, a shield blocks it), Gut Crush (two punches, then he hits harder for 10 seconds), Vengeance Awaits You All! (a slam: half your health if you have Weakness, more damage for every debuff, then a 3 second stun, Slowness II and Weakness II) and Counter - Seize ya Chance (a guard: hit him and he counters). Every Vendetta Enforcer that dies makes him 15% stronger. Kill him and Rocco hits 15% harder.'
    drops:
    - 'A cosmetic: Golden Chains, Book, or Coat|33%'
  - chapter: bosses
    name: The Lost Explorer
    icon: lost_explorer
    detect-tag: faultline_explorer
    where: 'The final boss. Swarm digs you down through the bedrock into the void; walk the white path to its end. He stands on top of a huge black pillar, digging into it, his black tiger sitting below. Walk into his arena and walls close it off. SOLO: only one player can face him at a time; anyone else who walks in is put back on the path.'
    does: '"Who are you?" "You''re not from this world." He snaps his fingers and his BLACK TIGER attacks first: 2,000 health, swords work on it, and it takes a quarter of your health per hit (swipes, pounces, a roar that throws you back). Kill it and he calls it useless... "You shall die." He drops off his pillar and four pillars rise. HE can''t be hurt, and hitting him with a weapon earns a backhand that leaves you at half a heart. He fights like the Roaring Knight, fast: white slash lines across the floor (get off the line before it turns red and cuts), dashes straight through you, X and + cuts, rings of swords that close in on you, starbursts of blades (stand in the gaps), and sword rain. Every hit takes a quarter of your health. After every 15 moves he CHARGES: be in front of a pillar so he slams into it, then hit that pillar 3 times with a pickaxe while he''s stunned to drop it on him. Four pillars, four phases. Nobody dies here: you fall to your knees and keep everything. If you go down he tells you about the kingdom Below the Bedrock (you can skip it), then asks "Do you want to do it again..?" Yes: straight back to the tiger. No: "Get out of my sight." He kicks you out, the way down closes, and you have to find Swarm again (no second Fist). Comes back 30 minutes after he''s beaten.'
    drops:
    - 32 Mythic Goodie Bags|100%
    - 5 Netherite Blocks|100%
    - Mirror..??|100%
    - 3,000 XP|100%
  - chapter: bosses
    id: black_tiger
    name: The Black Tiger
    icon: black_tiger
    detect-tag: faultline_explorer_tiger
    where: 'The Lost Explorer''s tiger. It sits at the foot of his pillar until he snaps his fingers. 2,000 health.'
    does: 'Fight 1 of the Lost Explorer. Swords, axes and arrows all hurt it. It prowls and circles you, rakes with its paws (twice in a row below half health), crouches and pounces onto a red circle, and roars to throw you back and slow you. Every hit takes a quarter of your health: four and you''re on your knees.'
    drops:
    - Nothing (its master is next)|-
  - chapter: accessories
    id: lost_mirror
    name: Mirror..??
    icon: lost_mirror
    detect: faultlineitems:lost_mirror
    how: Dropped by the Lost Explorer.
    does: A hit that would take a third of your health or more bounces off you and back at whoever dealt it (up to 15 hearts), and you take none of it. Then it needs 45 seconds to clear. You look into it. Something looks back.
  - chapter: enemies
    name: Vendetta Enforcer
    icon: vendetta_enforcer
    detect-tag: faultline_vendetta_fam
    where: Rocco Vendetta's family. They show up when he calls "Assemble!"
    does: 'The family''s muscle: purple coat, gold chain, dark glasses. They fight with their fists. Each one that dies makes Werner stronger.'
    drops:
    - Nothing|-
  - chapter: consumables
    name: Vendetta Contract
    icon: vendetta_contract
    detect: faultlinebosses:vendetta_item=contract
    how: 'Craft a Book with 4 Gold Blocks (corners) and 4 Netherite Scrap (sides) around it.'
    does: Use it on open, flat ground (no buildings nearby) to summon Rocco Vendetta (15 minute cooldown after he falls).
  - chapter: weapons
    name: Vendetta Fist
    icon: vendetta_fist
    detect: faultlinebosses:vendetta_item=fist
    how: Dropped by Rocco Vendetta.
    does: '+8 attack damage, fast. Sneak + right-click to pick a move, right-click to use it: Kick and Punch (stun), Payback, Assemble (two Enforcers fight for you), Watch Your Back!, MY HAIR COUPONS!!!, Swear Vengeance, No More Tests, COMPLETE AND TOTAL EXTERMINATION!!! (needs 50 tattoos), Mercy of the Big Brother, TRICKED ME, DID YOU??!! and Ah, You Were One of the Fam (a big shield for some health). Getting hit while holding it gives you Vengeance Tattoos, and when you drop below half health, Werner comes to help for 30 seconds (every 5 minutes). PvE only: its moves never hit players, and against a player it hits like a bare hand.'

  # ---------------------------------------------------------------- SHIPS (FaultlineShips)
  - {chapter: weapons, name: "Sloop Blueprint", icon: sloop_blueprint, detect: "faultlineships:sloop_blueprint",
     how: "Craft it: Paper on the 4 sides of any Boat.",
     does: "Right-click open water to lay out a small ship (built in front of you, bow pointing where you face), then place every glowing block: 60 Planks, 19 Wooden Fences, 16 Wool, 8 Logs, 4 Ladders, 2 Lanterns and 2 Ship Cannons (any wood works, the ship keeps the one you used). Sneak + right-click fills up to 16 at once, masts and sails too. 150 health, 3 seats, the fastest. Right-click the wheel to steer: W sail, S brake (press again to go astern), A/D steer, Sprint for full sail, Jump drops anchor (the deck becomes solid and the ladders climbable). Right-click it with any banner to fly it from the mast; /ship name names it."}
  - {chapter: weapons, name: "Brigantine Blueprint", icon: brigantine_blueprint, detect: "faultlineships:brigantine_blueprint",
     how: "Craft it: Gold Ingots in the corners, Paper on the sides, a Sloop Blueprint in the middle.",
     does: "A medium ship: 296 blocks (156 Planks, 50 Wool, 48 Fences, 20 Logs, 8 Trapdoors, 4 Ladders, 4 Ship Cannons, 3 Stairs, 2 Lanterns, 1 Chest), two masts, a crow's nest and a raised stern. 350 health, 5 seats and a 27-slot hold (only you and your crew can open it). Needs water 2 deep under the keel."}
  - {chapter: weapons, name: "Galleon Blueprint", icon: galleon_blueprint, detect: "faultlineships:galleon_blueprint",
     how: "Craft it: Diamonds in the corners, Paper on the sides, a Brigantine Blueprint in the middle.",
     does: "The big one: 666 blocks (405 Planks, 100 Wool, 79 Fences, 43 Logs, 8 Ship Cannons, 8 Trapdoors, 7 Stairs, 6 Ladders, 6 Glass Panes, 2 Chests, 2 Lanterns), three masts, a crow's nest, a two-level stern castle with windows and a forecastle. 700 health, 9 seats, 8 cannons and a 54-slot hold, but slow to turn. Needs water 2 deep under the keel."}
  - {chapter: weapons, name: "Built Ship", icon: galleon_blueprint, detect: "faultlineships:built_ship",
     how: "Admin only: /ship give built_<ship>, /ship spawn <ship>, or /itemsmenu. Sometimes handed out as a prize.",
     does: "A ship that's already built (any of the five). Right-click open water and it's there, finished, anchored and ready to sail, in oak with white sails (black and white on the Pirate Ship). Scrapping it gives the built ship back instead of its blocks."}
  - {chapter: weapons, name: "Shipwright's Hammer", icon: shipwright_hammer, detect: "faultlineships:shipwright_hammer",
     how: "Craft it: 3 Iron Ingots on top, Iron / any Planks / Iron in the middle, a Stick at the bottom.",
     does: "Ships lose health to axes and other weapons, arrows, cannonballs, explosions and running into the shore. At 0 a ship is wrecked: torn sails, and it can't sail until it's back to full. Right-click a damaged ship with the hammer, then right-click when the white marker is in the green (gold = perfect, it fixes more). Each good hit uses 1 Planks; the green gets smaller and the marker faster as your streak grows."}
  - {chapter: weapons, name: "Ship Cannon", icon: ship_cannon, detect: "faultlineships:ship_cannon",
     how: "Craft it: 3 Iron Ingots on top, Iron and Gunpowder in the middle, a Log in each bottom corner.",
     does: "Part of every ship: right-click a ship's glowing cannon spot with it (Sloop 2, Brigantine 4, Galleon 8). Fire it with Cannonballs."}
  - {chapter: weapons, name: "Cannonball", icon: cannonball, detect: "faultlineships:cannonball",
     how: "Craft it: an Iron Ingot and Gunpowder make 4.",
     does: "On a ship with cannons, right-click while looking over the side: the nearest loaded cannon on that side fires (aim up to 35 degrees either way, 3 second reload per cannon). It blows up where it lands without breaking blocks, does 45 damage to a ship it hits, and hurts whatever's near."}
  - {chapter: weapons, name: "Dinghy Blueprint", icon: dinghy_blueprint, detect: "faultlineships:dinghy_blueprint",
     how: "Craft it: 2 Paper and any Boat (shapeless).",
     does: "A little rowboat for fishing: 26 blocks (23 Planks, 2 Wooden Fences for the oars, 1 Lantern). 60 health, 2 seats, no cannons, and the quickest to turn. Sneak + right-click it for a 9-slot fish hold. Fits in shallow water and narrow rivers."}
  - {chapter: weapons, name: "Pirate Ship Blueprint", icon: pirate_blueprint, detect: "faultlineships:pirate_blueprint",
     how: "Craft it: Black Dye in the corners, Paper on the sides, a Galleon Blueprint in the middle and a Wither Skeleton Skull at the bottom (D P D / P G P / D S D).",
     does: "The biggest ship: 882 blocks (522 Planks, 122 Black Wool and 50 White Wool for the skull-and-bones sails, 92 Fences, 47 Logs, 10 Ladders, 10 Ship Cannons, 8 Trapdoors, 7 Stairs, 6 Glass Panes, 5 Lanterns, 2 Chests, 1 hatch Trapdoor). Three masts, a crow's nest, a quarterdeck, a poop deck, a forecastle and a hold below deck (go down the hatch). 900 health, 9 seats, 10 cannons, a 54-slot hold. Needs water 2 deep under the keel."}
  - {chapter: consumables, name: "Phantom Bell", icon: ghost_captain, detect: "faultlineships:phantom_bell",
     how: "Craft: a bell ringed with 4 phantom membranes and 4 ghast tears.",
     does: "Ring it at sea at night (on a ship, in a boat, or swimming in the ocean) and the Ghost Ship, the Wailing Mary, sails out of the fog. Bring a Lantern of Souls: without one she can't be touched or boarded."}
  - {chapter: consumables, name: "Cursed Pirate Horn", icon: pirate_horn, detect: "faultlineships:pirate_horn",
     how: "Only in the holds of skeleton ships (15% in a lone one, 5% in an invasion ship).",
     does: "Blow it while on a ship at sea to call the Pirate Invasion: 15+ skeleton ships come at you, with their flagship, the Black Gallows, in the back. Sink the fleet, then beat the flagship's three bosses one after the other. Its own music plays the whole time."}

  # ---------------------------------------------------------------- PIRATES (FaultlineShips)
  - {chapter: bosses, name: "The Captain's Son", icon: captains_son, detect-tag: faultline_pirate_son,
     where: "The first boss of the Pirate Invasion. Once the fleet is sunk the flagship drops anchor with all three captains on its deck: climb its ladders and fight them one after another. 320 health.",
     does: "Quick and cocky, with a golden cutlass. Lunges at you, throws a smoke bomb (blinds you and he appears behind you) and fires his flintlock.",
     drops: ["300 XP|100%"]}
  - {chapter: bosses, name: "The Skeleton Commander", icon: skeleton_commander, detect-tag: faultline_pirate_commander,
     where: "The second boss of the Pirate Invasion: he waits amidships on the flagship until the Son falls. 480 health.",
     does: "The skeleton army's commander, Jolly Roger on his head. Fires a fan of 7 arrows, rallies 3 more Deckhands and Musketeers, and blows his war horn to give his crew Strength.",
     drops: ["300 XP|100%"]}
  - {chapter: bosses, name: "The Skeleton Captain", icon: skeleton_captain, detect-tag: faultline_pirate_captain,
     where: "The last boss of the Pirate Invasion: he waits on the flagship's poop deck until the Commander falls. 900 health.",
     does: "Huge, in netherite. A cutlass sweep that knocks you back, a broadside (red marks on the deck, then cannon fire comes down on them), and an anchor slam. Below half health his ghost crew of 4 Ghost Pirates rises. Beat him and everyone who fought gets 2 Mythic Goodie Bags, an accessory, a 50% Zombie Omen V and a 25% Pirate Ship Blueprint.",
     drops: ["300 XP|100%", "2 Mythic Goodie Bags (each fighter)|100%", "An accessory (each fighter)|100%", "Zombie Omen V|50%", "Pirate Ship Blueprint|25%"]}
  - {chapter: enemies, name: "Skeleton Deckhand", icon: skeleton_deckhand, detect-tag: faultline_pirate_deckhand,
     where: "Crews skeleton ships. 24 health.",
     does: "A red-capped skeleton with an iron cutlass. Comes up on deck to fight when its ship drops anchor.", drops: ["1-3 Bones|100%", "2-6 Gold Nuggets|30%", "1-3 Cannonballs|20%"]}
  - {chapter: enemies, name: "Skeleton Musketeer", icon: skeleton_musketeer, detect-tag: faultline_pirate_musketeer,
     where: "Crews skeleton ships. 22 health.",
     does: "Shoots hard-hitting musket shots from the deck, even while the ship sails.", drops: ["1-3 Bones|100%", "2-6 Gold Nuggets|30%", "1-3 Cannonballs|20%"]}
  - {chapter: enemies, name: "Skeleton Gunner", icon: skeleton_gunner, detect-tag: faultline_pirate_gunner,
     where: "Crews skeleton ships. 26 health.",
     does: "Lobs lit cannonballs at you from up to 22 blocks away. They blow up where they land.", drops: ["1-3 Bones|100%", "2-6 Gold Nuggets|30%", "1-3 Cannonballs|20%"]}
  - {chapter: enemies, name: "Skeleton Boarder", icon: skeleton_boarder, detect-tag: faultline_pirate_boarder,
     where: "Crews skeleton ships. 28 health.",
     does: "Leaps across the water onto your ship, axe first.", drops: ["1-3 Bones|100%", "2-6 Gold Nuggets|30%", "1-3 Cannonballs|20%"]}
  - {chapter: enemies, name: "Powder Monkey", icon: powder_monkey, detect-tag: faultline_pirate_powder_monkey,
     where: "Crews skeleton ships. 12 health.",
     does: "A tiny, fast skeleton with a TNT block on its head. Runs up to you, lights its fuse and blows up a second later (killing it with arrows still sets it off).",
     drops: ["1-3 Bones|100%", "2-4 Gunpowder|100%", "2-6 Gold Nuggets|30%", "1-3 Cannonballs|20%"]}
  - {chapter: enemies, name: "Drowned Corsair", icon: drowned_corsair, detect-tag: faultline_pirate_corsair,
     where: "Swims around skeleton ships. 30 health.",
     does: "A fast-swimming drowned with a trident, waiting for anyone who falls in.", drops: ["1-3 Bones|100%", "2-6 Gold Nuggets|30%", "1-3 Cannonballs|20%"]}
  - {chapter: enemies, name: "Skeleton Bosun", icon: skeleton_bosun, detect-tag: faultline_pirate_bosun,
     where: "Crews skeleton ships. 34 health.",
     does: "Swings a chain that drags you in from up to 10 blocks, and drives the crew near him on (Speed).", drops: ["1-3 Bones|100%", "2-6 Gold Nuggets|30%", "1-3 Cannonballs|20%"]}
  - {chapter: enemies, name: "Ghost Gull", icon: ghost_gull, detect-tag: faultline_pirate_gull,
     where: "Circles above some skeleton ships. 10 health.",
     does: "A small pale phantom that swoops at you, day or night.", drops: ["1-3 Bones|100%", "2-6 Gold Nuggets|30%", "1-3 Cannonballs|20%"]}
  - {chapter: enemies, name: "Bone Shark", icon: bone_shark, detect-tag: faultline_pirate_shark,
     where: "In the water around some skeleton ships. 36 health.",
     does: "A big guardian that hunts swimmers. Don't fall in.", drops: ["1-3 Bones|100%", "2-6 Gold Nuggets|30%", "1-3 Cannonballs|20%"]}
  - {chapter: enemies, name: "Skeleton Navigator", icon: skeleton_navigator, detect-tag: faultline_pirate_navigator,
     where: "At the helm of every skeleton ship. 26 health.",
     does: "Spots you through his spyglass from up to 44 blocks: you glow, and while you glow the ship's cannons aim true. Kill him first.", drops: ["1-3 Bones|100%", "2-6 Gold Nuggets|30%", "1-3 Cannonballs|20%"]}
  - {chapter: enemies, name: "Ghost Pirate", icon: cursed_wraith, detect-tag: faultline_pirate_wraith,
     where: "Some skeleton ship crews, and the Skeleton Captain's ghost crew (4 rise when he drops below half health). 34 health.",
     does: "A drowned sailor's ghost: you only see its glowing outline and its cutlass, trailing souls. It drifts down slowly instead of falling, and its blade withers you.", drops: ["1-3 Bones|100%", "2-6 Gold Nuggets|30%", "1-3 Cannonballs|20%"]}

  # ---------------------------------------------------------------- 1.5: meteors, the Caravan, Grimtusk, seasons
  - {chapter: bosses, id: grimtusk, name: "Grimtusk, the Piglin Warlord", icon: grimtusk, detect-tag: faultline_grimtusk,
     where: "Raise a Warlord's Challenge inside a Bastion Remnant in the Nether. 3,000 health (+20% per extra fighter), over 3 phases. Music: Pigstep.",
     does: "Phase 1: he rides Ironhide, his armored war hoglin, and takes 60% less damage while mounted: Tusk Charge (a red line, then Ironhide charges down it), Golden Cleave (a flaming arc in front of him), Rally the Bastion (Bastion Guards and Crossbowmen pour out) and Fireball Volley. Bring Ironhide down, or Grimtusk drops to 70% and Ironhide collapses. Phase 2 on foot adds Magma Slam (he leaps at you: jump over the ring of magma), Soul Fire Lines and Warcry (throws everyone back and drives his guards on). Below 35% he's enraged: faster, harder hitting, and Gold Rain drops gold blocks onto glowing circles.",
     drops: ["6-10 Mythic Goodie Bags|100%", "4 Goodie Bags|100%", "8-16 Gold Blocks|100%", "2-4 Ancient Debris|100%", "1-3 Netherite Ingots|50%", "Grimtusk's Cleaver|25%", "2,000 XP|100%"]}
  - {chapter: bosses, id: ironhide, name: "Ironhide", icon: ironhide, detect-tag: faultline_ironhide,
     where: "Grimtusk's war hoglin: he rides it out of the bastion. 600 health.",
     does: "Charges where its tusks point, gores anyone close, and shields its rider (Grimtusk takes 60% less damage while he's on it).",
     drops: ["6-11 Cooked Porkchops|100%", "4-7 Leather|100%"]}
  - {chapter: enemies, name: "Bastion Guard", icon: bastion_guard, detect-tag: faultline_grimtusk_guard,
     where: "Called out by Grimtusk's Rally the Bastion. 40 health.", does: "A Piglin Brute with a golden axe. His Warcry makes them stronger and faster.",
     drops: ["3-7 Gold Nuggets|60%"]}
  - {chapter: enemies, name: "Bastion Crossbowman", icon: bastion_crossbowman, detect-tag: faultline_grimtusk_xbow,
     where: "Called out by Grimtusk's Rally the Bastion. 24 health.", does: "A piglin with a crossbow that keeps its distance.",
     drops: ["3-7 Gold Nuggets|60%"]}
  - {chapter: consumables, name: "Warlord's Challenge", icon: warlord_challenge, detect: "faultlinebosses:warlord_item=challenge",
     how: "Craft it: Gold Blocks in the corners, Blaze Rods on the edges, a Netherite Scrap in the middle.",
     does: "Raise it inside a Bastion Remnant in the Nether to summon Grimtusk, the Piglin Warlord."}
  - {chapter: weapons, name: "Grimtusk's Cleaver", icon: warlord_cleaver, detect: "faultlinebosses:warlord_item=cleaver",
     how: "25% from Grimtusk, the Piglin Warlord (each fighter rolls).",
     does: "A netherite axe. Right-click: Golden Cleave, a burning sweep in front of you (10 damage, sets them on fire, 12 second cooldown)."}
  - {chapter: enemies, name: "Molten Husk", icon: molten_husk, detect-tag: faultline_meteor_husk,
     where: "Guards a fallen meteor (every 4 hours, 1000 blocks from someone). 40 health.", does: "A burning husk with a magma head and a Fire Aspect II golden sword.",
     drops: ["3-8 Gold Nuggets|100%", "1-2 Magma Cream|30%"]}
  - {chapter: enemies, name: "Meteor Crawler", icon: meteor_crawler, detect-tag: faultline_meteor_crawler,
     where: "Crawls out of a fallen meteor. 12 health.", does: "Small, fast and bitey, in a pack of four. Pops in embers when it dies.",
     drops: ["2-5 Iron Nuggets|50%"]}
  - {chapter: enemies, name: "Star Sentinel", icon: star_sentinel, detect-tag: faultline_star_sentinel,
     where: "Floats over a fallen meteor. 80 health.", does: "A big glowing blaze that throws fireballs at anyone going for the meteor's core.",
     drops: ["2-4 Blaze Rods|100%", "1-2 Diamonds|40%"]}
  - {chapter: friends, id: caravan_merchant, name: "Caravan Merchant", icon: caravan_merchant, detect-tag: faultline_caravan,
     where: "Every 3 hours the Caravan sets up camp 40-100 blocks from a random player for one hour (the whole server is told where; /caravan says where he is or when he's back).",
     does: "Sells rare things for diamonds, emeralds and netherite: Totems, Elytra, Mythic Goodie Bags, top enchanted books, smithing templates, a Nether Star, a Bait Worm, sometimes even the Ankh or the Cross. 8 offers each visit, a few of each."}
  - {chapter: consumables, name: "Candy", icon: season_candy, detect: "faultlinecosmetics:candy",
     how: "Halloween only (October 1 - November 2): hostile mobs you kill sometimes drop 1-2.",
     does: "Spend it on Halloween cosmetics in the Seasonal Shop (/cosmetics): Pumpkin Head, Witch Hat, Bat Wings, Skeleton Suit. They're yours forever."}
  - {chapter: consumables, name: "Present", icon: season_present, detect: "faultlinecosmetics:present",
     how: "Winter only (December 1 - January 6): hostile mobs you kill sometimes drop 1-2.",
     does: "Spend it on Winter cosmetics in the Seasonal Shop (/cosmetics): Santa Hat, Reindeer Antlers, Winter Scarf, Gift Sack, Ugly Sweater. They're yours forever."}

  - {chapter: weapons, name: "Boss Rush Sigil", icon: boss_rush_sigil, detect: "faultlinebosses:rush_sigil",
     how: "Craft it: 8 Netherite Blocks around a Nether Star.",
     does: "Right-click it to start a Boss Rush: every boss back to back (14 of them), with everyone in survival within 10 blocks on your team. It's never used up. Each player can run one Boss Rush an hour."}

  # ---------------------------------------------------------------- 1.6: the wild update
  - {chapter: bosses, id: leviathan, name: "The Leviathan", icon: leviathan, detect-tag: faultline_leviathan,
     where: "The deep ocean. A mini boss of the deep ocean. Drop an Abyssal Lure over open water (from a ship, a boat or swimming), or meet it sailing the deep ocean at night. 900 health (+25% per extra fighter).",
     does: "A sea serpent that breaches the waves as it circles you. Tidal Ram (it dives, a blue line shows, it surges along it: ships in the way take a big hit), Water Spout (geysers under you), Bile (poison globs), Abyssal Roar, Breach (it leaps clean out of the sea and crashes down on a blue ring). From 60%: the Coil (it circles you tight and crushes, ships inside break), Tail Sweep, Whirlpool (the sea drags you and your boat into the middle), and Drowned of the Deep. From 30% it rams more. Takes half damage while diving. Music: Creator.",
     drops: ["4-6 Mythic Goodie Bags|100%", "3 Goodie Bags|100%", "6-12 Diamonds|100%", "Heart of the Sea|100%", "Tidebreaker|25%", "2,000 XP|100%"]}
  - {chapter: bosses, id: sandworm_king, name: "The Sandworm King", icon: sandworm_king, detect-tag: faultline_sandworm_king,
     where: "A mini boss of the deserts and badlands. Beat a Sandworm Drum on the sand. 900 health (+25% per extra fighter).",
     does: "A colossal worm that swims through the sand. Eruption (a ring under you, then it bursts up there and arcs back down), Slither (it rides the surface at you), Sandstone Boulders, Quicksand (slows you and drags you in), Sandblast (it rears up and sweeps a blinding cone of sand). From 60%: Sandworm Larvae and Devour (a red ring shrinks under you: still in it, you're swallowed; hit it hard to make it spit you out). From 30%: Tremor (rings race along the ground: be in the air when one passes). Music: 5.",
     drops: ["4-6 Mythic Goodie Bags|100%", "3 Goodie Bags|100%", "6-12 Diamonds|100%", "4-8 Gold Blocks|100%", "Sandworm Fang|25%", "2,000 XP|100%"]}
  - {chapter: bosses, id: lich, name: "The Lich", icon: lich, detect-tag: faultline_lich,
     where: "A mini boss of the Deep Dark. Break a Cursed Phylactery there. 900 health (+25% per extra fighter).",
     does: "An undead sorcerer-king who floats and blinks around. Soul Bolts (homing skulls), Raise the Fallen (Revenants wearing YOUR faces), Death Ring (jump the soul fire), Blink Strike, Grasp of the Grave (bone hands burst out of the floor and hold you: leave the purple rings). At 60% he hides his life in three Phylacteries (end crystals): he can't be hurt until they're broken. + Darkness and Bone Spears (lines of bone spikes run out at you). From 30%: Life Drain (beams from everyone near him heal him). Music: 13.",
     drops: ["4-6 Mythic Goodie Bags|100%", "3 Goodie Bags|100%", "2-4 Echo Shards|100%", "Totem of Undying|50%", "Staff of the Lich|25%", "2,500 XP|100%"]}
  - {chapter: bosses, id: frost_wyrm, name: "The Frost Wyrm", icon: frost_wyrm, detect-tag: faultline_frost_wyrm,
     where: "A mini boss of the frozen peaks, snowy slopes, groves and ice spikes. Sound a Frozen Horn up there. 900 health (+25% per extra fighter).",
     does: "An ice dragon that circles high above (bring a bow). Frost Breath (it hovers and freezes a cone), Icicle Rain, Dive Bomb (a swoop down a red line), Glacial Roar (it lands and ice spikes burst out around it), Ice Shard Volley (fans of ice from its mouth). From 60%: Wyrmguard Archers and Wing Gust (three wingbeats blast you away). From 30%: a blizzard around it all fight. Music: Relic.",
     drops: ["4-6 Mythic Goodie Bags|100%", "3 Goodie Bags|100%", "8-16 Diamonds|100%", "Elytra|10%", "Glacial Fang|25%", "2,500 XP|100%"]}
  - {chapter: bosses, id: stone_golem, name: "The Stone Golem", icon: stone_golem, detect-tag: faultline_stone_golem,
     where: "A mini boss of the lush caves: it wakes by itself near someone exploring one. 900 health (+25% per extra fighter).",
     does: "An ancient mossy guardian with amber eyes. Ground Pound (a shockwave ring), Boulder Throw, Crystal Spikes (amethyst bursts along a line). Below 60% it roots itself and heals (Overgrowth) until you hit it hard enough.",
     drops: ["2-4 Ancient Gear Parts|100%", "Mythic Goodie Bag|100%", "2 Goodie Bags|100%", "8-16 Amethyst Shards|100%", "600 XP|100%"]}
  - {chapter: bosses, id: ghost_captain, name: "Captain Hollow", icon: ghost_captain, detect-tag: faultline_ghost_captain,
     where: "On the deck of the Ghost Ship, the Wailing Mary, on dark nights at sea. She's untouchable until someone near her holds a Lantern of Souls: then she anchors and you can board. 400 health.",
     does: "A drowned captain's ghost. Blinks behind you, sweeps with a spectral cutlass, calls up Ghost Pirates, and drags you to him with soul chains (Darkness). Beat him and her hold is yours.",
     drops: ["2 Mythic Goodie Bags|100%", "2 Goodie Bags|100%", "4-8 Diamonds|100%", "Music Disc (The Pirate Invasion)|25%", "Her hold: gold, diamonds, echo shards...|100%"]}
  - {chapter: enemies, id: revenant, name: "Revenant", icon: revenant, detect-tag: faultline_revenant,
     where: "Raised by the Lich.", does: "A zombie wearing the face of someone fighting the Lich."}
  - {chapter: enemies, id: sandworm_larva, name: "Sandworm Larva", icon: sandworm_king, detect-tag: faultline_sandworm_larva,
     where: "Burrows out of the sand around the Sandworm King.", does: "A big, fast silverfish."}
  - {chapter: enemies, id: drowned_of_the_deep, name: "Drowned of the Deep", icon: leviathan, detect-tag: faultline_leviathan_minion,
     where: "Called up by the Leviathan.", does: "Drowned with tridents."}
  - {chapter: enemies, id: wyrmguard_archer, name: "Wyrmguard Archer", icon: frost_wyrm, detect-tag: faultline_frost_wyrm_minion,
     where: "Called down from the snow by the Frost Wyrm.", does: "A stray that keeps its distance and shoots."}
  - {chapter: enemies, id: mimic, name: "Mimic", icon: mimic, detect-tag: faultline_mimic,
     where: "1% of the loot chests you find (dungeons, temples, mineshafts...) bite back.",
     does: "The chest grows teeth and legs and comes after you, lid snapping. 60 health.", drops: ["Everything the chest held|100%", "2-6 Gold Ingots|100%", "1-2 Diamonds|35%"]}
  - {chapter: enemies, id: locust, name: "Locust", icon: locust, detect-tag: faultline_locust,
     where: "A locust swarm sometimes finds a farm by day.", does: "They eat your crops back to seedlings until the swarm is driven off. Drive it off for emeralds and bone meal."}

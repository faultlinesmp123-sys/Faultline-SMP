    icon: depths_charm
    detect: faultlineitems:depths_charm
    how: 33% from Elder Guardians. The Skeleton Wanderer rarely sells one.
    does: Halves Crush Depth damage (deep underwater, below y=0, while out of breath).
  - chapter: accessories
    name: Abyssal Diving Gear
    icon: abyssal_diving_gear
    detect: faultlineitems:abyssal_diving_gear

name: FaultlineIndex
version: '1.6.19'
main: net.faultlinesmp.index.FaultlineIndex
api-version: '1.21'
author: FaultlineSMP
description: The Faultline Index — every item, boss, and enemy on the server
softdepend: [FaultlineItems, FaultlineBosses, FaultlineRaids, FaultlineShips, FaultlineCosmetics, LimboBlackMarket, floodgate, Geyser-Spigot]

commands:
  index:
    description: Open your Faultline Index
    usage: /index [achievements|give|reset] [player]

  museum:
    description: The Hall of Firsts (who defeated each boss and found each item first)
    usage: /museum [bosses|items]
  serverstats:
    description: The whole server in numbers
    usage: /serverstats
  report:
    description: Report a player (or a problem) to the staff
    usage: /report <player> <reason>
  reports:
    description: "Staff: the latest player reports"
    usage: /reports [count]
    permission: faultlineindex.reports
  guide:
    description: "The server guide: the Index, the Quest Book, the Black Market, bosses, raids, ships and more"
    usage: /guide [chapter]
    aliases: [tutorial, help-faultline]
  suggest:
    description: Suggest something for the server (posted in the Discord)
    usage: /suggest <your idea>
  suggestions:
    description: "Staff: the latest suggestions"
    usage: /suggestions [count]
    permission: faultlineindex.reports
  watch:
    description: "Staff: x-ray, cheat, dupe, grief and alt logs"
    usage: /watch [<player>|log [player] [n]|xray [player]|alts <player>|check <player>|alerts]
    permission: faultlineindex.watch
  discord:
    description: "Admin: test the Discord bridge (/discord test [message]); reloads its settings"
    usage: /discord [status|test [message]]
    permission: faultlineindex.admin

permissions:
  faultlineindex.admin:
    description: Give Index books and reset players' Index progress
    default: op
  faultlineindex.reports:
    description: See player reports in game, /reports, and no report cooldown
    default: op
  faultlineindex.logged:
    description: Commands this player runs are posted to the Discord logs channel (ops always are)
    default: false
  faultlineindex.watch:
    description: /watch (x-ray, cheat, grief and alt logs)
    default: op
  faultlineindex.alerts:
    description: Get Watch alerts in game (x-ray, reach, fly, illegal items, griefing, ban evasion...)
    default: op
  faultlineindex.watch.exempt:
    description: Not judged by Watch's cheat checks (ops are judged unless given this)
    default: false

# Faultline SMP - Faultline SMP Items configuration (Magic Mirror + Cloud Potion + Darkness Potion + Golden Ring + Goodie Bag)

# How long (in seconds) the teleport takes to channel. Cancels if the
# player moves or takes damage during this window.
teleport-delay-seconds: 3

# Seconds a player must wait between successful teleports.
cooldown-seconds: 10

# How many successful teleports the mirror can be used for before it
# shatters. Repair it in an anvil with a gold ingot to reset this.
max-uses: 10

# Seconds after taking damage from another player before the mirror can
# be used again. Prevents tanking a hit, waiting out the channel-cancel,
# and immediately escaping with the mirror.
combat-lock-seconds: 10

# World + coordinates the "Black Market" option teleports to.
black-market:
  world: "world"
  x: -3226
  y: 65
  z: 353

# World the "Nether" option picks a random safe spot in.
# radius is measured from x=0,z=0 in that world.
nether:
  world: "world_nether"
  radius: 5000

# Flight guard: a survival/adventure player only keeps "allowed to fly" for Bat Form, a Cloud Potion, or the
# faultline.fly / essentials.fly permission (or op). Fixes the Moon Stone creative-flight glitch.
flight-guard:
  enabled: true

# Cloud Potion settings
cloud-potion:
  duration-seconds: 35
  # Cooldown between individual double-jumps while the effect is active,
  # so holding/mashing space mid-air can't chain into infinite hover.
  per-jump-cooldown-ms: 500
  # Upward velocity applied on each double-jump (vanilla jump is ~0.42).
  jump-velocity: 0.65

# Darkness Potion settings
darkness-potion:
  duration-seconds: 25

# Golden Ring settings
golden-ring:
  exp-multiplier: 1.5        # 1.2.31 balance: was 2.0 (a cheap craft doubling all kill XP)
  # Blocks, measured from the ring-carrier, that a natural mob spawn has
  # to happen within to be eligible for the bonus-spawn roll below.
  mob-spawn-radius: 64
  # Chance for an EXTRA copy of a natural spawn to appear nearby a
  # ring-carrier. 0.5 (50%) averages out to roughly 1.5x total spawns.
  mob-spawn-extra-chance: 0.5

# Goodie Bag settings
goodie-bag:
  mob-kill-drop-chance: 0.05
  diamond-min: 3
  diamond-max: 5
  elytra-chance: 0.0001
  # Mobs from spawners don't drop Goodie Bags by default, since a spawner
  # grinder would otherwise print diamonds. Set to false to let them count.
  exclude-spawner-mobs: true
  # Bred/hatched animals, built snow/iron golems, spawn-egg mobs, and plugin-spawned mobs (boss minions,
  # raid waves) don't drop them either, or a chicken farm or a long boss fight prints diamonds.
  exclude-farmed-mobs: true

# Mythic Goodie Bag — boss-only drop (player kill required). Loot table
# (one roll per bag): 0.001% Elytra (elytra-chance), then 10% Netherite Block, 20% 5 Diamond
# Blocks, 20% Totem, 20% 2 Ancient Debris, 15% 16 XP Bottles + 2 Golden
# Apples, 15% 16 Ender Pearls.
mythic-goodie-bag:
  elytra-chance: 0.00001     # 0.001% (1 in 100,000)
  warden-drop-chance: 0.10
  wither-drop-chance: 0.125

# Bezoar settings — drops from Bees or Cave Spiders
bezoar:
  drop-chance: 0.02

# Discount Card settings — drops from killing a Villager
discount-card:
  drop-chance: 0.03          # 1.2.31 balance: was 0.10 (villagers can be bred)
  discount-percent: 10       # 1.2.31 balance: was 17.5

# Life Jelly settings — drops from Glow Squids
life-jelly:
  drop-chance: 0.05
  heal-percent: 0.01         # of max health every 2 seconds (1.2.31 balance: was a fixed 2%, a free Regeneration I forever)

# Shield of the Ocean — 100% guaranteed drop from Elder Guardians, no
# config needed for the drop chance.
shield-of-the-ocean:
  # Land movement speed boost (percentage, e.g. 0.10 = +10%).
  move-speed-boost: 0.05     # 1.2.31 balance: was 0.10 (more than the Harpy Ring's netherite-block 7.5%)
  # Swim boost via WATER_MOVEMENT_EFFICIENCY (0-1 range, added directly —
  # NOT a percentage/multiplier, since that attribute defaults to 0).
  # 0.3 is roughly one level of Depth Strider. Nerfed down from the
  # original full Dolphin's Grace effect, which was way too fast — lower
  # this further if it's still too much.
  swim-efficiency-boost: 0.3

# Mobs from spawners never drop Lava Charms, Black Belts, Moon Stones,
# Ranger Emblems, or Necromancer Staffs (otherwise a grinder farms them).
drops:
  exclude-spawner-mobs: true

# Lava Charm (accessory) — first touch of lava/fire gives immunity, then cooldown.
lava-charm:
  immunity-seconds: 7
  cooldown-seconds: 60
  bat-drop-chance: 0.05
  blaze-drop-chance: 0.10

# Black Belt (accessory)
black-belt:
  damage-reduction: 0.05
  speed-penalty: 0          # 1.2.31 balance: was 0.025 (the Bloody Wolf Scarf beat it in every way)
  # Zombies (incl. Husks, Drowned, Zombie Villagers) and Skeletons (incl. Strays)
  drop-chance: 0.01

# Moon Stone (accessory) — vampire while equipped.
moon-stone:
  # Heals this fraction of the melee damage you deal.
  lifesteal: 0.05
  # At night, heal this fraction of max health every N seconds.
  night-regen-percent: 0.05
  night-regen-interval-seconds: 5
  bat-drop-chance: 0.01
  phantom-drop-chance: 0.02  # 1.2.31 balance: was 0.05 (Strength I + Regeneration every night)
  # Shift + F (or /batform) with the Moon Stone equipped: become a bat and fly.
  bat-form:
    seconds: 20
    cooldown-seconds: 120    # starts when the bat form ends
    hearts: 2                # max health while a bat
    fly-speed: 0.12          # normal creative flight is 0.1
    scale: 0.35              # how small you get

# Ranger Emblem (accessory)
ranger-emblem:
  damage-bonus: 0.01         # 1.2.35: was 0.05 (1.2.27: 0.10); an old 0.10 or 0.05 reads as 0.01
  pillager-drop-chance: 0.02

# Necromancer Staff — needs the Necromancer's Trial quest (LimboBlackMarket) to use.
necromancer-staff:
  cooldown-seconds: 90
  min-minions: 6
  max-minions: 9
  minion-lifetime-seconds: 30
  # How recently you must have hit (or been hit by) a player for minions to attack them.
  combat-window-seconds: 15
  # Lag safety: total minions allowed on the whole server at once.
  max-minions-server: 60
  wither-skeleton-drop-chance: 0.005
  skeleton-drop-chance: 0.001
  # With no player fight going on, minions hunt hostile mobs within this range
  # (and follow you around when there's nothing to fight). Also used by the Spider Staff.
  hunt-radius: 16

# Bloody Wolf Scarf (accessory)
bloody-wolf-scarf:
  damage-reduction: 0.03     # 1.2.31 balance: was 0.05 (the same as the Black Belt, plus melee damage)
  melee-bonus: 0.025
  drop-chance: 0.05          # Piglin Brutes

# Frost Flare (accessory)
frost-flare:
  slowness-seconds: 3        # Slowness I on every hit
  speed-bonus: 0.05
  mob-spawn-radius: 64       # natural spawns are doubled within this range of a wearer
  extra-exhaustion-per-second: 0.05   # 4.0 exhaustion = 1 hunger point
  snow-golem-drop-chance: 0.0075

# Spelunker's Amulet (accessory)
spelunker-amulet:
  mining-speed-bonus: 0.10   # 1.2.31 balance: was 0.02 (you couldn't feel it)
  ore-drop-chance: 0.005     # any natural ore; player-placed ores never count

# Harpy Ring (accessory, crafted)
harpy-ring:
  speed-bonus: 0.05                    # 1.2.32: was 0.075
  elytra-durability-save-chance: 0.3   # 1.2.32: was 0.5

# Custom fishing loot (only for players who moved/looked around recently).
# The item chances are doubled in rain/thunder and again during Lantern Night.
fishing:
  afk-minutes: 5
  storm-luck-multiplier: 2.0
  ankh-shield-chance: 0.001
  mythic-goodie-bag-chance: 0.025
  goodie-bag-chance: 0.075
  potion-chance: 0.05        # Darkness or Cloud Potion
  mob-chance: 0.05           # not affected by luck
  dangerous-mob-share: 0.1   # of mob catches: Wither/Warden/10 Vexes/Charged Creeper/3 Vindicators

# Lantern Night (FaultlineEvents) bonuses applied by this plugin
lantern-night:
  drop-multiplier: 2.0
  villager-discount-percent: 10

# Vampire (custom mob) — hides among cave bats, turns into a vampire when close.
vampire:
  bat-chance: 0.025          # share of naturally spawning bats that are secretly vampires
  max-alive: 15              # lag safety: most vampires on the server at once
  notice-range: 16           # how close a player has to get before the bat hunts them
  transform-range: 2.5       # bat turns into a vampire this close to you
  flee-range: 12             # vampire turns back into a bat if you get this far away
  bat-speed: 0.5
  health: 30                 # shared between bat and vampire form (1.2.17 nerf: was 40)
  hit-damage: 5              # per claw hit (no weapon) (was 9)
  speed: 0.28
  bleed-seconds: 3
  bleed-damage: 0.5          # per second (1.0 = half a heart) (was 1.0)
  xp: 30
  gunpowder-chance: 0.5      # 3-6 gunpowder
  diamond-chance: 0.05       # 2-6 diamonds
  accessory-chance: 0.025    # a Moon Stone or a Spelunker's Amulet (50/50)
  # During a Blood Moon (FaultlineEvents), Vampires also hunt on the surface.
  blood-moon:
    enabled: true
    spawn-interval-seconds: 45   # each player can get a new Vampire this often (was 20)
    per-player: 1                # at most this many Vampires within 48 blocks of a player (was 2)
    max-alive: 12                # server-wide cap during a Blood Moon (was 25)
  # Face texture (the hash at the end of a textures.minecraft.net URL, e.g.
  # from minecraft-heads.com). Default: "Dracula".
  head-texture: "14d412d8a6b96cd7aaa8322ef75ff5f44c7888cf32240ad8c923a58cea7407a6"

# Frost Wraith (custom mob) — only spawns during a Snowy Day (FaultlineEvents),
# outside Deserts and Badlands.
frost-wraith:
  skeleton-to-stray-chance: 0.5   # during a Snowy Day, this share of Skeleton spawns become Strays
  stray-to-wraith-chance: 0.08    # share of those Strays that are Frost Wraiths
  max-alive: 10
  health: 30
  slow-seconds: 3                 # its arrows: Slowness II + freezing for this long
  xp: 15
  bow-or-book-chance: 0.30        # a plain Bow or a Power I book (50/50)
  frost-flare-chance: 0.025

# Snowy Day surface spawns. Hostile mobs normally can't spawn in daylight, so
# during a Snowy Day this spawns Strays and Zombies on the surface near players
# (where snow falls). They don't burn in the sun. Strays can become Frost Wraiths.
snowy-day-mobs:
  spawn-interval-seconds: 5   # each player gets a spawn attempt this often
  per-player-cap: 8           # max of these mobs within 48 blocks of a player
  server-cap: 60
  min-distance: 16
  max-distance: 32
  stray-share: 0.5            # the rest are Zombies

# Spider Staff — summons spiders that fight for you (same rules as Necromancer minions).
spider-staff:
  min-minions: 3
  max-minions: 5
  cave-spider-share: 0.35      # the rest are regular Spiders
  minion-lifetime-seconds: 30
  cooldown-seconds: 60
  spider-drop-chance: 0.0001   # 0.01% from regular spiders (not spawner spiders)

# Queen Spider — cave boss. (This section replaces the old "queen-spider" one;
# a leftover old section on your server is simply ignored.)
# 1.3.44 THE QUEEN SPIDER OVERHAUL: her own jointed model (QueenRig), 3 phases (60% / 30%), new moves (bite, pounce, leg sweep,
# venom spit, web shot, brood, silk pull, stomp, egg sacs, ceiling drop, venom rain), the Demon Eye's music. An old config's
# 0.01 spawn-chance / 500 health / 0.10 staff chance read as the new values.
queen-spider-boss:
  spawn-chance: 0.0025         # of spiders spawning underground (no sky above): 4x rarer than before
  brood-eye-chance: 0.025      # 1.3.47: the Broodmother's Eye (spider form); the nest queen: nest.brood-eye-chance, each fighter
  max-alive: 2
  min-rock-above: 10           # 2.0: a wild queen only spawns this many blocks under the top of her column (no surface spawns)
  surface-seconds: 20          # 2.0: a wild queen out under the open sky with nobody within surface-leash burrows away after this
  surface-leash: 20
  scale: 3.0
  health: 900
  armor: 6
  bite-damage: 13
  sweep-damage: 8
  pounce-damage: 10
  stomp-damage: 11
  stomp-radius: 7
  drop-damage: 14
  rain-damage: 6
  spit-damage: 4
  poison-seconds: 6
  web-seconds: 5
  max-brood: 12
  egg-sacs: 3
  egg-sac-hatch-seconds: 6
  phase2-at: 0.6
  phase3-at: 0.3
  music: true                  # the Demon Eye's music (faultline:demon_eye.music) while she's awake
  music-seconds: 316.4
  xp: 400
  diamond-chance: 0.5          # 5-10 diamonds
  spider-staff-chance: 1.0     # always
  ankh-chance: 0.02
  creative-wakes: true         # a creative player's hit wakes a nest queen too
  # the QUEEN OF THE NEST (asleep in a Spider Nest): much harder, much better loot (every fighter gets it)
  abyssal:                     # 1.3.57: a Spider Nest built in the Dark Ocean (spider-nest.abyss-world) = THE ABYSSAL QUEEN
    scale: 4.8
    health: 3000               # +per-fighter like the nest queen
    damage-multiplier: 1.1
    dark-loot-bags: 2          # every fighter, on top of the nest rewards
  damage-nerf: 0.8             # 1.3.57: every queen move's damage x this while its value is still a default
  nest:
    scale: 4.2
    health: 2600               # 1.3.57: was 3600 (an old 3600 reads as 2600)
    per-fighter: 0.2           # +20% health for every fighter after the first (counted when she wakes; was 0.3)
    armor: 12
    bite-damage: 16
    sweep-damage: 10
    pounce-damage: 12
    stomp-damage: 13
    drop-damage: 16
    rain-damage: 7
    spit-damage: 5
    xp: 1500
    spider-staff-chance: 1.0
    ankh-chance: 0.02
    queen-silk-chance: 0.20
    rewards:                   # "item MATERIAL n", or a console command ({player}, {enchant} = a random boss enchant)
      - item DIAMOND 14
      - item NETHERITE_SCRAP 3
      - item SPIDER_EYE 16
      - item EXPERIENCE_BOTTLE 24
      - givegoodiebag 2 {player}
      - givemythicbag 1 {player}
      - fenchant give {enchant} 1 1 {player}

# 1.3.44 SPIDER NESTS (/adminmenu cobweb, /queenspider nest): a web cave network carved under an admin, the Queen asleep in it.
spider-nest:
  min-y: -50                   # 1.3.47: the whole nest is carved between these heights (a spiral ramp leads down)
  max-y: -1
  abyss-world: faultline_deep  # 1.3.57: a nest built here is an ABYSSAL nest (the Abyssal Queen; doors where its tunnels meet the sea)
  darkness: true               # hidden Darkness inside: it's dark down there
  see-in-the-dark: true        # 1.3.52: a hidden Night Vision under the Darkness, so the nest pulses dark but never goes pitch black
  spawn-chance: 0.18           # every 2 s per player inside: a spider, cave spider, zombie, skeleton or brood comes out of the dark
  mob-cap: 9
  brood-cap: 6
  spawner-cap: 2               # 1.3.50: a nest spawner only spawns while fewer than this many monsters are within 16 of it
  web-item-chance: 0.035       # loot webs with an item you can SEE caught in them
  den-trigger-radius: 7        # brood dens (trial-chamber waves) wake when someone comes this close
  den-cooldown-minutes: 30
  bed-respawn-minutes: 10      # sleeping brood on the sleeping dens' silk beds
  quake-min-minutes: 3         # the nest shakes (dripstone falls) every 3-6 min with someone inside
  quake-max-minutes: 6
  quake-drips: 5
  music-seconds: 101           # faultline:nest.music (in FaultlineDeepMusic.zip)
  blocks-per-tick: 20000
  respawn-minutes: 120         # the Queen comes back asleep this long after she dies
  web-loot-chance: 0.18        # the nest's own cobwebs: a loot roll this often when broken
  spider-spawn-chance: 0.12    # extra spiders round a player inside, every 2 s
  spider-cap: 6

# Boss-only loot.
boss-loot:
  grappling-hook-chance: 0.10      # from Captain Rotbeard (the Zombie Raid boss)
  grapple-cooldown-seconds: 1.5
  grapple-max-speed: 2.6
  queen-silk-chance: 0.05          # from the Queen Spider
  silk-cooldown-seconds: 8
  silk-web-seconds: 3              # how long its webs (and the Slowness) last

# Cleft Horn (accessory) — armor penetration
cleft-horn:
  armor-penetration: 0.005   # your hits ignore this much of the target's armor protection (0.5%; an old 0.05 or 0.015 reads as 0.005)
  goat-drop-chance: 0.02

# A Weird Clock... (accessory) — immune to Slowness
weird-clock:
  cave-drop-chance: 0.01     # hostile mobs killed in caves
  max-y: 50                  # "in caves" = no open sky above AND below this height (keeps dark mob farms out)

# Hermes / Rocket / Spectre Boots (real boots-slot armor, unbreakable)
boots:
  hermes-drop-chance: 0.005  # from any vanilla mob (not spawners/spawn eggs/plugin mobs)
  rocket-drop-chance: 0.005
  hermes-trade-emeralds: 45  # Armorer trade: this + 1 Green Dye
  rocket-trade-emeralds: 60  # Armorer trade: this + 1 Harpy Ring
  rocket-charges: 7          # flight "charges" per jump (like Terraria)
  rocket-charge-ticks: 3     # length of each charge (20 ticks = 1 second; 0.17s is about 3)
  rocket-lift: 0.42          # upward push while a charge burns
  spectre-anvil-levels: 10   # XP levels to combine Hermes + Rocket into Spectre Boots

# The server's resource pack (every custom item, boss, and the Index): FaultlineSMP.zip on GitHub (main).
# Keep this ENABLED. If the pack changes, put its new SHA-1 in hash (sha1sum FaultlineSMP.zip).
# The Wardrobe (/accessories): its custom background comes from the pack (font faultline:gui). false = plain chest look.
wardrobe:
  custom-background: true

item-textures:
  enabled: true
  url: "https://raw.githubusercontent.com/faultlinesmp123-sys/Faultline-SMP/main/FaultlineSMP.zip"
  hash: "93d2e198227ab773de183982c40a2c3f043b46eb"
  # The Dark Ocean's music, a second pack sent beside the main one (empty url = not sent)
  music-url: "https://raw.githubusercontent.com/faultlinesmp123-sys/Faultline-SMP/main/FaultlineDeepMusic.zip"
  music-hash: "6e5d5bfdb42da505a462cb4c78d068f37069b25b"
  # 1.2.72: the bendy emote body (core shader + body part models), only sent to 26.2 games (emotes.rig-protocols)
  emotes-url: "https://raw.githubusercontent.com/faultlinesmp123-sys/Faultline-SMP/main/FaultlineEmotes.zip"
  emotes-hash: ""             # empty = worked out from the file (auto-hash)
  # 1.2.50: the plugin downloads each pack itself and sends the hash the file REALLY has (a stale hash above made
  # players' games reject the pack). It re-checks every few minutes (cheap: only downloads again if the file changed).
  auto-hash: true
  auto-hash-minutes: 10


# Immunity charms: one accessory per debuff (Guardian Scale, Ginger Root, Blindfold, Salt Ration,
# Vitamins, Soul Ward, Gravity Stone, Four-Leaf Clover, Night Lens, Wind Ward, Silk Ward, Slime Ward,
# Pest Charm). Each drops from the mob that causes its debuff. Override a drop chance like:
#   immunity-charms:
#     guardianscale-chance-guardian: 0.03
#     nightlens-chance-warden: 0.5

# The Ankh Shield only works on a shield: put a Shield (or the Shield of the Demon Eye) and the
# Ankh Shield in an anvil. While holding the imbued shield:
ankh-shield:
  anvil-levels: 15
  debuff-immunity: true       # immune to every debuff (Poison, Wither, Slowness, Blindness, ...)
  no-knockback: false         # true = also no knockback
  old-effects: false          # true = all the old powers: no knockback, no fire/freezing, and the ones below
  damage-resistance: 0.05     # 5% less damage taken
  speed-bonus: 0.15           # +15% speed
  melee-damage-bonus: 0.025   # +2.5% melee damage

# Dark Loot (1.2.41): the Dark Ocean's treasure (FaultlineDeep). Unplaced chests in that world roll it on first open;
# the Dark Loot Bag rolls it too. rare-chance = the 0.1% shot at the Abyssal Diving Suit, an Elytra, a shulker of Totems,
# a shulker of Invisibility potions, or a God Set.
dark-loot:
  world: faultline_deep
  rare-chance: 0.001
  accessory-chance: 0.35
  netherite-chance: 0.4
  netherite-max: 2
  book-chance: 0.6
  boss-book-chance: 0.12
  never-accessories: []        # accessory names (as in /giveaccessory) that never come out of Dark Loot

# (1.2.68: meteors were removed; a server config's old meteor: section is ignored.)

# ---------------- The Caravan (a traveling merchant) ----------------
# Every 8 hours he sets up camp 40-100 blocks from a random survival player for 20 minutes (everyone is told where), and
# sells things for diamonds, emeralds and netherite. stock lines: id:emeralds:diamonds:netherite:weight:uses
# (a trade takes at most two of the three; uses are shared by the whole server). /caravan now | here | stop | reroll
# 1.3.29: nerfed hard (was every 3 h for 1 h, 8 offers, cheap, elytra / Ankh / Cross / nether stars).
caravan:
  enabled: true
  first-minutes: 120
  every-minutes: 480
  stay-minutes: 20
  min-distance: 40
  max-distance: 100
  offers: 4
  trades-per-player: 1               # trades each player may make per visit (0 = no limit)

# ---------------- The Skeleton Wanderer (a cave trader who sells accessories) ----------------
cave-trader:
  enabled: true
  chance: 0.05              # every check, each player underground has this chance of him showing up nearby
  check-seconds: 120
  below-y: 50               # "underground" = below this height with no sky above
  max-traders: 3            # on the whole server at once
  lifetime-minutes: 8       # then he packs up and wanders off
  offers: 5                 # how many different wares he has
  scale: 1.0
  # id:emeralds:diamonds:weight (higher weight = shows up more often)
  stock:
    - "guardian_scale:14:0:5"
    - "ginger_root:12:0:5"
    - "blindfold:14:0:5"
    - "salt_ration:12:0:5"
    - "vitamins:14:0:5"
    - "soul_ward:18:0:4"
    - "gravity_stone:16:0:4"
    - "four_leaf_clover:14:0:5"
    - "night_lens:20:0:3"
    - "wind_ward:16:0:4"
    - "silk_ward:12:0:5"
    - "slime_ward:12:0:5"
    - "pest_charm:12:0:5"
    - "golden_ring:24:0:3"
    - "climbing_claws:28:0:3"
    - "bezoar:24:0:3"
    - "discount_card:32:0:2"
    - "life_jelly:30:0:2"
    - "shield_of_the_ocean:36:2:2"
    - "lava_charm:30:0:3"
    - "black_belt:28:0:3"
    - "spelunker_amulet:24:0:4"
    - "harpy_ring:30:0:3"
    - "ranger_emblem:34:1:2"
    - "diving_helmet:22:0:5"
    - "flipper:22:0:5"
    - "depths_charm:40:4:1"
    - "kraken_worm:16:0:3"

# ---------------- Diving gear (after Calamity's) ----------------
# Dive helmets (1.2.57): worn helmets with an oxygen tank (seconds of breath underwater), refilled at the surface or fast
# in a bubble column / with Conduit Power. The Hadal one + the Abyssal Diving Suit keeps FaultlineDeep's Trench pressure out.
dive-helmets:
  tank-seconds:
    copper: 120
    reinforced: 300
    hadal: 600
  bubble-refill-per-second: 10

diving:
  drops:
    helmet-from-drowned: 0.015
    flipper-from-guardians: 0.02
    depths-charm-from-elder-guardians: 0.33
  crush-depth:              # deep underwater AND out of breath hurts (for a future underwater boss)
    enabled: true
    below-y: 0
    damage: 2.0             # per second (halved by the Depths Charm or Abyssal Diving Gear)
  suit:                     # the Abyssal Diving Suit stops working when a PLAYER hits you
    combat-seconds: 10      # ...for this long
    off-when-mobs-hit: false   # true = monsters' hits switch it off too
    off-when-attacking: false  # true = hitting a player yourself switches it off too
    # 1.2.53: a CHESTPLATE only (never an accessory), and weaker
    armor: 6                   # armor points as a chestplate (an iron chestplate's)
    plates: 2                  # was 3
    plate-absorb: 0.10         # each plate takes 10% off one hit underwater (was 15%)
    plate-regrow-seconds: 30   # was 20

# ---------------- The Kraken's items ----------------
kraken-gear:
  worm-from-dirt: 0.005       # chance per dirt/grass/coarse dirt/rooted dirt/mud/podzol block you dig
  drops:
    coral-lung-from-pufferfish: 0.03
    glow-gland-from-glow-squid: 0.04
    eelskin-wrap-from-drowned: 0.02

# ---------------- Weather events (Weather.java) ----------------
# SANDSTORM in deserts (dust, husks, buried treasure), ECLIPSE at midday (5 min night, neutral mobs turn hostile).
# /fweather <kind> | stop | status (1.2.67: the Aurora and the Locust Swarm were removed; 2.0: the Blizzard too.)
weather:
  enabled: true
  announcements: false     # 1.3.17: true = chat lines + titles when a sandstorm / eclipse starts and ends
  boss-bar: false          # 1.3.17: true = the Eclipse boss bar
  sandstorm: {enabled: true, chance-per-minute: 0.006, minutes: 6, radius: 110, husks-per-player: 4, treasure-chance: 0.04, treasure-per-player: 3,
              treasure: ["GOLD_INGOT:2-6", "EMERALD:1-4", "DIAMOND:1-2:25", "GOLDEN_APPLE:1:15", "RABBIT_FOOT:1:30"]}
  eclipse: {enabled: true, chance-per-minute: 0.003, minutes: 5, sun-height: 55, sun-size: 1.0}   # only each player's sky goes dark: the world's time keeps running

# ---------------- Creatures (Creatures.java) ----------------
mimic: {enabled: true, chance: 0.01, farlands-chance: 0.12, health: 60, damage: 8, speed: 0.32, xp: 40}
skeleton-knights: {enabled: true, check-seconds: 300, chance: 0.12, health: 32, captain-health: 50, helm-chance: 0.06}

# ---------------- Gear (Gear.java): mining helmet headlamp ----------------
gear: {headlamp-reach: 12, light-level: 13}


# ---------------- Maces (1.2.15) ----------------
# mode: remove   = maces are gone: every mace anywhere is deleted (players' inventories and ender chests, bundles and
#                  shulker boxes, every container as its chunk loads, items on the ground, frames, armor stands, mobs,
#                  animal/minecart/boat chests, loot, drops) and they can't be crafted. Each removal is logged.
#       restrict = maces can't be crafted and only live in a player's own inventory (never a chest, bundle, frame...)
#       off      = vanilla
# faultline.mace.bypass (default false) skips it for that player.
mace:
  enabled: true
  mode: "restrict"             # 2.0: maces only ever live in their owner's inventory (an old "off" reads as restrict unless really-off: true)
  block-crafting: false        # crafting is allowed; mace-limit caps how many exist
  inventory-only: true         # no chests, ender chests, shulkers, bundles, hoppers, frames, stands, allays...
  drop-locked: false           # true = maces can't be thrown out with Q (the old no-dropping key is ignored)

# ---------------- Mace limit (2.0) ----------------
# Only this many maces can ever be crafted on the server. A mace that's destroyed (lava, fire, cactus, the void,
# despawning) frees its place. /macelimit (op) lists them; /macelimit free <id> frees one by hand.
mace-limit:
  enabled: true
  max: 5
  announce:                    # when someone forges a mace, everyone gets:
    chat: true                 #   a chat line
    title: true                #   a title on screen
    sound: true                #   an anvil + mace slam sound

# ---------------- Mace enchantments (1.2.55) ----------------
# A mace can only carry these (anything else is stripped; levels are capped): enchanting table, anvil, books, loot,
# and maces players already have (checked in inventories every 2 s). Enchanted books of Wind Burst are capped too.
mace-enchants:
  enabled: true
  allowed: {unbreaking: 3, wind_burst: 3, mending: 1, density: 4, fire_aspect: 2}

# ---------------- Spawn protection (1.2.17) ----------------
# After respawning, players can't hurt you for this long. Attacking a player ends it early.
spawn-protection:
  enabled: true
  seconds: 30
  block-mobs: false            # true = monsters can't hurt or target you either
  ends-on-any-attack: false    # true = hitting any creature (not only a player) ends it

# Boss enchant books (1.2.17): bosses drop books of enchantments vanilla doesn't have; item left, book right in an
# anvil. Two books of the same level make the next. /fenchant list, /fenchant give <id> [level] [amount] [player].
enchants:
  boss-drops-enabled: true
  anvil-levels-per-level: 6
  # 1.2.92: how many DIFFERENT boss enchants one item can hold (0 = no limit). Weapons = swords, axes, tridents, bows,
  # pickaxes. Gear over the cap is trimmed (highest levels kept) and the owner gets a Dark Loot Bag per enchant removed.
  max-per-weapon: 2
  max-per-armor: 1
  enforce-caps: true
  # 1.3.6: EVERY boss enchant nerfed again (a server config still holding any older default reads as the new value)
  lifesteal: {per-level: 0.02, max-per-hit: 1, cooldown-ms: 1000, pvp-every-hits: 8}   # 2% / 4% of the hit, max half a heart, once a second; on players every 8th hit
  executioner: {below: 0.25, bonus-per-level: 0.05}      # +5% / +10% damage to anything under 25% health
  cleave: {share-per-level: 0.10, radius: 2.5}           # charged swings: 10% / 20% of the hit to everything beside the target
  bleed: {chance-per-level: 0.05, seconds: 1, damage: 1} # 5% / 10%: bleeds 1 a second for 2 / 3 s
  arrowguard: {reduction-per-level: 0.05}                # chestplates: -5% / -10% projectile damage
  thornhide: {reflect-per-level: 0.04}                   # leggings: 4% / 8% of a melee hit back at the attacker
  swiftstride: {speed-per-level: 0.02}                   # boots: +2% / +4% speed
  frostbite: {chance-per-level: 0.04, cooldown-seconds: 8}   # 4% / 8%: Slowness I for 1.5 / 2 s, once every 8 s per target
  venom: {chance-per-level: 0.06}                        # 6% / 12%: Poison for 3 s
  thunderstrike: {chance: 0.04, damage: 3, cooldown-seconds: 15}
  vitality: {max-regeneration-level: 1, level1-below: 0.35, level2-below: 0.6}   # Regeneration I, only below 35% (I) / 60% (II) health
  featherstep: {fall-reduction: 0.2}
  tidecaller: {pvp-off-seconds: 10}                      # no Dolphin's Grace for 10 s after a player fight
  autosmelt: {chance: 0.5}                               # half the raw ore stacks come out as ingots
  clearsight: {chance: 0.5}                              # blocks Blindness / Darkness half the time
  veinminer: {max-blocks: 12, exclude: []}  # Vein Miner (pickaxes): sneak + mine an ore; exclude e.g. [ANCIENT_DEBRIS]
  # 1.2.65: which boss drops which book is in the code (only the bosses that are left: Jacob, the raid / pirate bosses,
  # the Abyssal Kraken and the Dark Ocean's bosses). The old boss-drops / new-boss-drops lists are NOT read any more.
  # To change one boss: drops: {<Index boss entry id>: ["enchant:level:chance", ...]} (each rolled on every defeat, per fighter)

# Elytra races (1.2.17): admins build a course (/race create, /race cp add) and host it (/race host <course> [lend]).
race:
  default-radius: 6
  countdown-seconds: 5
  max-minutes: 10
  lend-by-default: false      # /race host <course> lend gives everyone an elytra + rockets for the race
  lend-rockets: 16
  boat-type: OAK_BOAT         # boat races: everyone gets one of these
  horse-speed: 0.3            # horse races: everyone gets the same horse (vanilla horses are 0.1125-0.3375)
  horse-jump: 0.75
  rewards:                    # console commands, {player} = the racer
    first: ["givemythicbag 2 {player}"]
    second: ["givemythicbag 1 {player}"]
    third: ["givegoodiebag 2 {player}"]
    finish: []

# /sit (1.2.18): right-click a stair or a bottom slab with an empty hand, or /sit where you stand.
sit:
  enabled: true
  click-stairs: true

# Staff vanish (1.2.18): /vanish. Fake leave/join messages for the players who can't see you.
vanish:
  fake-messages: true
  pickup: false               # vanished staff pick up items

# Hot air balloons (1.2.24): craft (5 wool around a campfire, string, barrel, string), set up, fly. Fuel: coal/charcoal 60 s,
# blaze rod 150 s, coal block 600 s, burned while in the air.
# PvP limits (1.2.37). Creative / spectator players are never limited.
glide-guard:                       # 1.3.40: ends any glide with no elytra on (the swap-a-chestplate-and-relog flight glitch)
  enabled: true
legendary:                         # 1.3.38: Stormbreaker, Void Piercer, Infernal Reaper. Each recipe can be crafted ONCE (admins only)
  enabled: true
  stormbreaker: {cooldown-seconds: 30, launch: 1.5, radius: 4, damage-1: 4, damage-2: 2, damage-far: 1, throw: 0.95, hop: 0.42}
  void-piercer: {cooldown-seconds: 35, distance: 12, blast-radius: 3.5, blast-damage: 3, speed-seconds: 10}
  infernal-reaper: {cooldown-seconds: 25, burn-seconds: 12, burn-damage: 1, spike-radius: 6, spike-damage: 4, freeze-chance: 0.25, freeze-seconds: 1}
toilet-raid:                       # 1.3.38: admin only (/toiletraid start, Golden Plunger). Waves of toilets, then the Porcelain Colossus
  waves: 10
  base-count: 6
  per-wave: 3
  per-fighter: 0.4
  max-per-wave: 45
  health-multiplier: 1.0
  damage-multiplier: 1.0
  head-skin: ""                    # a username for the toilets' heads ("" = random online players)
  moves: {sludge: 6, bomb: 15}
  boss:
    scale: 4
    health: 12000
    per-fighter: 0.4
    damage-reduction: 0.25
    melee: 22
    xp: 9000
    grief: true                    # it breaks builds (never containers / block entities / bedrock / obsidian)
    restore-after-fight: false     # true = put every broken block back 10 s after it dies (/toiletraid restore does it by hand)
    moves: {slam: 20, flush: 18, laser: 5, charge: 24, sludge: 9}
  # rewards: ["givemythicbag 4 {player}", "item NETHERITE_INGOT 4", ...]   ("item MATERIAL n" or a console command; {player}, {enchant})
# ---------------- 2.0 round 10: THE FARLANDS (Farlands.java, FarlandsNight.java) ----------------
farlands:
  enabled: true
  mob-health: 0.25        # every monster out there: +25% health
  mob-damage: 0.25        # and +25% damage (FaultlineRaids makes every one of them an Elite or a Mutant)
  crawlers: {spider-share: 0.3, pack-chance: 0.3, max-near: 4, health: 34, damage: 6, drop-damage: 9}
  ghasts: {chance: 0.25, max: 2}
  mimics: {enabled: true, chance: 0.005, cooldown-minutes: 45, max: 2, delay-seconds: 60, hush-radius: 96}   # RARE: every monster vanishes, a minute of silence, then "<name> joined the game" and an offline player's mimic comes for you; /farlands mimic [now]
  echoes: {enabled: true, share: 0.35, expire-days: 3, health: 80, damage: 9, xp: 120}
  trader: {chance-per-minute: 0.04, minutes: 15}
  music: true             # "Underground Crimson" (FaultlineDeepMusic.zip), looped for everyone in the Farlands
  music-seconds: 161.5
  always-night: true           # every player out there sees a night sky (their own clock; the server time is untouched)
  always-rain: true            # and rain
  spooky: true                 # far-off creepy sounds, ash in the air, silent lightning
  spooky-lightning-chance: 0.2
farlands-night:               # 2.0 (FarlandsNight.java): the Warden of the Rim is gone
  blood-rain: {enabled: true, check-minutes: 5, chance: 0.08, minutes: 8, mob-health: 0.5, mob-damage: 0.3}   # a Rim Sigil starts one too
  collapse: {enabled: true, chance: 0.04, cooldown-seconds: 20, delay-ticks: 40, max-blocks: 40}
  watchers: {enabled: true, every-seconds: 30, chance: 0.35, seconds: 60, vanish-distance: 24, stare-degrees: 7, return-chance: 0.15}
chrome-runner:                     # 1.3.38: admin only (/chromerunner summon, Overclocked Chip)
  health: 7000
  per-fighter: 0.35
  damage-reduction: 0.2
  dodge-chance: 0.15
  melee: 15
  xp: 7000
  spine-chance: 0.25               # the top damager always gets a Chrono Spine; everyone else this chance
  head-skin: ""                    # a username whose head he wears ("" = a random online player)
  moves: {overclock: 7, punch: 16, wire: 12, wire-length: 14, shot: 5, missile: 9}
  spine: {seconds: 6, cooldown-seconds: 90, radius: 16}
abilities:                         # 1.3.33: personal abilities. Admins: /adminmenu. Right-clicking the item = yours forever
  enabled: true
  frost:                           # Star
    chance: 0.5                    # per hit (melee or arrow)
    seconds: 3
    slowness-level: 2
    cooldown-seconds: 1.5          # per victim
  aim:                             # Lucian
    cone-degrees: 14               # how close to your aim a target must be to lock on
    range: 64
    turn: 0.35                     # how hard arrows curve each tick (0.05-1)
    bounces: 2                     # wall bounces per arrow
    bounce-range: 32
  speed:                           # Voise
    multiplier: 1.2                # 1.3.34: was 2.0
  hops:                            # Zombie
    jump-bonus: 0.42               # +42% jump strength (~2.2 blocks high instead of 1.25; 1.3.35, was 0.35)
    safe-fall-bonus: 0.5
  shade:                           # Sin
    strength-level: 2
    swiftness-level: 2
    invis-return-seconds: 300      # invisibility comes back this long after a totem pop (0 = only after respawning)
ghost-fix:                         # 1.3.30: after every right-click on a block (and a cancelled place / break) the real blocks are
  enabled: true                    #   re-sent to that player, so trapdoors / doors / shelves / placed blocks never stay ghosts
  delay-ticks: 2
  command-radius: 6                # /ghost re-sends everything this close to you
nest-guard:                        # 1.3.28: no shulker boxes inside shulker boxes (or bundles). Nested ones are taken out and given back
  enabled: true
  sweep-seconds: 5                 # players' inventories + ender chests are checked this often (also on join, pickup, opening anything)
pvp-limits:
  lunge-cooldown-seconds: 5        # spear Lunge: once every 5 s (on cooldown the jab still hits, without the lunge). 0 = off
  cobweb-place-cooldown-ms: 250    # one cobweb every 0.25 s per player. 0 = off
  ender-pearl-cooldown-seconds: 5  # one ender pearl every 5 s per player (survival/adventure; was 7 until 1.3.16). 0 = the game's own 1 s

# 1.2.69: a totem popped by ANOTHER PLAYER counts (1/4, 2/4...). After `max` of them, the next totem doesn't save you from a
# player ("4/4 Totems has been popped, this totem wont work"); it still works against mobs, falls, lava... The count goes
# back to 0 when you die (reset-on-death). Admins: /totems <player> | set <player> <n> | reset <player|all> | limit <n|off>
# 2.0: Nether / End lock (/dimlock <nether|end|all> <on|off>): portals still build and light, but nobody goes through
# into a locked one (players, mobs, items). Going back out always works; /tp isn't touched.
dimension-lock:
  enabled: true
  nether: true
  end: true
totem-limit:
  enabled: true
  max: 4
  reset-on-death: true
  reset-after-minutes: 10   # 1.3.7: no player hits you for this long = back to 0/4 (0 = never)

balloon:
  speed: 0.35              # blocks a tick (sprint = x1.6)
  climb-speed: 0.22        # rising / sinking with Jump / Sneak
  sink-speed: 0.06         # sinking with no fuel
  max-fuel-seconds: 1800
  # 1.2.36: hit a landed balloon (any item; an axe counts double) this many times within 3 s of each other to take it down.
  # It drops as its item (colour and fuel kept). /balloon list, /balloon remove [#n | all [player]].
  hits-to-break: 4
  break-reach: 5
  anyone-can-break: false   # false = only its owner and admins (items.balloon.admin)

# /ping and /coords (1.2.24): Bedrock has no F3 screen. true = Bedrock players see the coordinates bar from their first join.
where:
  bedrock-coords-on-join: false

# Camera mode (1.2.23): /camera = a free camera for recording (spectator, back where you were with /camera again).
camera:
  enabled: true               # false = only faultline.camera.unlimited (ops) can use it
  max-distance: 64            # how far from where you started the camera can fly (0 = no limit)
  combat-seconds: 10          # can't start it this soon after hitting / being hit
  combat-includes-mobs: true  # ...by monsters too, not just players
  no-clip: false              # 1.2.25: false = the camera can't fly inside solid blocks (from inside the ground you see every cave and base: x-ray)

# Emotes (1.2.70): /emote. A mannequin wearing your skin does the moves; Java players watch from a cinematic camera.
emotes:
  enabled: true
  cooldown-seconds: 2
  max-seconds: 0              # 0 = every emote loops until you stop it (sneak, /emote stop); else a limit
  duo-range: 6                # how close you must be to join a duo emote
  duo-wait-seconds: 20        # how long a duo emote waits for someone
  disabled: []                # emote ids to turn off: griddy, aura, sturdy, birdbrain, dap, hug
  bendy-body: false           # 1.2.72's shader body (FaultlineEmotes.zip); off since 1.2.74 (it drew as loose cubes in game). Everyone sees the mannequin, armour and all
  rig-protocols: [776]        # client protocols the shader was made for (776 = 26.2); other versions see the mannequin

# Fishing (1.2.18): every fish has a weight; all-time records per species; tournaments (/fishing start [minutes]).
fishing:
  enabled: true
  minutes: 15
  auto-every-hours: 0         # 0 = only when an admin starts one
  auto-min-players: 2
  monster-chance: 0.01        # a 1.5x fish
  tag-fish-in-tournament: true   # tournament fish show their weight (they won't stack)
  announce-first-records: false  # the very first fish of a species is a "record" too: announce it?
  hadal:                      # the Dark Ocean's own fish (FaultlineDeep says which waters the hook is in)
    enabled: true             # the Dark Ocean's own fish (1.2.62: their models are in the pack)
    chance: 0.7               # a fish caught there is one of its own species (always over the Trench)
    blind-king-chance: 0.005  # the Trench's legend: 1 Trench catch in 200
  rewards:
    first: ["givemythicbag 2 {player}"]
    second: ["givemythicbag 1 {player}"]
    third: ["givegoodiebag 2 {player}"]

# Crop seasons (1.2.26): real-world months each crop is in season (the server's time zone). In season: grows faster and
# ripe harvests sometimes give one more; out of season: grows slower. /crops shows the calendar. Nether Wart: no seasons.
crop-seasons:
  enabled: true
  zone: "America/New_York"
  in-season-boost: 0.35      # chance a growth step gives an extra stage
  harvest-bonus: 0.25        # chance a ripe in-season harvest drops one more
  off-season-skip: 0.25      # chance an out-of-season growth step doesn't happen
  months:                    # 1 = January ... 12 = December
    wheat: [6, 7, 8, 9]
    carrots: [3, 4, 5, 9, 10]
    potatoes: [3, 4, 5, 10, 11]
    beetroots: [9, 10, 11, 12]
    pumpkins: [8, 9, 10]
    melons: [6, 7, 8]
    berries: [7, 8, 9, 12]
    sugar_cane: [4, 5, 6, 7]
    cocoa: [1, 2, 6, 7]
    cactus: [6, 7, 8]
    bamboo: [3, 4, 5, 6]
    flowers: [4, 5, 6]

# Mount stats (1.2.26): right-click a horse / donkey / mule / llama / camel with a plain stick.
mount-stats:
  enabled: true

# Death coordinates (1.2.26): on respawn only you are told where you died; /lastdeath any time.
death-coords:
  enabled: true

# Ranger gear (1.2.27): 8 bow accessories (see the Index). Drops only from mobs a player killed (no spawners).
ranger-gear:
  quickdraw-drop-chance: 0.01        # Skeletons, Strays, Bogged
  quickdraw-full-at: 0.75            # a draw this full shoots like a full one
  windrunner-drop-chance: 0.03       # Breezes
  windrunner-speed: 1.08     # 1.2.31 balance: was 1.2 (arrow damage grows with speed: +20% speed was +20% damage)
  phantom-drop-chance: 0.02          # Phantoms (Phantom Fletching)
  oath-drop-chance: 0.03             # Evokers (Ranger's Oath Pendant)
  oath-health: 2                     # 1.2.39: Ranger's Oath set bonus, +2 MAX_HEALTH (+1 heart)
  oath-speed: 0.1            # 1.2.31 balance: was 0.2 (a whole Speed I)
  oath-arrow-bonus: 0.10             # 1.2.38: Ranger's Oath set bonus, +10% arrow damage
  ricochet-elite-skeleton-chance: 0.015   # ELITE skeletons/strays/bogged only (very rare)
  ricochet-commander-chance: 0.01         # Bone Commanders
  ricochet-speed: 0.75
  pouch-save-chance: 0.3
  monocle-range: 160

# Trinkets (1.2.28): nine more accessories (see the Index).
trinkets:
  fang-heal: 4                       # Bloodthirst Fang: health per kill of a monster or player (4 = 2 hearts; 1.2.31: was 6, any kill)
  fang-cooldown-seconds: 3
  fang-ravager-chance: 0.08
  fang-vindicator-chance: 0.01
  pauldron-knockback-resistance: 0.15
  crest-jacob-chance: 0.4            # Gladiator's Crest: each fighter who beats Diamond Jacob
  crest-radius: 10
  crest-max: 4
  guardian-radius: 8
  guardian-reduction: 0.01           # Guardian's Oath: kingdom-mates near you take 1% less damage
  lantern-radius: 5                  # 1.2.65: was 4
  lantern-seconds: 3
  lantern-cooldown-seconds: 1.5
  thumb-radius: 8
  thumb-boost: 0.2                   # 1.2.65: was 0.15
  treasure-drowned-chance: 0.03
  treasure-range: 40                 # 1.2.65: was 30
  smelter-chance: 0.3                # 1.2.65: was 0.2
  featherfall-blocks: 5

# Diamond Heart (Diamond Jacob drop). 1.2.38: take this fraction less from every kind of damage (replaced +2 hearts).
# 1.2.65: 10% (was 8%): Jacob is the last land boss now, and much harder.
diamond-heart:
  damage-reduction: 0.1

# 1.2.65: the removed land bosses' items (their summons, weapons, drops, discs, the Ancient Core, the Boss Rush Sigil)
# and the boss trophies are taken away wherever they turn up; crafted summons give their materials back. false = off.
old-gear:
  enabled: true

# Event sky packs (1.2.59): while an event is on, everyone in its world (Java) gets its own small pack on top of
# FaultlineSMP.zip, taken off when it ends. Adding/removing a pack shows the loading screen, so pack-shield covers it.
# The Blood Moon pack is sent from here now: keep FaultlineEvents' own moon pack OFF, or players load it twice.
event-packs:
  enabled: true
  blood-moon:                 # FaultlineEvents' BLOOD_MOON: the red moon
    enabled: true
    url: "https://raw.githubusercontent.com/faultlinesmp123-sys/Faultline-SMP/main/FaultlineBloodMoon.zip"
    hash: "2bd923ab60ea489e8cd0b2940799b2e04dfb4ebe"
  eclipse:                    # the Eclipse: a black sun with a burning corona
    enabled: true
    url: "https://raw.githubusercontent.com/faultlinesmp123-sys/Faultline-SMP/main/FaultlineEclipse.zip"
    hash: "90ac668c24a2408a3170e471ef677f8e0ec7048c"

# While ANY resource pack loads for a player (joining, or an event pack going on/off): no mobs spawn near them, mobs
# ignore them, and they can't be hurt. Lasts until the game says the pack loaded, plus grace-seconds.
pack-shield:
  enabled: true
  radius: 96                  # no natural / spawner / patrol spawns this close to a loading player
  grace-seconds: 3            # still protected this long after it loaded
  removal-seconds: 25         # taking a pack off sends no "loaded" answer: protected this long
  max-seconds: 120            # never protected longer than this

# The Blood Moon's red moon drawn with a display instead (1.2.58), used only when event-packs.blood-moon is off.
blood-moon-sky:
  enabled: true
  distance: 60
  size: 1.08

# Blue Obsidian (1.2.75): 8 Obsidian around a Lapis Lazuli. A closed frame of it (any shape) lit with Flint and Steel or a
# Fire Charge opens a portal, ONLY in the End. Through it: the Overworld, a random surface spot within max-xz of 0, 0.
# Nothing is built on the Overworld side (no way back).
blue-obsidian:
  enabled: true
  max-xz: 500                 # x and z each between -500 and 500
  world: ""                   # the Overworld to send people to ("" = the server's main overworld)
  max-portal-cells: 441       # the biggest inside a frame may be (21 x 21)
  min-portal-cells: 2
  travel-ticks: 30            # how long you stand in it before it pulls you through (creative: at once)
  portal-light: 11            # the light the open portal gives off (0-15)

# 1.2.78 BACKPACK: an accessory with 9 extra slots (/backpack, or sneak + right-click the air with an empty hand).
# The contents belong to the player; dying drops them (keepInventory keeps them). Craft: leather, string, a chest.
backpack:
  enabled: true
  drop-on-death: true

# 1.2.78 CREATOR MODE (/creator): hides your /coords X Y Z, death coordinates and shared locations, and blanks
# coordinates and IP addresses in chat you see. The F3 screen can't be hidden per player by a server.
creator-mode:
  enabled: true
  mask-chat: true

# 1.2.78 MIMIC PLAYER (admin only, /mimicplayer [random|<player>|clear|list] [count] [easy|normal|hard|godlike]): an NPC
# with a player's skin, kingdom tag and REAL gear (online = what they have on now; offline = what they had at logout):
# their armour + enchants, best sword/axe, bow, off hand, gaps / god apples / pearls / heal pots / totems, their max health.
# Fights like a PvPer: hit timing, crits, jump crits, W-taps, strafing, shield, axe on your shield, pots, gaps (pearls away
# to eat), pearls, bow. Not saved over restarts. kit = what a player with no snapshot gets.
mimic-player:
  allowed-users: [voisethegoat]   # ONLY these usernames can use /mimicplayer (console too). Empty [] = anyone with items.mimicplayer
  health: 0             # 0 = the player's real max health (20)
  skill: normal         # easy, normal, hard, godlike
  kingdom-tag: true
  reach: 3.0
  damage-multiplier: 1.0
  eat-below: 0.4
  potion-below: 0.45
  kit: diamond          # no snapshot: iron, diamond or netherite
  sharpness: 2
  golden-apples: 4
  healing-potions: 3
  ender-pearls: 8
  xp: 0
  drops: []             # e.g. ["DIAMOND:2"]
  range: 160            # how far off it finds you (it keeps chasing its target out to 1.5x this)
  elytra-pvp: false     # true = with an elytra + rockets in their gear it flies after you, elytra swaps, dives, rockets away
  player-body: true     # 1.2.95: drawn as a real player (real arm swings, sprinting, swimming, elytra glide); false = the old mannequin
  player-body-range: 96 # how far players see that player body
  kit-when-bare: true   # a player with no armour anywhere = it wears the kit's armour
  world-techs: true     # UHC techs that place blocks (lava, webs, water, pillars); everything is put back
  explosives: true      # TNT and fire charges from their inventory (never breaks terrain). No crystal, anchor or cart PvP, ever
  dig: true             # walled off from you: mines through with their pickaxe / axe / shovel
  dig-restore-seconds: 60  # mined blocks come back after this (0 = they stay mined)
  doors: true           # opens wooden doors / trapdoors / fence gates in its way (and looks for one when walled off), shuts them behind it
  arm-animations: true  # draws its M1 / mining swings with arm poses (a mannequin can't play the vanilla swing)
  drop-inventory: true  # killed = drops everything it had left (armour as worn, weapons, unused pots / gaps / pearls...). NOTE: copies a real player's gear
  fake-join: true       # mimicking an OFFLINE player says "<name> joined the game" (and "left the game" / a death line when it goes)
  tab-list: true        # ...and puts them in the tab list while it is out
  path-nodes: 2500      # how hard the walker looks for a way to you (doors, stairs, drops, digging); more = smarter round big builds, a bit more CPU
  path-budget-per-tick: 8000 # all mimics together look at no more than this many path nodes a tick (no lag spikes with lots of them)
  spear-reach: 4.5          # how far a spear jab reaches (the spear reach swap / stun / d-tap use it)
  player-damage: true       # its hits land like a PLAYER's: undoes the game's difficulty scaling of mob damage (x1.5 on Hard)
  elytra-mace: false        # elytra dive bomb: rockets up on an elytra, swaps the chestplate back on and slams down with the mace
  hunt:                     # /mimicplayer hunt <player> [mimic] (any range, any world; through portals players use, the End's stronghold portal)
    keep-pearls: 4          # pearls it never spends travelling (kept for the fight)
    keep-rockets: 2         # rockets it never spends flying there (1.2.93: was 4; an old 4 reads as 2)
    fly-over: 48            # flies its elytra for trips longer than this (rockets to spare, or a wind charge to launch and glide; 1.2.93: was 150)
    nether-over: 500        # a longer Overworld trip goes through the Nether when recorded portals make that 30%+ shorter
    load-radius: 3          # chunks kept loaded round a hunting mimic (3 = 7x7), so it keeps moving with nobody near
  combat-tag:           # it hitting you / you hitting it = in combat. With PvPManager installed its own tag is used (its duration, blocked commands, combat-log punishment)
    enabled: true
    use-pvpmanager: true
    seconds: 120        # the built-in tag (no PvPManager); PvPManager's own length is Combat Tag.Time in ITS config
    max-teleport: 16    # built-in: command / plugin teleports further than this are cancelled while tagged (ender pearls still work)
    blocked-commands: [tpa, tpahere, tpaccept, tpaaccept, tpyes, home, homes, spawn, warp, rtp, back]

# 1.3.20 "MB" TRUCE: two players fighting each other both say "mb" in chat within confirm-seconds = the fight stops and both
# are out of combat (PvPManager's tag too), unless one is still fighting someone else.
truce:
  enabled: true
  confirm-seconds: 30
  words: ["mb", "mb all", "my bad", "mbmb", "mb mb"]

# 1.2.78 HAUNTED VILLAGES (Halloween): spirits rise over a village at night; beat the Lantern Wraith for Candy.
haunted-villages:
  enabled: true
  start: "10-01"
  end: "11-02"
  zone: "America/New_York"
  check-minutes: 10
  chance: 0.15          # per survival player near a village, each check, at night
  minutes: 6
  waves: 3
  wave-size: 6
  wraith-health: 160    # +20% per extra defender
  soul-flame-damage: 5
  reward-candy: 6

# 1.2.78 KRAMPUS (Christmas): rung with Krampus' Bell, or at night now and then, from December 1 to January 6.
krampus:
  enabled: true
  start: "12-01"
  end: "01-06"
  zone: "America/New_York"
  natural-chance: 0.003 # per survival player in the Overworld, every 5 minutes at night
  health: 900
  per-fighter: 0.25
  scale: 1.7
  melee: 10
  sack-break: 0.05
  reward-presents: 12
  moves:
    switch: 9
    lash: 4
    coal: 5
    howl: 6

# 1.3.0: client mods. Map mods: Xaero's Minimap is switched off by the codes it reads in chat on join (no minimap,
# fair play); any other map mod the client announces (plugin channel / client brand matching map-patterns, e.g.
# Xaero's World Map, JourneyMap, VoxelMap, FTB Chunks, a homemade "...map" mod) can't be switched off by a server, so
# map-action kicks them (kick | warn | none). Pie chart mods (pie-patterns) likewise. A mod that announces nothing
# can't be seen by any server. Bypass permission: faultline.modguard.bypass.
mod-guard:
  enabled: true
  xaero-codes: true
  motd-codes: true
  codes: ["&n&o&m&i&n&i&m&a&p", "&f&a&i&r&x&a&e&r&o"]
  map-action: kick
  pie-action: kick
  map-patterns: ["(?i)world_?map", "(?i)journey_?map", "(?i)voxel_?map", "(?i)ftb_?chunks", "(?i)map_?frontiers", "(?i)antique_?atlas", "(?i)mini_?map", "(?i)maps?(?=[:_./-]|$)", "(?i)atlas(?=[:_./-]|$)", "(?i)radar"]
  allowed-maps: ["(?i)xaero", "(?i)voxel_?map"]   # the ONLY map mods allowed (Xaero's Minimap + World Map, VoxelMap); they win over map-patterns
  no-minimap: false
  no-minimap-in-combat: true   # Xaero's minimap switches off while you're in combat, back after
  no-minimap-worlds: []        # worlds where Xaero's minimap is always off
  voxel-codes: true            # VoxelMap: no cave mode, no radar
  voxel: ["&3 &6 &3 &6 &3 &6 &d", "&3 &6 &3 &6 &3 &6 &e"]   # true = send Xaero's "no minimap" code again
  map-allow: ["(?i)^xaerominimap", "(?i)^xaero_minimap", "(?i)(key|bit|tone|mip|cube|shadow|normal|light|height|texture|block|item|color|colour|font)_?maps?(?=[:_./-]|$)"]
  pie-patterns: ["(?i)pie.?chart", "(?i)pie.?ray", "(?i)pie.?menu"]

# 1.3.0: the F3 pie chart only shows ENDER CHESTS. Every other drawn block entity (chests, shulkers, beds, signs,
# banners, heads, spawners, trial spawners, vaults, pots...) is shown to a player as the wall around it (or air) until
# they're within touch-distance, or within reveal-distance AND can see it; past rehide-distance it's faked again.
# Client-side only: the world never changes. Bypass permission: faultline.piechart.bypass.
# 1.3.5: every Faultline recipe is unlocked in everyone's recipe book on join. Bedrock (Geyser) only knows recipes that are
# unlocked, so without this Bedrock players saw no crafting result for accessories, the backpack, diving gear...
recipes:
  unlock-all: true

# 1.3.8: Unholy Arrows (skeletons / strays / bogged killed by a player drop 1-2, never spawner mobs; or craft
# Arrow + Fermented Spider Eye + Glowstone Dust + Redstone = 2). A full-draw hit gives YOU Strength II + Swiftness II.
unholy-arrows:
  drop-chance: 0.05
  buff-seconds: 3
  cooldown-seconds: 20
  strength-level: 2
  swiftness-level: 2
  min-draw: 0.9            # how far the bow must be drawn (crossbows always count)

# 1.3.4: carrying the Dragon Egg (inventory, hotbar or off hand) gives these ("EFFECT:level"; strength, speed, ...)
bedrock-shield:
  # 1.3.36: off. It put a fake block in front of Bedrock players (they saw it and bumped into it = lag).
  # Bedrock players block by sneaking (Geyser). The old `enabled` key is ignored.
  right-click: false
  hold-grace-ticks: 6    # no right-click for this long = the shield comes down

dragon-egg:
  enabled: true
  effects: ["STRENGTH:2", "SPEED:2"]

pie-limit:
  enabled: true
  touch-distance: 6
  reveal-distance: 24
  rehide-distance: 32
  checks-per-player: 96

# 1.3.9: the Upgraded Grindstone (8 Blue Obsidian round a grindstone). Right-click it = a menu that takes off any one
# enchant you click, every boss enchant, every normal enchant, or all of them.
# 1.3.13: accessory backups. The 3 accessory slots are snapshotted whenever InventoryRollbackPlus takes a backup (join,
# quit, death, world change, /irp forcebackup). Clicking IRP's "restore whole inventory" button also puts the accessories
# from that backup back. /accrestore <player> [#n] does it by hand.
accessory-backups:
  enabled: true
  keep: 80                     # newest backups kept per player
  match-seconds: 15            # how close a snapshot must be to the IRP backup's time

# 1.3.11: the Blue Obsidian Bed (3 wool over 3 Blue Obsidian). A bed for the Nether and the End: never explodes, sets
# your respawn point there, and you sleep in it during that dimension's night (FaultlineEvents' Nether / End nights).
# 1.3.41: Spawn Pads (replaced the Blue Obsidian Bed; old ones turn into white pads)
spawn-pad:
  enabled: true
  # 2.0: no spawn points in these worlds (pads there do nothing)
  no-spawn-worlds: [faultline_deep]

# 1.3.41: a Riptide trident does nothing while you're in combat (PvPManager's tag, our combat tag, or a recent player fight)
riptide-lock:
  enabled: true

upgraded-grindstone:
  enabled: true
  return-boss-books: true      # a boss enchant taken off comes back as its book
  return-vanilla-books: false  # true = normal enchants come back as enchanted books too (else XP, like a grindstone)
  remove-curses: false         # true = curses can be taken off too

# 1.3.47: the Broodmother's Eye (Shift + F = spider form until something hits you)
spider-form:
  scale: 0.55
  rig-scale: 1.5
  cooldown-seconds: 20

# 2.0: Kingdom Compasses (/adminmenu row 3). Each points at its kingdom's abandoned home in the main world.
# "x,y,z" per kingdom; leave empty for the built-in spots (the faction builds of the Faultline world).
kingdom-compass:
  world: ""
  targets:
    1: ""
    2: ""
    3: ""
    4: ""
    5: ""

# 2.0 MOUNTAIN GEAR: iron Mountain Armor (full set = climb walls), Mountaineer's Gloves / Goat Hoof Charm / Alpine Harness,
# the Ice Axe (hang on a wall), the Rope Ladder, and Mountain Zombies in mountain biomes that drop one of their things 10%.
mountain-gear:
  enabled: true
  climb:
    speed-set: 0.2            # full Mountain Armor set
    speed-gloves: 0.15        # Mountaineer's Gloves alone
    speed-both: 0.28
  chestplate-fall-reduction: 0.2
  leggings-step: 0.5          # added to the 0.6 step height = step up whole blocks
  boots-safe-fall: 3
  hoof:
    jump: 0.15                # +15% jump strength
    fall-reduction: 0.3
  harness:
    fall-reduction: 0.4
    cooldown-seconds: 60      # how often it can catch a deadly fall
  ice-axe:
    hang-seconds: 6
    leap: 0.75
  rope:
    length: 16
    seconds: 120
  zombies:
    chance: 0.25              # of natural zombies in mountain biomes (peaks, slopes, grove, meadow, windswept)
    drop-chance: 0.10         # killed by a player: one random thing it had
    climb-speed: 0.22

# 2.0 WILD MOBS: biome variants and Dire Wolf packs.
wild-mobs:
  jungle:                     # Jungle Stalkers: skeletons in jungles, poison arrows
    enabled: true
    chance: 0.3
    poison-seconds: 5
    drop-chance: 0.08         # a few poison arrows
  frost:                      # Frost Revenants: strays/skeletons in snowy biomes, freezing arrows
    enabled: true
    chance: 0.3
    drop-chance: 0.08
  storm:                      # Storm Phantoms: phantoms in the sky isles / above min-y
    enabled: true
    chance: 0.4
    min-y: 350
    extra-damage: 4
  packs:                      # Dire Wolf packs at night on the surface of wild biomes
    enabled: true
    chance: 0.02              # per survival player every 30 s
    cooldown-minutes: 15
    health: 20
    damage: 5
    alpha-health: 40
    alpha-damage: 8
    alpha-goodie-chance: 0.25

# 2.0 CLIMBERS: mountain goats you can ride, the Hang Glider, Grappling Hook upgrades.
climbers:
  goats:
    enabled: true
    tame-chance: 0.25         # per wheat
    speed: 0.3
    sprint-speed: 0.42
    jump: 0.95
  glider:
    durability: 120
    max-speed: 1.1            # blocks a tick
  hook:
    line-1: 1.5
    line-2: 2.0
    barb-cooldown-seconds: 6
    barb-max-speed: 1.8

# 2.0 THE FARLANDS, DEEPER (players a lit Rim Lighthouse covers are left alone)
outer-rim:
  enabled: true
  depth:
    bar: true               # a "Rim Depth" boss bar in the Farlands (0% at its edge, 100% at the border)
    health: 0.6             # monsters spawning at 100% depth: +60% health...
    damage: 0.4             # ...and +40% damage (scaled by depth)
  storm:
    check-minutes: 8
    chance: 0.15
    minutes: 2
  fakes:
    min-depth: 0.3
    chance: 0.08            # a minute's roll per player: footsteps, whispers, fake joins
  shards:
    chance: 0.15            # Rim Shards from Farlands monsters (1-2)
    elite-chance: 0.35      # from Elites (1-3); Elite Captains always 5-8, Echoes 3
  chart:
    range: 400
  siege:
    chance: 0.06            # every 10 min per player out there (past 15% depth)
    cooldown-minutes: 60
    sigil-chance: 0.2

# 2.0: fewer hostile mobs. This share of NATURAL / patrol hostile spawns is cancelled in every world
# (vanilla + plugin biome waves). Spawners, eggs, raids, bosses untouched. /mobspawns <percent> changes it live.
mob-spawning:
  enabled: true
  reduce: 0.5
  torches-stop-spawns: true   # no hostile spawns where torch / block light reaches (our biome waves and the Farlands too)
  light-limit: 0

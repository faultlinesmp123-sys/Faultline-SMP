# Faultline SMP - Faultline SMP Items configuration (Magic Mirror + Cloud Potion + Darkness Potion + Golden Ring + Goodie Bag)

# How long (in seconds) the teleport takes to channel. Cancels if the
# player moves or takes damage during this window.
teleport-delay-seconds: 3

# Seconds a player must wait between successful teleports.
cooldown-seconds: 10

# How many successful teleports the mirror can be used for before it
# shatters. Repair it in an anvil with a gold ingot to reset this.
max-uses: 10

# Seconds after taking damage from another player before the mirror can
# be used again. Prevents tanking a hit, waiting out the channel-cancel,
# and immediately escaping with the mirror.
combat-lock-seconds: 10

# World + coordinates the "Black Market" option teleports to.
black-market:
  world: "world"
  x: -3226
  y: 65
  z: 353

# World the "Nether" option picks a random safe spot in.
# radius is measured from x=0,z=0 in that world.
nether:
  world: "world_nether"
  radius: 5000

# Flight guard: a survival/adventure player only keeps "allowed to fly" for Bat Form, a Cloud Potion, or the
# faultline.fly / essentials.fly permission (or op). Fixes the Moon Stone creative-flight glitch.
flight-guard:
  enabled: true

# Cloud Potion settings
cloud-potion:
  duration-seconds: 35
  # Cooldown between individual double-jumps while the effect is active,
  # so holding/mashing space mid-air can't chain into infinite hover.
  per-jump-cooldown-ms: 500
  # Upward velocity applied on each double-jump (vanilla jump is ~0.42).
  jump-velocity: 0.65

# Darkness Potion settings
darkness-potion:
  duration-seconds: 25

# Golden Ring settings
golden-ring:
  exp-multiplier: 1.5        # 1.2.31 balance: was 2.0 (a cheap craft doubling all kill XP)
  # Blocks, measured from the ring-carrier, that a natural mob spawn has
  # to happen within to be eligible for the bonus-spawn roll below.
  mob-spawn-radius: 64
  # Chance for an EXTRA copy of a natural spawn to appear nearby a
  # ring-carrier. 0.5 (50%) averages out to roughly 1.5x total spawns.
  mob-spawn-extra-chance: 0.5

# Goodie Bag settings
goodie-bag:
  mob-kill-drop-chance: 0.05
  diamond-min: 3
  diamond-max: 5
  elytra-chance: 0.0001
  # Mobs from spawners don't drop Goodie Bags by default, since a spawner
  # grinder would otherwise print diamonds. Set to false to let them count.
  exclude-spawner-mobs: true
  # Bred/hatched animals, built snow/iron golems, spawn-egg mobs, and plugin-spawned mobs (boss minions,
  # raid waves) don't drop them either, or a chicken farm or a long boss fight prints diamonds.
  exclude-farmed-mobs: true

# Mythic Goodie Bag — boss-only drop (player kill required). Loot table
# (one roll per bag): 0.001% Elytra (elytra-chance), then 10% Netherite Block, 20% 5 Diamond
# Blocks, 20% Totem, 20% 2 Ancient Debris, 15% 16 XP Bottles + 2 Golden
# Apples, 15% 16 Ender Pearls.
mythic-goodie-bag:
  elytra-chance: 0.00001     # 0.001% (1 in 100,000)
  warden-drop-chance: 0.10
  wither-drop-chance: 0.125

# Bezoar settings — drops from Bees or Cave Spiders
bezoar:
  drop-chance: 0.02

# Discount Card settings — drops from killing a Villager
discount-card:
  drop-chance: 0.03          # 1.2.31 balance: was 0.10 (villagers can be bred)
  discount-percent: 10       # 1.2.31 balance: was 17.5

# Life Jelly settings — drops from Glow Squids
life-jelly:
  drop-chance: 0.05
  heal-percent: 0.01         # of max health every 2 seconds (1.2.31 balance: was a fixed 2%, a free Regeneration I forever)

# Shield of the Ocean — 100% guaranteed drop from Elder Guardians, no
# config needed for the drop chance.
shield-of-the-ocean:
  # Land movement speed boost (percentage, e.g. 0.10 = +10%).
  move-speed-boost: 0.05     # 1.2.31 balance: was 0.10 (more than the Harpy Ring's netherite-block 7.5%)
  # Swim boost via WATER_MOVEMENT_EFFICIENCY (0-1 range, added directly —
  # NOT a percentage/multiplier, since that attribute defaults to 0).
  # 0.3 is roughly one level of Depth Strider. Nerfed down from the
  # original full Dolphin's Grace effect, which was way too fast — lower
  # this further if it's still too much.
  swim-efficiency-boost: 0.3

# Mobs from spawners never drop Lava Charms, Black Belts, Moon Stones,
# Ranger Emblems, or Necromancer Staffs (otherwise a grinder farms them).
drops:
  exclude-spawner-mobs: true

# Lava Charm (accessory) — first touch of lava/fire gives immunity, then cooldown.
lava-charm:
  immunity-seconds: 7
  cooldown-seconds: 60
  bat-drop-chance: 0.05
  blaze-drop-chance: 0.10

# Black Belt (accessory)
black-belt:
  damage-reduction: 0.05
  speed-penalty: 0          # 1.2.31 balance: was 0.025 (the Bloody Wolf Scarf beat it in every way)
  # Zombies (incl. Husks, Drowned, Zombie Villagers) and Skeletons (incl. Strays)
  drop-chance: 0.01

# Moon Stone (accessory) — vampire while equipped.
moon-stone:
  # Heals this fraction of the melee damage you deal.
  lifesteal: 0.05
  # At night, heal this fraction of max health every N seconds.
  night-regen-percent: 0.05
  night-regen-interval-seconds: 5
  bat-drop-chance: 0.01
  phantom-drop-chance: 0.02  # 1.2.31 balance: was 0.05 (Strength I + Regeneration every night)
  # Shift + F (or /batform) with the Moon Stone equipped: become a bat and fly.
  bat-form:
    seconds: 20
    cooldown-seconds: 120    # starts when the bat form ends
    hearts: 2                # max health while a bat
    fly-speed: 0.12          # normal creative flight is 0.1
    scale: 0.35              # how small you get

# Ranger Emblem (accessory)
ranger-emblem:
  damage-bonus: 0.01         # 1.2.35: was 0.05 (1.2.27: 0.10); an old 0.10 or 0.05 reads as 0.01
  pillager-drop-chance: 0.02

# Necromancer Staff — needs the Necromancer's Trial quest (LimboBlackMarket) to use.
necromancer-staff:
  cooldown-seconds: 90
  min-minions: 6
  max-minions: 9
  minion-lifetime-seconds: 30
  # How recently you must have hit (or been hit by) a player for minions to attack them.
  combat-window-seconds: 15
  # Lag safety: total minions allowed on the whole server at once.
  max-minions-server: 60
  wither-skeleton-drop-chance: 0.005
  skeleton-drop-chance: 0.001
  # With no player fight going on, minions hunt hostile mobs within this range
  # (and follow you around when there's nothing to fight). Also used by the Spider Staff.
  hunt-radius: 16

# Bloody Wolf Scarf (accessory)
bloody-wolf-scarf:
  damage-reduction: 0.03     # 1.2.31 balance: was 0.05 (the same as the Black Belt, plus melee damage)
  melee-bonus: 0.025
  drop-chance: 0.05          # Piglin Brutes

# Frost Flare (accessory)
frost-flare:
  slowness-seconds: 3        # Slowness I on every hit
  speed-bonus: 0.05
  mob-spawn-radius: 64       # natural spawns are doubled within this range of a wearer
  extra-exhaustion-per-second: 0.05   # 4.0 exhaustion = 1 hunger point
  snow-golem-drop-chance: 0.0075

# Spelunker's Amulet (accessory)
spelunker-amulet:
  mining-speed-bonus: 0.10   # 1.2.31 balance: was 0.02 (you couldn't feel it)
  ore-drop-chance: 0.005     # any natural ore; player-placed ores never count

# Harpy Ring (accessory, crafted)
harpy-ring:
  speed-bonus: 0.05                    # 1.2.32: was 0.075
  elytra-durability-save-chance: 0.3   # 1.2.32: was 0.5

# Custom fishing loot (only for players who moved/looked around recently).
# The item chances are doubled in rain/thunder and again during Lantern Night.
fishing:
  afk-minutes: 5
  storm-luck-multiplier: 2.0
  ankh-shield-chance: 0.001
  mythic-goodie-bag-chance: 0.025
  goodie-bag-chance: 0.075
  potion-chance: 0.05        # Darkness or Cloud Potion
  mob-chance: 0.05           # not affected by luck
  dangerous-mob-share: 0.1   # of mob catches: Wither/Warden/10 Vexes/Charged Creeper/3 Vindicators

# Lantern Night (FaultlineEvents) bonuses applied by this plugin
lantern-night:
  drop-multiplier: 2.0
  villager-discount-percent: 10

# Vampire (custom mob) — hides among cave bats, turns into a vampire when close.
vampire:
  bat-chance: 0.025          # share of naturally spawning bats that are secretly vampires
  max-alive: 15              # lag safety: most vampires on the server at once
  notice-range: 16           # how close a player has to get before the bat hunts them
  transform-range: 2.5       # bat turns into a vampire this close to you
  flee-range: 12             # vampire turns back into a bat if you get this far away
  bat-speed: 0.5
  health: 30                 # shared between bat and vampire form (1.2.17 nerf: was 40)
  hit-damage: 5              # per claw hit (no weapon) (was 9)
  speed: 0.28
  bleed-seconds: 3
  bleed-damage: 0.5          # per second (1.0 = half a heart) (was 1.0)
  xp: 30
  gunpowder-chance: 0.5      # 3-6 gunpowder
  diamond-chance: 0.05       # 2-6 diamonds
  accessory-chance: 0.025    # a Moon Stone or a Spelunker's Amulet (50/50)
  # During a Blood Moon (FaultlineEvents), Vampires also hunt on the surface.
  blood-moon:
    enabled: true
    spawn-interval-seconds: 45   # each player can get a new Vampire this often (was 20)
    per-player: 1                # at most this many Vampires within 48 blocks of a player (was 2)
    max-alive: 12                # server-wide cap during a Blood Moon (was 25)
  # Face texture (the hash at the end of a textures.minecraft.net URL, e.g.
  # from minecraft-heads.com). Default: "Dracula".
  head-texture: "14d412d8a6b96cd7aaa8322ef75ff5f44c7888cf32240ad8c923a58cea7407a6"

# Frost Wraith (custom mob) — only spawns during a Snowy Day (FaultlineEvents),
# outside Deserts and Badlands.
frost-wraith:
  skeleton-to-stray-chance: 0.5   # during a Snowy Day, this share of Skeleton spawns become Strays
  stray-to-wraith-chance: 0.08    # share of those Strays that are Frost Wraiths
  max-alive: 10
  health: 30
  slow-seconds: 3                 # its arrows: Slowness II + freezing for this long
  xp: 15
  bow-or-book-chance: 0.30        # a plain Bow or a Power I book (50/50)
  frost-flare-chance: 0.025

# Snowy Day surface spawns. Hostile mobs normally can't spawn in daylight, so
# during a Snowy Day this spawns Strays and Zombies on the surface near players
# (where snow falls). They don't burn in the sun. Strays can become Frost Wraiths.
snowy-day-mobs:
  spawn-interval-seconds: 5   # each player gets a spawn attempt this often
  per-player-cap: 8           # max of these mobs within 48 blocks of a player
  server-cap: 60
  min-distance: 16
  max-distance: 32
  stray-share: 0.5            # the rest are Zombies

# Spider Staff — summons spiders that fight for you (same rules as Necromancer minions).
spider-staff:
  min-minions: 3
  max-minions: 5
  cave-spider-share: 0.35      # the rest are regular Spiders
  minion-lifetime-seconds: 30
  cooldown-seconds: 60
  spider-drop-chance: 0.0001   # 0.01% from regular spiders (not spawner spiders)

# Queen Spider — cave boss. (This section replaces the old "queen-spider" one;
# a leftover old section on your server is simply ignored.)
queen-spider-boss:
  spawn-chance: 0.01           # of spiders spawning underground (no sky above)
  max-alive: 2
  health: 500
  bite-damage: 12
  poison-seconds: 7            # Poison II on every bite
  brood-seconds: 8             # calls 3 Cave Spiders + 2 Spiders this often
  max-brood: 14
  stomp-cooldown-seconds: 7
  stomp-radius: 6
  stomp-damage: 10
  pounce-cooldown-seconds: 9   # leaps onto you from 6-16 blocks away
  pounce-damage: 10
  spit-cooldown-seconds: 5     # Venom Spit: Poison III + Nausea
  spit-damage: 4
  web-cooldown-seconds: 14     # Web Trap: webs all around you
  web-seconds: 5
  egg-sac-cooldown-seconds: 22 # sacs hatch into 3 Cave Spiders after 6s unless broken
  egg-sacs: 3                  # egg sacs per lay (big eggs in a web, 3-7 blocks from her: break the web)
  egg-sac-hatch-seconds: 6
  # Enraged at half health: faster, and every cooldown above is halved.
  xp: 300
  diamond-chance: 0.5          # 5-10 diamonds
  spider-staff-chance: 0.10

# Boss-only loot.
boss-loot:
  grappling-hook-chance: 0.10      # from Captain Rotbeard (the Zombie Raid boss)
  grapple-cooldown-seconds: 1.5
  grapple-max-speed: 2.6
  queen-silk-chance: 0.05          # from the Queen Spider
  silk-cooldown-seconds: 8
  silk-web-seconds: 3              # how long its webs (and the Slowness) last

# Cleft Horn (accessory) — armor penetration
cleft-horn:
  armor-penetration: 0.005   # your hits ignore this much of the target's armor protection (0.5%; an old 0.05 or 0.015 reads as 0.005)
  goat-drop-chance: 0.02

# A Weird Clock... (accessory) — immune to Slowness
weird-clock:
  cave-drop-chance: 0.01     # hostile mobs killed in caves
  max-y: 50                  # "in caves" = no open sky above AND below this height (keeps dark mob farms out)

# Hermes / Rocket / Spectre Boots (real boots-slot armor, unbreakable)
boots:
  hermes-drop-chance: 0.005  # from any vanilla mob (not spawners/spawn eggs/plugin mobs)
  rocket-drop-chance: 0.005
  hermes-trade-emeralds: 45  # Armorer trade: this + 1 Green Dye
  rocket-trade-emeralds: 60  # Armorer trade: this + 1 Harpy Ring
  rocket-charges: 7          # flight "charges" per jump (like Terraria)
  rocket-charge-ticks: 3     # length of each charge (20 ticks = 1 second; 0.17s is about 3)
  rocket-lift: 0.42          # upward push while a charge burns
  spectre-anvil-levels: 10   # XP levels to combine Hermes + Rocket into Spectre Boots

# The server's resource pack (every custom item, boss, and the Index): FaultlineSMP.zip on GitHub (main).
# Keep this ENABLED. If the pack changes, put its new SHA-1 in hash (sha1sum FaultlineSMP.zip).
# The Wardrobe (/accessories): its custom background comes from the pack (font faultline:gui). false = plain chest look.
wardrobe:
  custom-background: true

item-textures:
  enabled: true
  url: "https://raw.githubusercontent.com/faultlinesmp123-sys/Faultline-SMP/main/FaultlineSMP.zip"
  hash: "36cbc77044fc3251c11bae5a83437e04d06ac6cb"
  # The Dark Ocean's music, a second pack sent beside the main one (empty url = not sent)
  music-url: "https://raw.githubusercontent.com/faultlinesmp123-sys/Faultline-SMP/main/FaultlineDeepMusic.zip"
  music-hash: "4eeae32896366b7d39e77462ea3cd3c672e96da2"
  # 1.2.50: the plugin downloads each pack itself and sends the hash the file REALLY has (a stale hash above made
  # players' games reject the pack). It re-checks every few minutes (cheap: only downloads again if the file changed).
  auto-hash: true
  auto-hash-minutes: 10


# Immunity charms: one accessory per debuff (Guardian Scale, Ginger Root, Blindfold, Salt Ration,
# Vitamins, Soul Ward, Gravity Stone, Four-Leaf Clover, Night Lens, Wind Ward, Silk Ward, Slime Ward,
# Pest Charm). Each drops from the mob that causes its debuff. Override a drop chance like:
#   immunity-charms:
#     guardianscale-chance-guardian: 0.03
#     nightlens-chance-warden: 0.5

# The Ankh Shield only works on a shield: put a Shield (or the Shield of the Demon Eye) and the
# Ankh Shield in an anvil. While holding the imbued shield:
ankh-shield:
  anvil-levels: 15
  debuff-immunity: true       # immune to every debuff (Poison, Wither, Slowness, Blindness, ...)
  no-knockback: false         # true = also no knockback
  old-effects: false          # true = all the old powers: no knockback, no fire/freezing, and the ones below
  damage-resistance: 0.05     # 5% less damage taken
  speed-bonus: 0.15           # +15% speed
  melee-damage-bonus: 0.025   # +2.5% melee damage

# ---------------- Meteor strikes ----------------
# Every 4 hours (real time) a meteor falls in the Overworld, 1000 blocks from a random survival player. Everyone is told
# where a minute ahead. It lands in a crater (only on natural ground, never near builds), guarded by Molten Husks,
# Meteor Crawlers and a Star Sentinel. The first player to break its core (the Gilded Blackstone on top) gets the loot.
# The rock has Ancient Debris in it. Unclaimed, it cools to obsidian after 30 minutes.  /meteor now | here | stop
# Dark Loot (1.2.41): the Dark Ocean's treasure (FaultlineDeep). Unplaced chests in that world roll it on first open;
# the Dark Loot Bag rolls it too. rare-chance = the 0.1% shot at the Abyssal Diving Suit, an Elytra, a shulker of Totems,
# a shulker of Invisibility potions, or a God Set.
dark-loot:
  world: faultline_deep
  rare-chance: 0.001
  accessory-chance: 0.35
  netherite-chance: 0.4
  netherite-max: 2
  book-chance: 0.6
  boss-book-chance: 0.12
  never-accessories: []        # accessory names (as in /giveaccessory) that never come out of Dark Loot

meteor:
  enabled: true
  every-minutes: 240          # every 4 hours (old configs saying 60 get 240)
  retry-minutes: 10           # no spot / nobody online: try again this soon instead of waiting a whole interval
  warning-seconds: 60
  min-distance: 1000          # how far from a random survival player (old configs saying 250-600 get 1000)
  max-distance: 1000
  generate-land: true         # far land that isn't generated yet is generated in the background for it
  restore-terrain: true       # 1.2.40: the crater, rock and core are put back the way they were when the meteor is over
  # Random meteors never land within this many blocks of a build, a base (chests, beds, furnaces... near the surface,
  # or a chunk players have spent base-hours in) or anyone's respawn point. Villages are fine. Admins can aim one
  # anywhere: /meteor target (where you look) or /meteor at <x> <z>. /meteor check tells you if a spot is avoided.
  build-check-radius: 48
  base-hours: 3
  lifetime-minutes: 30
  crater-radius: 5
  ancient-debris: 3
  impact-damage: 14
  guards:
    molten-husks: 4
    meteor-crawlers: 4
    star-sentinels: 1
    husk-health: 40
    crawler-health: 12
    sentinel-health: 80
  loot:
    xp: 300
    items: ["DIAMOND:4-8", "EMERALD:6-12", "NETHERITE_SCRAP:1-2", "GOLD_INGOT:8-16", "AMETHYST_SHARD:8-16", "mythic_bag:1", "goodie_bag:2"]

# ---------------- The Caravan (a traveling merchant) ----------------
# Every 3 hours he sets up camp 40-100 blocks from a random survival player for one hour (everyone is told where), and
# sells rare things for diamonds, emeralds and netherite. stock lines: id:emeralds:diamonds:netherite:weight:uses
# (a trade takes at most two of the three). /caravan now | here | stop | reroll
caravan:
  enabled: true
  first-minutes: 30
  every-minutes: 180
  stay-minutes: 60
  min-distance: 40
  max-distance: 100
  offers: 8

# ---------------- The Skeleton Wanderer (a cave trader who sells accessories) ----------------
cave-trader:
  enabled: true
  chance: 0.05              # every check, each player underground has this chance of him showing up nearby
  check-seconds: 120
  below-y: 50               # "underground" = below this height with no sky above
  max-traders: 3            # on the whole server at once
  lifetime-minutes: 8       # then he packs up and wanders off
  offers: 5                 # how many different wares he has
  scale: 1.0
  # id:emeralds:diamonds:weight (higher weight = shows up more often)
  stock:
    - "guardian_scale:14:0:5"
    - "ginger_root:12:0:5"
    - "blindfold:14:0:5"
    - "salt_ration:12:0:5"
    - "vitamins:14:0:5"
    - "soul_ward:18:0:4"
    - "gravity_stone:16:0:4"
    - "four_leaf_clover:14:0:5"
    - "night_lens:20:0:3"
    - "wind_ward:16:0:4"
    - "silk_ward:12:0:5"
    - "slime_ward:12:0:5"
    - "pest_charm:12:0:5"
    - "golden_ring:24:0:3"
    - "climbing_claws:28:0:3"
    - "bezoar:24:0:3"
    - "discount_card:32:0:2"
    - "life_jelly:30:0:2"
    - "shield_of_the_ocean:36:2:2"
    - "lava_charm:30:0:3"
    - "black_belt:28:0:3"
    - "spelunker_amulet:24:0:4"
    - "harpy_ring:30:0:3"
    - "ranger_emblem:34:1:2"
    - "diving_helmet:22:0:5"
    - "flipper:22:0:5"
    - "depths_charm:40:4:1"
    - "kraken_worm:16:0:3"

# ---------------- Diving gear (after Calamity's) ----------------
diving:
  drops:
    helmet-from-drowned: 0.015
    flipper-from-guardians: 0.02
    depths-charm-from-elder-guardians: 0.33
  crush-depth:              # deep underwater AND out of breath hurts (for a future underwater boss)
    enabled: true
    below-y: 0
    damage: 2.0             # per second (halved by the Depths Charm or Abyssal Diving Gear)
  suit:                     # the Abyssal Diving Suit stops working when a PLAYER hits you
    combat-seconds: 10      # ...for this long
    off-when-mobs-hit: false   # true = monsters' hits switch it off too
    off-when-attacking: false  # true = hitting a player yourself switches it off too

# ---------------- The Kraken's items ----------------
kraken-gear:
  worm-from-dirt: 0.005       # chance per dirt/grass/coarse dirt/rooted dirt/mud/podzol block you dig
  drops:
    coral-lung-from-pufferfish: 0.03
    glow-gland-from-glow-squid: 0.04
    eelskin-wrap-from-drowned: 0.02

# Mirror..?? (accessory, dropped by the Kraken): a big hit is thrown back at whoever dealt it
mirror:
  cooldown-seconds: 45
  min-hit-share: 0.33      # only hits taking at least this share of your max health
  max-reflect: 30          # most damage sent back

# ---------------- Weather events (Weather.java) ----------------
# AURORA some nights (XP x2, cheaper enchanting till dawn), SANDSTORM in deserts (dust, husks, buried treasure), BLIZZARD
# in snowy biomes (keep warm: a fire within 4 blocks or 2+ leather pieces), ECLIPSE at midday (5 min night, neutral mobs
# turn hostile), LOCUSTS on farms (they eat crops until driven off). /fevent <kind> | stop | status
weather:
  enabled: true
  aurora: {enabled: true, chance-per-night: 0.2, xp-multiplier: 2.0, enchant-cost-multiplier: 0.7, height: 38, size: 1.2}  # height above the ground, size 1 = 24 blocks wide
  sandstorm: {enabled: true, chance-per-minute: 0.006, minutes: 6, radius: 110, husks-per-player: 4, treasure-chance: 0.04, treasure-per-player: 3,
              treasure: ["GOLD_INGOT:2-6", "EMERALD:1-4", "DIAMOND:1-2:25", "GOLDEN_APPLE:1:15", "RABBIT_FOOT:1:30"]}
  blizzard: {enabled: true, chance-per-minute: 0.006, minutes: 6, radius: 110, cold-per-half-second: 26, strays-per-player: 6}
  eclipse: {enabled: true, chance-per-minute: 0.003, minutes: 5, sun-height: 55, sun-size: 1.0}   # only each player's sky goes dark: the world's time keeps running
  locusts: {enabled: true, chance-per-minute: 0.004, minutes: 4, count: 12, health: 6, min-crops: 16,
            rewards: ["EMERALD:3-6", "BONE_MEAL:16", "WHEAT_SEEDS:8"]}

# ---------------- Creatures (Creatures.java) ----------------
mimic: {enabled: true, chance: 0.01, health: 60, damage: 8, speed: 0.32, xp: 40}
skeleton-knights: {enabled: true, check-seconds: 300, chance: 0.12, health: 32, captain-health: 50, helm-chance: 0.06}

# ---------------- Gear (Gear.java): mining helmet headlamp ----------------
gear: {headlamp-reach: 12, light-level: 13}


# ---------------- Maces (1.2.15) ----------------
# mode: remove   = maces are gone: every mace anywhere is deleted (players' inventories and ender chests, bundles and
#                  shulker boxes, every container as its chunk loads, items on the ground, frames, armor stands, mobs,
#                  animal/minecart/boat chests, loot, drops) and they can't be crafted. Each removal is logged.
#       restrict = maces can't be crafted and only live in a player's own inventory (never a chest, bundle, frame...)
#       off      = vanilla
# faultline.mace.bypass (default false) skips it for that player.
mace:
  enabled: true
  mode: remove
  no-crafting: true
  inventory-only: true

# ---------------- Spawn protection (1.2.17) ----------------
# After respawning, players can't hurt you for this long. Attacking a player ends it early.
spawn-protection:
  enabled: true
  seconds: 30
  block-mobs: false            # true = monsters can't hurt or target you either
  ends-on-any-attack: false    # true = hitting any creature (not only a player) ends it

# Boss enchant books (1.2.17): bosses drop books of enchantments vanilla doesn't have; item left, book right in an
# anvil. Two books of the same level make the next. /fenchant list, /fenchant give <id> [level] [amount] [player].
enchants:
  boss-drops-enabled: true
  anvil-levels-per-level: 6
  lifesteal: {per-level: 0.08, max-per-hit: 3}
  frostbite: {chance-per-level: 0.15}
  venom: {chance-per-level: 0.15}
  thunderstrike: {chance: 0.08, damage: 4, cooldown-seconds: 8}
  vitality: {max-regeneration-level: 2}   # Vitality I = Regeneration I, II = Regeneration II (1.2.46)
  featherstep: {fall-reduction: 0.35}
  veinminer: {max-blocks: 32, exclude: []}   # Vein Miner (pickaxes): sneak + mine an ore; exclude e.g. [ANCIENT_DEBRIS]
  # Index boss entry id: ["enchant:level:chance", ...] (each rolled on every defeat, per fighter)
  boss-drops:
    the_demon_eye: ["thunderstrike:1:0.25", "featherstep:1:0.2"]
    queen_spider: ["venom:1:0.3"]
    the_bulwark: ["vitality:1:0.2"]
    the_great_hog: ["vitality:1:0.25"]
    captain_rotbeard: ["lifesteal:1:0.2"]
    mortimer_freeze: ["frostbite:1:0.3"]
    the_dune_devourer: ["venom:1:0.3"]
    the_frostmaw: ["frostbite:2:0.25"]
    don_lorenzo: ["lifesteal:1:0.3"]
    the_kraken: ["thunderstrike:1:0.3"]
    the_kraken_at_sea: ["thunderstrike:1:0.3"]
    diamond_jacob: ["vitality:2:0.35"]
    rocco_vendetta: ["lifesteal:2:0.35"]
    brine_scourge: ["lifesteal:2:0.35", "venom:2:0.35", "veinminer:1:0.25"]
    umbral_leviathan: ["vitality:2:0.35", "thunderstrike:1:0.35", "veinminer:1:0.25"]
    coralia: ["featherstep:1:0.2", "frostbite:1:0.2"]
    old_inkjaw: ["venom:1:0.2", "lifesteal:1:0.15"]
    grandmaw_clam: ["vitality:1:0.2"]
    the_lament: ["lifesteal:1:0.2", "frostbite:2:0.1"]
    the_skeleton_captain: ["thunderstrike:1:0.3"]
    grimtusk: ["lifesteal:1:0.3", "vitality:1:0.2"]
    leviathan: ["thunderstrike:1:0.2"]
    sandworm_king: ["venom:2:0.2"]
    lich: ["lifesteal:2:0.2"]
    frost_wyrm: ["frostbite:2:0.25"]
    stone_golem: ["vitality:1:0.2", "veinminer:1:0.3"]
    ghost_captain: ["featherstep:1:0.3"]

# Elytra races (1.2.17): admins build a course (/race create, /race cp add) and host it (/race host <course> [lend]).
race:
  default-radius: 6
  countdown-seconds: 5
  max-minutes: 10
  lend-by-default: false      # /race host <course> lend gives everyone an elytra + rockets for the race
  lend-rockets: 16
  boat-type: OAK_BOAT         # boat races: everyone gets one of these
  horse-speed: 0.3            # horse races: everyone gets the same horse (vanilla horses are 0.1125-0.3375)
  horse-jump: 0.75
  rewards:                    # console commands, {player} = the racer
    first: ["givemythicbag 2 {player}"]
    second: ["givemythicbag 1 {player}"]
    third: ["givegoodiebag 2 {player}"]
    finish: []

# /sit (1.2.18): right-click a stair or a bottom slab with an empty hand, or /sit where you stand.
sit:
  enabled: true
  click-stairs: true

# Staff vanish (1.2.18): /vanish. Fake leave/join messages for the players who can't see you.
vanish:
  fake-messages: true
  pickup: false               # vanished staff pick up items

# Hot air balloons (1.2.24): craft (5 wool around a campfire, string, barrel, string), set up, fly. Fuel: coal/charcoal 60 s,
# blaze rod 150 s, coal block 600 s, burned while in the air.
# PvP limits (1.2.37). Creative / spectator players are never limited.
pvp-limits:
  lunge-cooldown-seconds: 5        # spear Lunge: once every 5 s (on cooldown the jab still hits, without the lunge). 0 = off
  cobweb-place-cooldown-ms: 250    # one cobweb every 0.25 s per player. 0 = off

balloon:
  speed: 0.35              # blocks a tick (sprint = x1.6)
  climb-speed: 0.22        # rising / sinking with Jump / Sneak
  sink-speed: 0.06         # sinking with no fuel
  max-fuel-seconds: 1800
  # 1.2.36: hit a landed balloon (any item; an axe counts double) this many times within 3 s of each other to take it down.
  # It drops as its item (colour and fuel kept). /balloon list, /balloon remove [#n | all [player]].
  hits-to-break: 4
  break-reach: 5
  anyone-can-break: false   # false = only its owner and admins (items.balloon.admin)

# /ping and /coords (1.2.24): Bedrock has no F3 screen. true = Bedrock players see the coordinates bar from their first join.
where:
  bedrock-coords-on-join: false

# Camera mode (1.2.23): /camera = a free camera for recording (spectator, back where you were with /camera again).
camera:
  enabled: true               # false = only faultline.camera.unlimited (ops) can use it
  max-distance: 64            # how far from where you started the camera can fly (0 = no limit)
  combat-seconds: 10          # can't start it this soon after hitting / being hit
  combat-includes-mobs: true  # ...by monsters too, not just players
  no-clip: false              # 1.2.25: false = the camera can't fly inside solid blocks (from inside the ground you see every cave and base: x-ray)

# Fishing (1.2.18): every fish has a weight; all-time records per species; tournaments (/fishing start [minutes]).
fishing:
  enabled: true
  minutes: 15
  auto-every-hours: 0         # 0 = only when an admin starts one
  auto-min-players: 2
  monster-chance: 0.01        # a 1.5x fish
  tag-fish-in-tournament: true   # tournament fish show their weight (they won't stack)
  announce-first-records: false  # the very first fish of a species is a "record" too: announce it?
  rewards:
    first: ["givemythicbag 2 {player}"]
    second: ["givemythicbag 1 {player}"]
    third: ["givegoodiebag 2 {player}"]

# Crop seasons (1.2.26): real-world months each crop is in season (the server's time zone). In season: grows faster and
# ripe harvests sometimes give one more; out of season: grows slower. /crops shows the calendar. Nether Wart: no seasons.
crop-seasons:
  enabled: true
  zone: "America/New_York"
  in-season-boost: 0.35      # chance a growth step gives an extra stage
  harvest-bonus: 0.25        # chance a ripe in-season harvest drops one more
  off-season-skip: 0.25      # chance an out-of-season growth step doesn't happen
  months:                    # 1 = January ... 12 = December
    wheat: [6, 7, 8, 9]
    carrots: [3, 4, 5, 9, 10]
    potatoes: [3, 4, 5, 10, 11]
    beetroots: [9, 10, 11, 12]
    pumpkins: [8, 9, 10]
    melons: [6, 7, 8]
    berries: [7, 8, 9, 12]
    sugar_cane: [4, 5, 6, 7]
    cocoa: [1, 2, 6, 7]
    cactus: [6, 7, 8]
    bamboo: [3, 4, 5, 6]
    flowers: [4, 5, 6]

# Mount stats (1.2.26): right-click a horse / donkey / mule / llama / camel with a plain stick.
mount-stats:
  enabled: true

# Death coordinates (1.2.26): on respawn only you are told where you died; /lastdeath any time.
death-coords:
  enabled: true

# Ranger gear (1.2.27): 8 bow accessories (see the Index). Drops only from mobs a player killed (no spawners).
ranger-gear:
  quickdraw-drop-chance: 0.01        # Skeletons, Strays, Bogged
  quickdraw-full-at: 0.75            # a draw this full shoots like a full one
  windrunner-drop-chance: 0.03       # Breezes
  windrunner-speed: 1.08     # 1.2.31 balance: was 1.2 (arrow damage grows with speed: +20% speed was +20% damage)
  phantom-drop-chance: 0.02          # Phantoms (Phantom Fletching)
  oath-drop-chance: 0.03             # Evokers (Ranger's Oath Pendant)
  oath-health: 2                     # 1.2.39: Ranger's Oath set bonus, +2 MAX_HEALTH (+1 heart)
  oath-speed: 0.1            # 1.2.31 balance: was 0.2 (a whole Speed I)
  oath-arrow-bonus: 0.10             # 1.2.38: Ranger's Oath set bonus, +10% arrow damage
  ricochet-elite-skeleton-chance: 0.015   # ELITE skeletons/strays/bogged only (very rare)
  ricochet-commander-chance: 0.01         # Bone Commanders
  ricochet-speed: 0.75
  pouch-save-chance: 0.3
  monocle-range: 160

# Trinkets (1.2.28): nine more accessories (see the Index).
trinkets:
  fang-heal: 4                       # Bloodthirst Fang: health per kill of a monster or player (4 = 2 hearts; 1.2.31: was 6, any kill)
  fang-cooldown-seconds: 3
  fang-ravager-chance: 0.08
  fang-vindicator-chance: 0.01
  pauldron-knockback-resistance: 0.15
  crest-jacob-chance: 0.4            # Gladiator's Crest: each fighter who beats Diamond Jacob
  crest-radius: 10
  crest-max: 4
  guardian-radius: 8
  guardian-reduction: 0.01           # Guardian's Oath: kingdom-mates near you take 1% less damage
  lantern-radius: 4
  lantern-seconds: 3
  lantern-cooldown-seconds: 1.5
  thumb-radius: 8
  thumb-boost: 0.15
  treasure-drowned-chance: 0.03
  treasure-range: 30
  smelter-chance: 0.2
  featherfall-blocks: 5

# Ancient Core (accessory, from Stone Golem gear parts). 1.2.31 balance: was +3 armor, +25% knockback resistance and
# +2 hearts, more than Diamond Jacob's Diamond Heart from a far harder fight.
# Diamond Heart (Diamond Jacob drop). 1.2.38: take this fraction less from every kind of damage (replaced +2 hearts).
diamond-heart:
  damage-reduction: 0.08

ancient-core:
  armor: 2
  knockback-resistance: 0.15
  health: 0

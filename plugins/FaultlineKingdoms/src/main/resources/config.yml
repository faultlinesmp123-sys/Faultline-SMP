# FaultlineKingdoms: Kingdom 1, 2 and 3, assigned from Discord roles, and grace periods.

kingdoms:
  1: {name: "Kingdom 1", color: "RED"}
  2: {name: "Kingdom 2", color: "BLUE"}
  3: {name: "Kingdom 3", color: "GREEN"}

# Grace periods: /kingdoms grace <all|1|2|3> <on|off> [time]  (time: 30m, 2h, 1d, 1h30m; nothing = until turned off)
grace:
  protected-can-attack: false   # can someone under grace hit other players? false = no (no hitting from safety)
  show-actionbar: true          # a reminder in the action bar while your grace is on

pvp:
  friendly-fire: true           # can members of the same kingdom hurt each other? (the default; each kingdom can vote)
  # each kingdom votes its own friendly fire: /kingdom ff <on|off|clear>; the majority wins once enough have voted
  # (a tie, or too few votes = friendly-fire above). Admins can fix it: /kingdoms ff <1|2|3> <on|off|vote>.
  friendly-fire-vote:
    enabled: true
    min-votes: 3

# 1.4.0 TREATIES: /kingdom ally <1|2|3> <yes|no|clear>. Two kingdoms are allied while BOTH want it: at least min-votes of
# each kingdom's members voted and more said yes than no. Allies can't hurt each other. When a treaty breaks, PvP between
# them stays off for break-grace-minutes (no backstab mid-fight). Staff: /kingdoms treaty <a> <b> <on|off|vote>.
treaties:
  enabled: true
  min-votes: 3
  break-grace-minutes: 5

# 1.4.0 KINGDOM CHAT: /kc <msg> (your kingdom), /ac <msg> (your kingdom + allies); alone they toggle. kingdoms.spy sees all.
kingdom-chat:
  enabled: true
  max-length: 256
  tags: {}    # short names for the chat tag, e.g. {1: "K1"} (default = the kingdom's name)

# Show the kingdom in the tab list and above heads ("[Kingdom 1] name")
display:
  tab-prefix: true
  head-tag: true              # 1.3.0: the kingdom above everyone's name tag (or the outlaw line with no kingdom)
  outlaw-name: "Outlaw"       # shown for players in no kingdom
  outlaw-color: "DARK_RED"
  tab-outlaw: true            # outlaws get "Outlaw" in the tab list too
  head-tag-scale: 0.85
  head-tag-offset: 0.45       # 1.4.1: how far over the top of the hitbox (sits right on the name tag; an old 0.78 reads as 0.45)
  head-tag-view-range: 0.7    # x 64 blocks

# DISCORD: who's in which kingdom comes from their roles in your Discord server.
# 1. https://discord.com/developers/applications > New Application > Bot > Reset Token > copy it into bot-token below.
# 2. On the same Bot page turn ON "Server Members Intent".
# 3. OAuth2 > URL Generator > scope "bot" (no permissions needed) > open the link > add it to your server.
# 4. Discord settings > Advanced > Developer Mode ON; right-click your server > Copy Server ID (guild-id);
#    Server Settings > Roles > right-click each kingdom role > Copy Role ID.
# Players link once: /kingdom link <their discord name>, the bot DMs them a code, /kingdom verify <code>.
# KEEP THE TOKEN ONLY IN THE SERVER'S COPY OF THIS FILE (never in the GitHub repo: anyone with it controls the bot).
discord:
  bot-token: ""
  guild-id: ""
  roles:
    1: "1553886942100328539"    # role ID for Kingdom 1
    2: "1553986213311029338"    # Kingdom 2
    3: "1557134028488843374"    # Kingdom 3
  sync-minutes: 5               # re-check online players' roles this often (and always when they join)
  slash-commands: true          # /stats <player> in your Discord server (the bot answers with their stats)
  remove-when-role-gone: true   # lost the role / left the Discord = no kingdom
  link-code-minutes: 10
  # 1.2.0: messages typed in this Discord channel show up in game as "[Discord] name: message" (webhook posts and bots
  # are skipped, so the logs/chat mirror never echoes). Needs the bot's MESSAGE CONTENT INTENT on (developer portal >
  # your bot > Bot > Privileged Gateway Intents). Channel ID: right-click the channel > Copy Channel ID.
  chat-bridge:
    enabled: true
    channel-id: ""
    format: "&9[Discord] &f{name}&7: &f{message}"
    max-length: 256
  # 1.4.0: each kingdom's own Discord channel. /kc messages are posted there by the bot, and what's typed there shows up
  # in game for that kingdom only. Needs the Message Content intent (like the chat bridge) and the bot needs View Channel
  # + Send Messages in those channels. Make the channels visible only to that kingdom's role in Discord.
  kingdom-chat:
    enabled: true
    channels:
      1: ""
      2: ""
      3: ""
    format: "&9[Discord] {kingdom} &f{name}&7: {color}{message}"

# Bedrock players get /kingdom as a menu (Floodgate/Geyser forms): link, verify, friendly fire, members.
bedrock-forms: true

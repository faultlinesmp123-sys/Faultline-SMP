name: FaultlineKingdoms
version: '1.4.3'
main: net.faultlinesmp.kingdoms.FaultlineKingdoms
api-version: '1.21'
author: FaultlineSMP
description: Kingdoms 1, 2 and 3 (assigned from Discord roles) and grace periods, server-wide or per kingdom
softdepend: [floodgate, Geyser-Spigot, FaultlineIndex, LimboBlackMarket]

commands:
  kingdom:
    description: "Your kingdom and the grace periods; link your Discord: /kingdom link <discord name>, /kingdom verify <code>"
    usage: /kingdom [link <discord name>|verify <code>|unlink|list <1|2|3>|ff <on|off|clear>|ally <1|2|3> <yes|no|clear>]
    aliases: [k]
  kc:
    description: "Kingdom chat: /kc <message>, or /kc alone to talk only to your kingdom until /kc again"
    usage: /kc [message]
    aliases: [kchat, kingdomchat]
  ac:
    description: "Alliance chat: your kingdom + its allies (treaties). /ac alone toggles it"
    usage: /ac [message]
    aliases: [allychat]
  kingdoms:
    description: "Admin: /kingdoms grace <all|1|2|3> <on|off> [time], set <player> <1|2|3|none|auto>, tp <1|2|3|outlaws|all> [player], sync, reload"
    usage: /kingdoms <grace|set|ff|treaty|tp|spy|sync|status|reload>
    permission: kingdoms.admin

permissions:
  kingdoms.spy:
    description: See every kingdom's /kc and /ac (toggle with /kingdoms spy)
    default: op
  kingdoms.admin:
    description: Grace periods and setting players' kingdoms
    default: op

name: FaultlineKingdoms
version: '2.0.0'
main: net.faultlinesmp.kingdoms.FaultlineKingdoms
api-version: '2.0.0'
author: FaultlineSMP
description: Five factions (assigned by staff) and grace periods, server-wide or per faction
softdepend: [floodgate, Geyser-Spigot, FaultlineIndex, LimboBlackMarket]

commands:
  faction:
    description: "Your faction, its friendly-fire and treaty votes, and the grace periods"
    usage: /faction [list <1-5>|ff <on|off|clear>|ally <1-5> <yes|no|clear>]
    aliases: [f, kingdom, k]
  fc:
    description: "Faction chat: /fc <message>, or /fc alone to talk only to your faction until /fc again"
    usage: /fc [message]
    aliases: [fchat, factionchat, kc, kchat, kingdomchat]
  ac:
    description: "Alliance chat: your faction + its allies (treaties). /ac alone toggles it"
    usage: /ac [message]
    aliases: [allychat]
  factions:
    description: "Admin: /factions grace <all|1-5> <on|off> [time], set <player> <1-5|none|auto>, tp <1-5|outlaws|all> [player], sync, reload"
    usage: /factions <grace|set|ff|treaty|tp|spy|sync|status|reload>
    aliases: [kingdoms]
    permission: kingdoms.admin

permissions:
  kingdoms.spy:
    description: See every faction's /fc and /ac (toggle with /factions spy)
    default: op
  kingdoms.admin:
    description: Grace periods and setting players' factions
    default: op

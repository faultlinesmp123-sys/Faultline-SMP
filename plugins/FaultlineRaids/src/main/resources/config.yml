# Faultline SMP - Zombie Raids

omen:
  minutes: 60                  # how long a drunk Zombie Omen lasts before fading
  countdown-seconds: 30        # near a village, the raid starts after this long
  trial-chest-chance: 0.10     # Trial Chamber chests
  trial-vault-chance: 0.10     # Trial Chamber vaults

village:
  radius: 48
  min-villagers: 3             # this many villagers nearby counts as a village

raid:
  seconds-between-waves: 10
  max-wave-size: 30            # lag safety
  abandon-seconds: 120         # lost if no survival player is within 96 blocks this long
  max-minutes: 30              # lost if it runs this long

rewards:
  # Goodie Bags: level I 5-6 ... level V 9-10. Mythic Goodie Bags: I-II 1, III-IV 1-2, V 1-3.
  # Ankh Shield chance = this x the raid level (level V = 1%).
  ankh-chance-per-level: 0.002

mobs:
  archer-arrow-damage: 2.0
  bomber-power: 3.0            # creeper-sized; hurts, never breaks blocks
  bomber-death-power: 2.5      # when a Bomber is killed (1 second warning)
  bat-bite-damage: 3.0
  flyer-dive-damage: 5.0
  mage-orb-damage: 5.0         # plus a little Poison

captain:
  chance-per-night: 0.05       # per player, at nightfall

# Captain Rotbeard, the Zombie Captain: a pirate boss after the last wave of
# high-level raids. The raid isn't won until he's dead.
boss:
  min-level: 4                 # Omen IV and V raids
  health: 500
  melee-damage: 10
  sweep-damage: 9              # Cutlass Sweep
  flintlock-damage: 10         # Flintlock Shot
  cannon-power: 2.5            # Cannon Barrage (never breaks blocks)
  slam-damage: 10              # Anchor Slam
  slam-radius: 6
  xp: 300
  # Face textures (textures.minecraft.net hashes, e.g. from minecraft-heads.com)
  head-texture: "7a8832a7b0ae0f028186b586a56ff7c0bae3d3f60d09e76cdc15f07f0d3b311f"       # "Drowned Captain"
  crew-head-texture: "bbe94fd31b82222432f27b60d765a5d622fd76c4e3a8807f9a1d41fb707afae0"  # "Drowned Pirate"

# The Skeleton Army: some nights a Bone Commander and 3-5 soldiers march on a player.
# He drops a Skeleton Omen (starts a Skeleton Raid), a Goodie Bag, and good loot.
skeleton-army:
  chance-per-night: 0.05     # per player, at nightfall (rolled separately from the Zombie Army)
  rider-chance: 0.25         # each extra soldier: chance to be a Bone Rider
  war-horn-seconds: 15       # how often a Bone Commander buffs his army (Speed + Strength)
  bow-chance: 0.35           # the Commander's Bow (Power IV, Unbreaking II, Punch I)
  # tougher skeletons
  soldier-health: 30         # Skeleton Soldiers, Frost/Bog Archers, Bone Riders
  shieldbearer-health: 36
  wither-brute-health: 60
  commander-health: 80
  arrow-damage-multiplier: 1.3
  # the Commander's moves (War Horn above, plus these; one every few seconds, faster for the raid champion)
  move-seconds: 6
  arrow-rain-arrows: 14
  arrow-rain-damage: 4
  piercing-shot-damage: 12
  piercing-shot-knockback: 1.2
  call-cap: 6                # Call to Arms won't summon more if this many of his side are nearby
  disengage-strength: 1.1
  disengage-arrow-damage: 6

# Skeleton Raids (from Skeleton Omens) use the same raid settings as Zombie Raids; levels IV-V
# end with a champion Bone Commander instead of Captain Rotbeard.
skeleton-raid:
  champion-health: 300

# Piglin Raids: a Piglin Brute killed by a player has horn-chance to drop a Piglin War Horn (always level III-V).
# Blow it and you carry a Piglin Omen; go near a village in the Overworld and the Piglins march on it.
# III = 6 waves, IV = 8, V = 10. Every wave is wave-size piglins; The Bulwark marches in wave 5, The Great Hog ends it.
# Raid piglins and hoglins never turn into zombified ones.
piglin-raid:
  horn-chance: 0.05
  # Each raid piglin killed by a player: nugget-chance to drop nugget-min..nugget-max gold nuggets (no gear).
  nugget-chance: 0.8
  nugget-min: 3
  nugget-max: 5
  wave-size: 15
  grunt-health: 20
  mage-health: 24
  summoner-health: 26
  summoned-health: 14
  rider-hoglin-health: 40
  sapper-health: 18
  shieldbearer-health: 30
  lobber-health: 22
  runt-health: 8
  banner-health: 28
  medic-health: 22
  sapper:
    power: 2.5                 # its TNT (never breaks blocks)
  shieldbearer:
    front-block: 0.75          # damage blocked from the front
  lobber:
    seconds: 4
    zone-seconds: 4            # how long the ground burns
    zone-damage: 2
  banner:
    seconds: 8                 # Strength + Speed for nearby piglins this often
  medic:
    seconds: 5
    heal: 8
  mage:
    burst-damage: 5            # the flame burst when you get close
  summoner:
    seconds: 10                # between portals
    max-alive: 4               # Grunts it can have out at once
  balloon:
    health: 30
    height: 12                 # blocks above the ground
    speed: 0.22
    bomb-seconds: 3.5
    bomb-power: 2.0            # never breaks blocks or starts fires
  bulwark:                     # mini boss, wave 5
    health: 220
    health-per-level: 60       # per raid level above III
    melee-damage: 12
    bash-damage: 9
    slam-damage: 10
    xp: 150
  great-hog:                   # the boss, after the last wave
    health: 600
    health-per-level: 200
    scale: 2.4
    melee-damage: 12
    charge-damage: 13
    stomp-damage: 9
    breath-damage: 3
    stun-seconds: 3            # after charging into a wall (takes 50% more damage)
    xp: 400

# ============================================================================
# FAULTLINE SHIPS
# Craft a blueprint, right-click open water, place every glowing block, sail.
#   Sloop Blueprint:      paper on 4 sides of any boat
#   Brigantine Blueprint: gold in the corners, paper on the sides, a Sloop Blueprint in the middle
#   Galleon Blueprint:    diamonds in the corners, paper on the sides, a Brigantine Blueprint in the middle
#   Shipwright's Hammer:  3 iron / iron, planks, iron / stick
#   Ship Cannon:          3 iron / iron, gunpowder / log, log;  Cannonball (x4): iron + gunpowder
# Health 0 = wrecked: it can't sail until a hammer brings it back to full (timing minigame).
# ============================================================================

# How many ships (built or still being built) one player can have.
max-ships-per-player: 3

# Ships appear when a player is this close to them.
spawn-range: 128
# Walk around on a ship while it sails: the deck stays solid and carries you along. Fall off? Swim to the hull and
# hold Jump (or right-click the hull) to climb back aboard. false = the old way (everyone sits while it sails).
walkable-deck: true
spawn-blocks-per-tick: 120   # ship blocks spawned per tick across all ships (a fleet appears over a second or two instead of freezing clients)

# Per ship: speed-multiplier (1.0 = Sloop 7.2 m/s, Brigantine 6, Galleon 5; Sprint is +25%)
# and health-multiplier (1.0 = Sloop 150, Brigantine 350, Galleon 700).
ships:
  small:  {speed-multiplier: 1.0, health-multiplier: 1.0}
  medium: {speed-multiplier: 1.0, health-multiplier: 1.0}
  big:    {speed-multiplier: 1.0, health-multiplier: 1.0}

# Damage ships take. Melee: axe 8, sword 5, mace 6, trident 5, pickaxe 3, anything else 1 (owner and crew can't hurt their own ship).
# Explosions: TNT 60, creeper 40 (charged 80), fireball 18, falling off over explosion-radius blocks.
# Arrows and tridents hit sailing ships too (arrow = its damage, burning x1.5, trident 6).
damage:
  melee-multiplier: 1.0
  explosion-multiplier: 1.0
  explosion-radius: 7
  projectile-multiplier: 1.0
# Running into the shore at more than half speed (scaled by speed).
ram-damage: 30

# The hammer minigame: each good hit fixes hit-percent of max health, a perfect (gold) one perfect-percent.
repair:
  planks-per-hit: 1
  hit-percent: 7
  perfect-percent: 12

# Cannons: built into each ship's cannon spots with Ship Cannons (5 iron, 1 gunpowder, 2 logs).
# On board, right-click with a Cannonball (iron + gunpowder = 4) looking over the side: the nearest ready cannon on
# that side fires (aim up to 35 degrees off straight out). The ball blows up where it lands.
cannon:
  reload-seconds: 3
  speed: 2.4            # blocks per tick
  explosion-power: 2.0
  break-blocks: false   # true lets cannonballs blow holes in the land
  hit-damage: 10        # extra damage to a mob or player it hits directly
  ship-damage: 45       # to a ship it lands on (less further away, up to ship-radius blocks)
  ship-radius: 4

# How fast a ship at 0 health sinks (blocks a tick). Players' ships settle with the deck awash (repair raises them);
# skeleton ships go all the way down.
sink-speed: 0.006

# Damage you can see: every hp-per-broken-block damage knocks out the block nearest the hit (at most max-broken-per-hit
# at once, max-broken-fraction of the ship in all). Holes are patched with the hammer by standing within reach of them.
parts:
  hp-per-broken-block: 6
  max-broken-per-hit: 6
  max-broken-fraction: 0.35
  reach: 6
# Ramming another ship hurts it this much more than it hurts you.
ram-other-multiplier: 1.6

# ============================================================================
# SKELETON SHIPS AND THE PIRATE INVASION
# Every check-seconds, each player sailing the ocean has ship-chance to meet a skeleton ship (a Pirate Ship crewed by
# skeletons) and invasion-chance to meet the whole Pirate Invasion. A Cursed Pirate Horn (found in skeleton ships'
# holds) calls the invasion too. Admin: /ship pirates <ship|invasion|horn|spawn <mob>|stop>
# ============================================================================
pirates:
  # THE GHOST SHIP, "The Wailing Mary" (GhostShip.java): on dark nights she may appear instead of a skeleton ship (chance per
  # roll, doubled in rain). Untouchable until someone within lantern-range holds a Lantern of Souls (FaultlineItems): then
  # she anchors and turns solid; without the lantern for solid-seconds she fades again. Captain Hollow fights on her deck.
  ghost-ship: {enabled: true, chance: 0.03, spawn-distance: 55, sight: 160, lantern-range: 30, solid-seconds: 20, lifetime-minutes: 15,
               captain-health: 400, captain-damage: 9, sweep-damage: 9, rewards: {mythic-bags: 2, goodie-bags: 2, disc-chance: 0.25}}
  enabled: true
  check-seconds: 60
  ship-chance: 0.05
  invasion-chance: 0.01
  require-ocean: true
  spawn-distance: 75
  health-multiplier: 0.5        # skeleton ships' health, times the ship's normal health
  sight: 200                    # how far a lone skeleton ship sees (and chases) you
  leave-after-seconds: 90       # a lone ship nobody's near sails off
  cannon-range: 48
  reload-seconds: 4.5
  cannon-spread-degrees: 6      # 2 when a Skeleton Navigator has spotted you (you glow)
  ram-when-below: 0.35          # they ram a ship below this much health (or a stopped one, or one with no cannons)
  shots-before-boarding: 6      # cannonballs a skeleton ship fires before it pulls alongside to board (or your hull under 60%)
  swim-speed: 0.2
  horn-chance: 0.15             # a Cursed Pirate Horn in a lone skeleton ship's hold (0.05 in an invasion ship's)
  powder-monkey-power: 2.2
  gunner-power: 1.4
  bosses:
    son-health: 320
    commander-health: 480
    captain-health: 900
    xp: 300
  invasion:
    sight: 400                  # how far invasion ships hunt the fighters (so none of the fleet drifts off)
    ships: 15                   # plus the flagship
    flagship-distance: 120
    min-distance: 62
    depth: 45
    arc-degrees: 70
    spacing: 22
    max-minutes: 25
    music-seconds: 291          # length of sounds/pirates/music.ogg (it loops)
    # everyone who fought gets these when the Skeleton Captain falls ({player}, {accessory}, {lo-hi})
    rewards:
      - {command: "givemythicbag 2 {player}", chance: 1.0}
      - {command: "giveaccessory {accessory} 1 {player}", chance: 1.0}
      - {command: "zraid omen 5 1 {player}", chance: 0.5}
      - {command: "ship give pirate 1 {player}", chance: 0.25}
  flagship-waits-for: 3         # the flagship hangs back until this few escorts are left
  # the first time a player opens a skeleton ship's hold: these on top of what's in it
  plunder:
    - {command: "givegoodiebag 1 {player}", chance: 0.6, name: "a Goodie Bag"}
    - {command: "giveaccessory {accessory} 1 {player}", chance: 0.35, name: "an accessory"}
    - {command: "zraid omen {1-3} 1 {player}", chance: 0.4, name: "a Bad Omen"}
    - {command: "givecloudpotion 1 {player}", chance: 0.3, name: "a Cloud Potion"}
  accessories: [claws, bezoar, discount, jelly, shield, lavacharm, blackbelt, ranger, scarf, frostflare, spelunker, harpy, divinghelmet, flipper]
